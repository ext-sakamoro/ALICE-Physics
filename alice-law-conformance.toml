note = "the property that holds is that no RUN-VARYING or address-dependent iteration order reaches Law output: the std maps (default hasher seeded from OS randomness) are banned and the Law-bearing maps use crate::det_hash::DetHashMap (src/det_hash.rs, FNV-1a with a fixed offset basis, no OS seeding), so a DetHashMap's iteration is identical on every run and target for the same insertion sequence (FNV-1a order is a function of the insertion sequence and capacity, not of an OS seed, so it does not vary per run). The ban is enforced two ways: clippy.toml's disallowed-types bans std::collections::HashMap / HashSet, checked by the default and native all-targets lanes (ci.yml:593 default, :601 native, -D warnings) and, since commit 89a5a289, by the wasm / python / no-default library lib lanes too (ci.yml:634-636 now pass -D clippy::disallowed_methods -D clippy::disallowed_types, where before they passed only disallowed_methods); scripts/entropy_guard.py's lexical HashMap / HashSet pattern is a readable second layer over feature-gated src. The parallel / thread-count clause (thread scheduling must not vary Law output) is pinned by tests/multi_world_try_step_all.rs::parallel_matches_sequential (gated on the parallel feature): it runs a rayon pool at 1, 2 and 8 threads and asserts try_step_all_parallel returns the sequential results in world order and leaves every world bit for bit identical to try_step_all at each thread count (the analytic nbody and vehicle participant determinism tests add further coverage). DetHashMap is used in contact_cache, the TGS solver, sdf_sph and sdf_fem_mesh. A third pinned mechanism: the snapshot writer sorts the TGS impulse-cache entries into a Vec by key before writing (src/solver/world_snapshot.rs:1869), and as of main that sort IS pinned -- the test src/solver/world_snapshot.rs::impulse_cache_is_written_in_ascending_id_order inserts the same entries in two orders (one into a map grown so its iteration order differs from ascending) and asserts the snapshot blobs match, so removing the writer sort makes the two blobs differ and reddens the test. So the snapshot determinism here rests on three things: the fixed-seed DetHashMap, the std-map ban, and that now-pinned ascending-id write."
