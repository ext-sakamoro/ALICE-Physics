since = ""
note = "f32/f64 max/min go through the Law helpers crate::det_math::max / min (src/lib.rs:361, pub(crate) -- an internal Law helper the crate's own code uses, not a public API consumers call), which implement IEEE 754-2019 maximumNumber / minimumNumber: the source comment states that std f32/f64 max/min leave the sign of an equal pair of zeros unspecified and differing between targets (x86_64's f64::min(0.0,-0.0) is -0 unoptimised and +0 optimised), and these functions fix it (NaN yields the other operand; an equal pair of zeros yields +0 from max and -0 from min, which is what aarch64 already does). Raw f32/f64 max/min are a default-deny: .github/clippy-lib/clippy.toml bans f32::max/min and f64::max/min as disallowed-methods, enforced by the CI steps 'Clippy (library code, f32 / f64 max and min forbidden)' and 'Clippy (library code, max / min forbidden, wasm and python bindings, no_std)' (both CLIPPY_CONF_DIR=.github/clippy-lib), with 'Library clippy configuration is current and fires' (scripts/clippy_lib_gate.py) as the canary; tests, examples and benches are exempt by design. There is no raw_* exception manifest because there are no exceptions, and max/min has no SIMD variant (the simd feature accelerates Vec3Fix dot/add/sub only; solver hot paths are scalar, README Determinism), so the gate's per-SIMD-width clause has no additional width to test here."
