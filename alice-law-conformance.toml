since = ""
note = "the property that holds is that no RUN-VARYING or address-dependent iteration order reaches Law output: the std maps (default hasher seeded from OS randomness) are banned and the Law-bearing maps use crate::det_hash::DetHashMap (src/det_hash.rs, FNV-1a with a fixed offset basis, no OS seeding), so a DetHashMap's iteration is identical on every run and target for the same insertion sequence (FNV-1a order is a function of the insertion sequence and capacity, not of an OS seed, so it does not vary per run). The ban is enforced two ways: clippy.toml's disallowed-types bans std::collections::HashMap / HashSet, checked by the default and native all-targets lanes (`.github/workflows/ci.yml#- name: Clippy (default features, lib + all targets)` and `.github/workflows/ci.yml#- name: Clippy (full native feature set, lib + all targets)`, -D warnings) and, since commit 89a5a289, by the wasm / python / no-default library lib lanes too (`.github/workflows/ci.yml#- name: Clippy (library code, max / min forbidden, wasm and python bindings, no_std)` now pass -D clippy::disallowed_methods -D clippy::disallowed_types, where before they passed only disallowed_methods); scripts/entropy_guard.py's lexical HashMap / HashSet pattern is a readable second layer over feature-gated src. The parallel / thread-count clause (thread scheduling must not vary Law output) is pinned by tests/analytic_nbody_participant.rs::parallel_steps_agree_with_each_other_and_with_the_serial_path (gated on the parallel feature, run by the ci.yml test step with --features parallel): it runs try_step_parallel in a rayon pool at 1, 2 and 8 threads and asserts the world snapshots are bit for bit identical, and equal to try_step's bodies and payload (tests/analytic_vehicle_participant.rs::parallel_agrees_with_threads_and_serial adds the same check for the vehicle participant). DetHashMap is used in contact_cache, the TGS solver, sdf_sph and sdf_fem_mesh. A third pinned mechanism: the snapshot writer sorts the TGS impulse-cache entries into a Vec by key before writing (`src/solver/world_snapshot.rs#let cache = &self.tgs_impulse_cache;>entries.sort_unstable_by_key(|e| e.0);`), and as of main that sort IS pinned -- the test src/solver/world_snapshot.rs::impulse_cache_is_written_in_ascending_id_order inserts the same entries in two orders (one into a map grown so its iteration order differs from ascending) and asserts the snapshot blobs match, so removing the writer sort makes the two blobs differ and reddens the test. So the snapshot determinism here rests on three things: the fixed-seed DetHashMap, the std-map ban, and that now-pinned ascending-id write."
