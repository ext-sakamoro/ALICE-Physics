since = ""
note = "alice-physics computes its own identifier: PHYSICS_SEMANTICS_ID (src/semantics.rs:191, cd9aa3b8... on current main) is the fold of PHYSICS_SEMANTICS_PINS, a table of the crate's stepping-semantics pins together with one entry holding alice_det_math::SEMANTICS_ID (135c407d...), so the identifier folds the crate's own Law pins with the upstream arithmetic crate's identifier -- the textbook G6 shape. tests/physics_semantics_id.rs checks that every entry equals the digest constant its golden asserts, that the det-math entry equals alice_det_math::SEMANTICS_ID, that the fold equals PHYSICS_SEMANTICS_ID, that the fold separates what it should (one changed bit, length-prefix), and that it matches a known byte layout; the constant is the same in every build regardless of feature set. Staleness is therefore visible: a moved pin or a bumped det-math id that is not re-recorded reddens the test. Version / toolchain tie: the folded det-math entry is alice_det_math::SEMANTICS_ID at the version Cargo.lock pins (alice-det-math 0.5 in Cargo.toml resolving to 0.5.0, id 135c407d), built on the pinned toolchain (rust-toolchain.toml channel 1.98.1; Cargo.toml rust-version / MSRV 1.85), so the identifier is defined against that det-math version and that toolchain. Scope: PHYSICS_SEMANTICS_PINS folds the crate stepping combinations plus the one alice-det-math entry only; the OPTIONAL Law-bearing upstreams this crate can pull (alice-analytics, alice-db, alice-zip) are NOT folded into PHYSICS_SEMANTICS_ID, so a change in their arithmetic would not move this id. Dependency risk: alice-det-math 0.5.1 is published, and cargo update -p alice-det-math --precise 0.5.1 makes tests/physics_semantics_id.rs::the_det_math_entry_is_the_det_math_identifier FAIL because the recorded 135c407d no longer equals the new det-math id; the fix is the pending det-math branch (a per-generation table PHYSICS_SEMANTICS_BY_DET_MATH), after which this id becomes 85e08846 and the det row 79ca5297. This cell is measured against current main (det-math 0.5.0) and must be re-recorded when that branch lands."
