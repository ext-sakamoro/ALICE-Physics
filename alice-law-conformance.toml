# ALICE-Law conformance manifest for this crate (alice-physics). One entry
# per gate defined in ALICE-Law's conformance/gates.toml. Schema (status /
# evidence / since / note / reference_repo) is docs/CONFORMANCE.md's
# "Manifest" section in that repository; a `pass` or `n/a` entry also names
# the red mutant that turns the evidence red.
#
# Entries here are written from what this repository's own commits, CI
# workflows and test suites show at origin/main, checked directly rather than
# assumed: a gate without concrete evidence is `unverified`, not guessed
# `pass`. alice-physics is a deterministic physics engine. Its Law-bearing
# arithmetic is Fix128 fixed-point for the solver state plus the f32/f64 field
# modules that README "Determinism" lists as inside the guarantee (generated
# by scripts/f32_modules.py, pinned by tests/determinism_golden_f32.rs); it
# consumes alice-det-math 0.5 for transcendentals and folds det-math's
# identifier into its own.

