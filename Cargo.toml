[package]
name = "alice-physics"
version = "1.5.0"
edition = "2021"
# MSRV-aware dependency resolution (cargo 1.84+); paired with the CI `msrv` job
# that compiles with exactly `rust-version` (std + no_std) so the claim is verified.
resolver = "3"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Deterministic physics engine: 128-bit fixed-point rigid bodies with bit-exact, replayable results, typed observation and rollback for search and planning, plus FEM, CFD and 3D-print analysis modules"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
repository = "https://github.com/ext-sakamoro/ALICE-Physics"
homepage = "https://github.com/ext-sakamoro/ALICE-Physics"
documentation = "https://docs.rs/alice-physics"
keywords = ["physics", "deterministic", "fixed-point", "xpbd", "simulation"]
categories = ["game-development", "simulation", "science"]
# 1.85: `f32::abs` / `f64::abs` are `core` (no_std build) since 1.85; the lockfile
# is v4 (cargo 1.78+) and rayon-core 1.13 needs 1.80. The previous "1.70.0" claim
# had never been compiled (1.70 cannot even parse the lockfile).
rust-version = "1.85"
readme = "README.md"

# docs.rs build feature set — omits `wasm` because it is mutually exclusive with
# `ffi` at the crate level (see `compile_error!` in `src/lib.rs`). docs.rs builds
# with a stable Rust toolchain, so both `wasm-bindgen` bindings and C ABI FFI
# would try to be linked at once; we intentionally pick the `ffi` side so the
# published API surface on docs.rs covers Unity / UE5 / game-engine host use.
# Downstream consumers targeting `wasm32-*` should build locally with
# `--features wasm` (dropping `ffi`).
[package.metadata.docs.rs]
features = ["std", "simd", "parallel", "ffi", "gpu-solver-bridge"]
rustdoc-args = ["--cfg", "docsrs"]

# cargo-machete false-positive suppression (canonical [[reference_alice_ci_canonical_template]] 罠 #3)
# js-sys: wasm feature 用 optional dep、machete が feature-gated 依存を検出不能
[package.metadata.cargo-machete]
ignored = ["js-sys"]

[lib]
name = "alice_physics"
path = "src/lib.rs"
# rlib for Rust users; cdylib (.so/.dll/.dylib) + staticlib (.a) for the C ABI
# consumers (`--features ffi`: Unity C# P/Invoke, unreal-plugin/, include/).
# Before 1.2.0 only the rlib was produced, so the Unity / UE5 bindings had
# nothing to link against.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["std"]
std = ["alice-det-math/std"]
simd = []            # Enable SIMD (AVX2) optimizations for x86_64
parallel = ["rayon"] # Parallel constraint solving via graph coloring
python = ["pyo3", "numpy"] # Python bindings (PyO3 + NumPy zero-copy)
ffi = ["std"]              # C FFI for Unity/UE5/game engines
wasm = ["wasm-bindgen", "js-sys"] # WebAssembly bindings for browsers
gpu-solver-bridge = ["std"]  # GpuSolverBridge trait for external GPU offload (opt-in, no runtime overhead when off)
# J-4 restoration (v0.14.0-preview.8、2026-09-13) — sibling 3 crate が crates.io に
# publish されたため、v0.14.0-preview.4 で削除した bridge 3 feature を復活
# - alice-ml 0.2.0 / alice-db 0.2.0-beta.2 / alice-analytics 0.1.0 全て crates.io 済
# - sibling API drift 対応は各 bridge module 側で restoration commit 内で修正
neural = ["dep:alice-ml", "std"]        # Deterministic neural controller (ALICE-ML × Physics)
replay = ["dep:alice-db", "std"]        # Replay recording/playback via ALICE-DB
analytics = ["dep:alice-analytics", "std"]  # ALICE-Analytics simulation profiling

[dependencies]
rayon = { version = "1.8", optional = true }
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
numpy = { version = "0.27", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
# J-4 restoration: sibling 3 crate (今日 crates.io publish 済)
alice-ml = { version = "0.2", optional = true, default-features = false, features = ["std"] }
alice-db = { version = "0.2.0-beta.2", optional = true, default-features = false }
alice-analytics = { version = "0.1", optional = true, default-features = false, features = ["std"] }
# 1.3.0: `det_math` moved to its own crate so alice-sdf (and anything else)
# evaluates the same transcendental law; re-exported as `alice_physics::det_math`.
# no_std-capable (software sqrt without `std`), so the module is no longer
# gated on `std`.
alice-det-math = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", default-features = false }
# v1.0 Item E: determinism golden tests hash by SHA-256 (platform-independent
# canonical hash) — dev-only, does not affect production surface
sha2 = "0.10"

# loom model test of the graph-colouring invariant the batched solver's raw
# pointer wrappers rely on (`--cfg loom`, quality-deep `loom` job, 1.2.0).
# Target-gated: loom's `generator` dependency has no wasm32 backend and broke
# the wasm32-wasip1 CI test job (dev-deps are built for `cargo test`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
loom = "0.7"

