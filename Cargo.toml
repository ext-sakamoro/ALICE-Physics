[package]
name = "alice-physics"
version = "1.5.0"
edition = "2021"
# MSRV-aware dependency resolution (cargo 1.84+); paired with the CI `msrv` job
# that compiles with exactly `rust-version` (std + no_std) so the claim is verified.
resolver = "3"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Deterministic 128-bit Fixed-Point Physics Engine"
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
repository = "https://github.com/ext-sakamoro/ALICE-Physics"
homepage = "https://github.com/ext-sakamoro/ALICE-Physics"
documentation = "https://docs.rs/alice-physics"
keywords = ["physics", "deterministic", "fixed-point", "xpbd", "simulation"]
categories = ["game-development", "simulation", "science"]
# 1.85: `f32::abs` / `f64::abs` are `core` (no_std build) since 1.85; the lockfile
# is v4 (cargo 1.78+) and rayon-core 1.13 needs 1.80. The previous "1.70.0" claim
# had never been compiled (1.70 cannot even parse the lockfile).
rust-version = "1.85"
readme = "README.md"

# docs.rs build feature set — omits `wasm` because it is mutually exclusive with
# `ffi` at the crate level (see `compile_error!` in `src/lib.rs`). docs.rs builds
# with a stable Rust toolchain, so both `wasm-bindgen` bindings and C ABI FFI
# would try to be linked at once; we intentionally pick the `ffi` side so the
# published API surface on docs.rs covers Unity / UE5 / game-engine host use.
# Downstream consumers targeting `wasm32-*` should build locally with
# `--features wasm` (dropping `ffi`).
[package.metadata.docs.rs]
features = ["std", "simd", "parallel", "ffi", "gpu-solver-bridge"]
rustdoc-args = ["--cfg", "docsrs"]

# cargo-machete false-positive suppression (canonical [[reference_alice_ci_canonical_template]] 罠 #3)
# js-sys: wasm feature 用 optional dep、machete が feature-gated 依存を検出不能
[package.metadata.cargo-machete]
ignored = ["js-sys"]

[lib]
name = "alice_physics"
path = "src/lib.rs"
# rlib for Rust users; cdylib (.so/.dll/.dylib) + staticlib (.a) for the C ABI
# consumers (`--features ffi`: Unity C# P/Invoke, unreal-plugin/, include/).
# Before 1.2.0 only the rlib was produced, so the Unity / UE5 bindings had
# nothing to link against.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["std"]
std = ["alice-det-math/std"]
simd = []            # Enable SIMD (AVX2) optimizations for x86_64
parallel = ["rayon"] # Parallel constraint solving via graph coloring
python = ["pyo3", "numpy"] # Python bindings (PyO3 + NumPy zero-copy)
ffi = ["std"]              # C FFI for Unity/UE5/game engines
wasm = ["wasm-bindgen", "js-sys"] # WebAssembly bindings for browsers
gpu-solver-bridge = ["std"]  # GpuSolverBridge trait for external GPU offload (opt-in, no runtime overhead when off)
# J-4 restoration (v0.14.0-preview.8、2026-09-13) — sibling 3 crate が crates.io に
# publish されたため、v0.14.0-preview.4 で削除した bridge 3 feature を復活
# - alice-ml 0.2.0 / alice-db 0.2.0-beta.2 / alice-analytics 0.1.0 全て crates.io 済
# - sibling API drift 対応は各 bridge module 側で restoration commit 内で修正
neural = ["dep:alice-ml", "std"]        # Deterministic neural controller (ALICE-ML × Physics)
replay = ["dep:alice-db", "std"]        # Replay recording/playback via ALICE-DB
analytics = ["dep:alice-analytics", "std"]  # ALICE-Analytics simulation profiling

[dependencies]
rayon = { version = "1.8", optional = true }
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
numpy = { version = "0.27", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
# J-4 restoration: sibling 3 crate (今日 crates.io publish 済)
alice-ml = { version = "0.2", optional = true, default-features = false, features = ["std"] }
alice-db = { version = "0.2.0-beta.2", optional = true, default-features = false }
alice-analytics = { version = "0.1", optional = true, default-features = false, features = ["std"] }
# 1.3.0: `det_math` moved to its own crate so alice-sdf (and anything else)
# evaluates the same transcendental law; re-exported as `alice_physics::det_math`.
# no_std-capable (software sqrt without `std`), so the module is no longer
# gated on `std`.
alice-det-math = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", default-features = false }
# v1.0 Item E: determinism golden tests hash by SHA-256 (platform-independent
# canonical hash) — dev-only, does not affect production surface
sha2 = "0.10"

# loom model test of the graph-colouring invariant the batched solver's raw
# pointer wrappers rely on (`--cfg loom`, quality-deep `loom` job, 1.2.0).
# Target-gated: loom's `generator` dependency has no wasm32 backend and broke
# the wasm32-wasip1 CI test job (dev-deps are built for `cargo test`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
loom = "0.7"

[[example]]
name = "basic_physics"
required-features = ["std"]

# Measurement harness for the HPC-parallel work: reports how far the current
# single-process engine is from the hundreds-of-millions-of-elements target, in
# both time and memory. Needs `std` for `Instant`.
[[example]]
name = "hpc_scale_probe"
required-features = ["std"]

[[example]]
name = "cloth_simulation"
required-features = ["std"]

[[example]]
name = "cfd_smoke_plume"
required-features = ["std"]

[[example]]
name = "structural_pla_shelf_creep"
required-features = ["std"]

[[example]]
name = "print_full_safety"
required-features = ["std"]

[[example]]
name = "buckmaster_alpoge_boussinesq_r2"
required-features = ["std"]

[[example]]
name = "buckmaster_alpoge_euler_r3"
required-features = ["std"]

[[example]]
name = "gpu_sdf_batch_queries"
required-features = ["std"]

[[example]]
name = "filament_database_properties"
required-features = ["std"]

[[example]]
name = "linear_elastic_fem_config_diagnostics"
required-features = ["std"]

# Production entry point for the P3 mesh topology helpers (wiring_guard:
# src/cubic_elastic_fem.rs had zero production callers across 9 items:
# corner_count, edge_node_count, edge_nodes, element_count, element_nodes,
# face_node, face_node_count, interior_node_positions_are_exact,
# shape_values — only tests/ called in, which the guard does not count).
[[example]]
name = "cubic_elastic_fem_topology"
required-features = ["std"]

# Production entry point for the `neural` feature's fixed-point ternary
# controller (wiring_guard: src/neural.rs had zero production callers).
[[example]]
name = "neural_ternary_controller"
required-features = ["std", "neural"]

[[example]]
name = "substep_interpolation"
required-features = ["std"]

# Production entry point for the `analytics` feature's ALICE-Analytics
# profiling bridge (wiring_guard: src/analytics_bridge.rs had zero
# production callers).
[[example]]
name = "analytics_bridge_telemetry"
required-features = ["std", "analytics"]

# Production entry point for the `replay` feature's ALICE-DB-backed replay
# recorder/player (wiring_guard: src/replay.rs had zero production callers).
[[example]]
name = "replay_recording"
required-features = ["std", "replay"]

# Production entry point for `MultiWorld`/`Portal` (wiring_guard:
# src/multi_world.rs had zero production callers across all 8 pub items:
# add_world, step_all, step_all_parallel, total_body_count, transfer_body,
# world_count, Portal::transform_a_to_b, Portal::transform_b_to_a).
[[example]]
name = "multi_world_management"
required-features = ["std"]

# Production entry point for `PiezoElement` (wiring_guard: src/piezoelectric.rs
# had zero production callers across all 7 items: pzt_5a, quartz, pvdf,
# permittivity, force_from_voltage, voltage_from_force, strain_under_stress —
# only tests/ called in, which the guard does not count).
[[example]]
name = "piezoelectric_materials"
required-features = ["std"]

# Production entry point for SDF-driven force fields (wiring_guard:
# src/sdf_force.rs had zero production callers across all 7 pub items:
# apply_sdf_force_fields, attract, compute_sdf_force, contain, repel,
# surface_flow, with_affected_bodies).
[[example]]
name = "sdf_force_fields"
required-features = ["std"]

# Production entry point for `CompoundShape` (wiring_guard: src/compound.rs
# had zero production callers across all 8 pub items: add_sphere,
# add_capsule, add_convex_hull, add_box, compute_aabb, child_world_aabb,
# world_aabb, overlapping_children — only tests/ called in, which the guard
# does not count).
[[example]]
name = "compound_shapes"
required-features = ["std"]

# Production entry point for the remaining `src/raycast.rs` ray queries
# (wiring_guard: ray_aabb, ray_capsule, raycast_aabbs, raycast_all_aabbs,
# raycast_all_spheres, raycast_any_aabbs, raycast_any_spheres,
# raycast_spheres, sweep_sphere had zero production callers -- ray_sphere /
# ray_plane in the same file were already wired via PhysicsWorld::raycast).
[[example]]
name = "spatial_raycast_queries"
required-features = ["std"]

# Production entry point for CCD time-of-impact queries (wiring_guard:
# src/ccd.rs had zero production callers across 8 items: needs_ccd,
# sphere_capsule_toi, capsule_plane_toi, aabb_plane_toi, swept_aabb,
# adaptive_toi_substeps, speculative_contact, conservative_advancement.
# Of these, adaptive_toi_substeps is deliberately NOT wired here -- it is
# a documented skeleton being implemented for real by a separate task;
# this entry point covers the other 7).
[[example]]
name = "continuous_collision_detection"
required-features = ["std"]

# Production entry point for `Rope` pin constraints and SDF collision
# (wiring_guard: src/rope.rs had zero production callers across 6 items:
# add_pin, pin_start, pin_end, update_pin_targets, current_length,
# step_with_sdf -- only tests/ called in, which the guard does not count).
[[example]]
name = "rope_pin_constraints"
required-features = ["std"]

# Production entry point for ContactCache's warm-start API (wiring_guard:
# src/contact_cache.rs had zero production callers across apply_warm_start,
# manifold_count, point_count, store_impulses, tangent_frame,
# total_contact_points, warm_start_impulse). Deliberately NOT wired into
# PhysicsWorld::step() -- see this example's module doc.
[[example]]
name = "contact_warm_start_cache"
required-features = ["std"]

# Production entry point for Arrhenius combustion / soot / Boussinesq
# buoyancy (wiring_guard: src/smoke_fire.rs had zero production callers
# across all 6 items: ArrheniusReaction::{methane_air, pla_air},
# reaction_rate_kg_per_m3_s, heat_release_j_per_m3_s,
# soot_generation_kg_per_m3_s, boussinesq_buoyancy_n_per_m3 — only
# tests/engineering_oracles_fluid.rs (methane preset only) called in, which
# the guard does not count).
[[example]]
name = "smoke_fire_combustion"
required-features = ["std"]

[[bench]]
name = "physics_bench"
harness = false
# Keeps `cargo check --no-default-features --all-targets` (used by downstream
# consumers like ALICE-Arena) from compiling the bench without `std`.
required-features = ["std"]

[[bench]]
name = "stage_breakdown"
harness = false

[[bench]]
name = "stage_breakdown_collider"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# `unwind`, not `abort`: the FFI layer promises "returns 0 on internal panic" via
# `catch_unwind`, which only holds when panics unwind. `abort` would take the
# Unity / UE5 host process down with it (1.2.0; was `abort`).
panic = "unwind"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
debug = false
codegen-units = 1

[lints.rust]
# `--cfg loom` selects the loom model tests (quality-deep `loom` job)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
