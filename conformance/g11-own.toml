gate = "G4"
checker = ".github/workflows/ci.yml#- name: Test (ALICE-Law G4 goldens and G8 snapshot form, zero executed is red)>scripts/run_tests.sh"
canary = "tests/determinism_golden_f32.rs::golden_sim_field"
zero = "scripts/test_run_tests.py::RunTests.test_a_named_file_that_ran_zero_fails"
shared = ["scripts/run_tests.sh", "scripts/test_run_tests.py"]

