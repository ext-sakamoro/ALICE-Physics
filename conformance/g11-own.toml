# ALICE-Law G11: this repository's own rows of conformance/g11.toml (the rows of the checkers the ALICE
# crates share are generated from ALICE-Law). ALICE-Law's scripts/g11_table_gen.py writes conformance/g11.toml
# from both.
#
# A test suite run by scripts/run_tests.sh has run_tests.sh's zero test as its compared-nothing test (it
# fails a step when a named test binary ran no test, or fewer than its minimum), and a test of a binary the
# leg names as its canary.

[[row]]
gate = "G2"
checker = "scripts/g2_rewrite_check.py"
canary = "scripts/test_g2_rewrite_check.py::G2RewriteCheck.test_each_form_is_flagged_until_reviewed"
zero = "scripts/test_g2_rewrite_check.py::G2RewriteCheck.test_an_empty_tree_and_a_tree_without_sites_fail"
shared = "n/a: this crate's table of max / min written as comparisons over its own src/; no other crate carries it"

[[row]]
gate = "G2"
checker = "scripts/g2_comparisons.py"
canary = "scripts/test_g2_comparisons.py::Judge.test_a_float_comparison_without_a_row"
zero = "scripts/test_g2_comparisons.py::Judge.test_no_comparison_found"
shared = "n/a: this crate's compiler-typed inventory of every ordering comparison in its own src/; no other crate carries it"

[[row]]
gate = "G3"
checker = "tools/no-outer-fneg-of-fma/src/main.rs"
canary = "tools/no-outer-fneg-of-fma/src/main.rs::parenthesised_outer_negation_is_caught"
zero = "tools/no-outer-fneg-of-fma/src/main.rs::no_readable_src_file_fails"
shared = ["tools/no-outer-fneg-of-fma/src/main.rs", "tools/no-outer-fneg-of-fma/Cargo.toml", "tools/no-outer-fneg-of-fma/Cargo.lock"]

