[workspace]
# own workspace: this tool is not a member of the crate's build, so its
# dependencies (syn, proc-macro2, quote) never constrain the library

[package]
name = "g2-rewrite-scan"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later OR LicenseRef-Commercial"
description = "Syntax-tree scan for max / min / clamp written as comparisons (ALICE-Law G2), read by scripts/g2_rewrite_check.py"

[[bin]]
name = "g2-rewrite-scan"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
# "span-locations" makes the fallback lexer report real lines and columns
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
