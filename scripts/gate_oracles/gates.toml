# One [[gate]] entry per gate this repository relies on, each with at
# least one must-red control (expect = "fail") and one must-green control
# (expect = "pass"). See docs/GATE_ORACLES.md for the format and
# scripts/gate_oracle_check.py for the runner.
#
# Populated gate by gate (docs/GATE_ORACLES.md section 9), each addition
# its own change.

[[gate]]
id = "mutants-exclude-check"
kind = "script"
source = "scripts/mutants_exclude_check.py"
# calls the real `cargo mutants --list --no-config` against this checkout
# (no fixture can stand in for that), so this is a cost = "cargo" gate.
#
# `run` does not itself pin color: every control already runs under the
# runner's forced_env() (CARGO_TERM_COLOR=always), the same condition
# ci.yml forces for its own log viewer, which once made cargo-mutants
# wrap each line's identifier in ANSI escapes and broke every exclude_re
# pattern's match. That is why this gate needs the must-green control
# below to load at all (see COLOR_PIN_MARKERS in
# scripts/gate_oracle_check.py).
run = "python3 {script} --mutants-toml {dir}/mutants.toml --baseline {dir}/baseline.txt"
cost = "cargo"

[[gate.control]]
case = "red-pattern-matches-nothing"
expect = "fail"
reason = "matches 0 mutants"

[[gate.control]]
# A pattern naming an identifier directly adjacent to another word (not
# a bare module-path prefix like "tests::"). cargo-mutants colors more
# than just the identifier -- operators, replacement values and return
# types are each wrapped too -- but "tests::" sits immediately before
# wherever the next colored span starts, never inside one, so it stays
# contiguous with whatever came before it and keeps matching regardless.
# A pattern spanning a word and the identifier right after it does not
# have that property: a false negative discovered while building this
# control, which never actually caught the regression it was meant to
# prove resilience against until replaced with this one.
case = "green-identifier-adjacent-pattern"
expect = "pass"

[[gate]]
id = "bench-counts-check"
kind = "script"
source = "scripts/bench_counts_check.py"
run = "python3 {script} {dir}/bench.txt"
cost = "fast"

[[gate.control]]
case = "red-zero-count"
expect = "fail"
reason = "measured 0 instructions"

[[gate.control]]
case = "green-non-zero-count"
expect = "pass"
