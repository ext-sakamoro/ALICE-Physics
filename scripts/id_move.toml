# scripts/id_move_check.py (ALICE-Law G9): the identifiers whose value may move only with a
# breaking version, the previous-identifier list that must keep the released value, and the
# release tags the base is read from (its values come from the published crate)
package = "alice-physics-core"
# released as alice-physics up to 3.1.0 (the engine was renamed when the facade crate took that name)
base-package = "alice-physics"
manifest = "Cargo.toml"
tags = ["v{version}"]
# every feature but wasm (compile_error! with ffi; src/wasm.rs adds no [u8; 32] item)
doc-features = ["std", "simd", "parallel", "ffi", "python", "privacy-crypto", "gpu-solver-bridge", "neural", "analytics"]

[exempt]
RR_MAX_EPSILON_WHOLE = "alice-crypto's dp::RR_MAX_EPSILON_WHOLE (a u64 bound on the randomized-response epsilon), re-exported in privacy: rustdoc gives a re-export no type, it is not an identifier"

[[id]]
path = "alice_physics_core::semantics::PHYSICS_SEMANTICS_ID"
previous = "alice_physics_core::semantics::PREVIOUS_PHYSICS_SEMANTICS_IDS"
# the 3.1.0 value (79ca5297) is not kept: alice-det-math 0.5.2 changed the clamp, which moved Law
# output bits, and no cross-version oracle covers a 3.1.0 snapshot yet; 4.0.0 is a major release

[[id]]
# the domain of PhysicsWorld::state_digest: a stored digest (a replay or a shared solution checked
# against it) is computed from it, so it moves only as an identifier does (a breaking version, both
# values in CHANGELOG.md); tests/state_digest.rs pins its bytes and the golden digest it gives
path = "alice_physics_core::PhysicsWorld::STATE_DIGEST_DOMAIN"


[[id]]
# the domain of Cloth::state_digest: a stored cloth digest is computed from it, so it moves only
# as an identifier does (a breaking version, both values in CHANGELOG.md); tests/cloth_state_digest.rs
# pins its bytes and the golden digest it gives
path = "alice_physics_core::cloth::Cloth::CLOTH_DIGEST_DOMAIN"

[[id]]
# the domain of TransientSolver::state_digest (the finite element solvers' own digest, not yet part
# of the world's): a stored digest is computed from it, so it moves only as an identifier does
# (a breaking version, both values in CHANGELOG.md); tests/analytic_dynamic_fem_corotational.rs
# pins the replay and the digest it gives
path = "alice_physics_core::dynamic_fem::TransientSolver::STATE_DIGEST_DOMAIN"

[[id]]
# the same bytes as TransientSolver::STATE_DIGEST_DOMAIN (the two solvers' states differ in content)
path = "alice_physics_core::dynamic_fem::CorotationalTransientSolver::STATE_DIGEST_DOMAIN"
