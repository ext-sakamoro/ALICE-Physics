# Per-repository data of scripts/clippy_lib_gate.py (the script is the same file in every
# repository that carries it): the library-only entries of .github/clippy-lib/clippy.toml and the
# canary forms, each with the path its disallowed-method / disallowed-type diagnostic must name

header = """\
# Generated by scripts/clippy_lib_gate.py from the repository's clippy.toml:
# do not edit (python3 scripts/clippy_lib_gate.py --write)
#
# The library code (`cargo clippy --lib`, CLIPPY_CONF_DIR=.github/clippy-lib)
# also may not call f32 / f64 max and min, nor f32 / f64 clamp; tests, examples
# and benches use the root configuration
"""

[[method]]
path = "f32::max"
reason = "the sign of an equal pair of zeros is unspecified and differs between targets; use alice_physics::det_math::max / min"

[[method]]
path = "f32::min"
reason = "the sign of an equal pair of zeros is unspecified and differs between targets; use alice_physics::det_math::max / min"

[[method]]
path = "f64::max"
reason = "the sign of an equal pair of zeros is unspecified and differs between targets; use alice_physics::det_math::max / min"

[[method]]
path = "f64::min"
reason = "the sign of an equal pair of zeros is unspecified and differs between targets; use alice_physics::det_math::max / min"

[[method]]
path = "f32::clamp"
reason = "passes a NaN payload through and panics on a NaN or inverted bound; use crate::det_math::clamp (alice-det-math's clamp, the owner of the clamp Law)"

[[method]]
path = "f64::clamp"
reason = "alice-det-math has no 64-bit clamp yet; call crate::det_math::raw_clamp64, the one named site"

[[form]]
text = "a.max(b)"
path = "f32::max"

[[form]]
text = "f32::min(a, b)"
path = "f32::min"

[[form]]
text = "a.min(b)"
path = "f64::min"

[[form]]
text = "f64::max)"
path = "f64::max"

[[form]]
text = "x.clamp(0.0, 1.0)"
path = "f32::clamp"

[[form]]
text = "y.clamp(0.0, 1.0)"
path = "f64::clamp"

[[form]]
text = "x.sin()"
path = "f32::sin"

[[form]]
text = "started.elapsed()"
path = "std::time::Instant::elapsed"

[[form]]
text = "std::time::Instant::elapsed(&t0)"
path = "std::time::Instant::elapsed"

[[form]]
text = "stamp.elapsed()"
path = "std::time::SystemTime::elapsed"

[[form]]
text = "clock_t.elapsed()"
path = "std::time::Instant::elapsed"

[[form]]
text = "<std::time::Instant>::elapsed(&t1)"
path = "std::time::Instant::elapsed"

[[clean]]
text = "later.duration_since(earlier)"
