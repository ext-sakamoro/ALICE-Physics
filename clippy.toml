# Determinism gate (v1.1.0): the platform `libm` is not bit-exact across
# OS / CPU / compiler, so every float transcendental must go through
# `alice_physics::det_math`. CI runs clippy with `-D warnings`, which turns
# `disallowed_methods` into a red gate. `Fix128::sin` etc. are unaffected
# (different receiver type).
disallowed-methods = [
    { path = "f32::sin", reason = "platform libm is not cross-platform bit-exact; use alice_physics::det_math" },
    { path = "f32::cos", reason = "platform libm is not cross-platform bit-exact; use alice_physics::det_math" },
    { path = "f32::tan", reason = "platform libm is not cross-platform bit-exact; use alice_physics::det_math" },
