# Dependabot 設定 (feedback_dependabot_major_bump_initial_wave 準拠)
# semver-major bump は ignore 必要時は手動で PR 化判断
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # `dtolnay/rust-toolchain@1.85` is the MSRV job's toolchain pin (rust-version
      # = 1.85 compiled for real); bumping it to a newer toolchain would silently
      # turn the MSRV check into a stable check. Change it together with
      # `rust-version` in Cargo.toml only.
      - dependency-name: "dtolnay/rust-toolchain"
