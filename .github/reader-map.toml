# Reads that no path names (scripts/reader_map_check.py): every other tracked file must be named by a landing job's
# run step, or by a script that job runs (scripts/reader_map_core.py, shared with ALICE-Law). Each entry here has a
# token check; there is no free-string evidence.

[[entry]]
name = "the root workspace: its manifests and the sources, tests, benches and examples cargo builds from them"
kind = "cargo"
manifest = "Cargo.toml"
paths = ["Cargo.toml", "Cargo.lock", "src/**", "tests/**", "benches/**", "examples/**", "crates/**", "rust-toolchain.toml", "clippy.toml", ".cargo/**"]
readers = ["ci.yml:test"]

[[entry]]
name = "the G3 syntax-tree check crate"
kind = "cargo"
manifest = "tools/no-outer-fneg-of-fma/Cargo.toml"
paths = ["tools/no-outer-fneg-of-fma/**"]
readers = ["ci.yml:test"]

[[entry]]
name = "the cfg item lister"
kind = "cargo"
manifest = "scripts/cfg-items/Cargo.toml"
paths = ["scripts/cfg-items/**"]
readers = ["security-audit.yml:deny"]

[[entry]]
name = "fuzz targets and their corpora (cargo-fuzz runs in fuzz/, the corpus of each target is its input)"
kind = "cargo"
manifest = "fuzz/Cargo.toml"
paths = ["fuzz/**"]
readers = ["fuzz.yml:build-all", "fuzz.yml:fuzz"]

[[entry]]
name = "web viewer"
kind = "dir"
dir = "web"
paths = ["web/**"]
readers = ["web.yml:smoke"]

[[entry]]
name = "text a whole-tree check reads (the public vocabulary of every tracked text file)"
kind = "all-tracked"
paths = ["docs/**", "README.md", "README_JP.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "TRADEMARK_NOTICE", "LICENSE-Proprietary", ".gitignore", "**/.gitignore", ".github/dependabot.yml", "unreal-plugin/*", "crates/*/README.md", "crates/*/LICENSE-Proprietary"]
readers = ["ci.yml:test"]

[[entry]]
name = "ALICE-Law G11 tables, read by ALICE-Law's checker at the pinned revision"
kind = "pinned-checker"
pin = ".github/g11-table-pin"
repo = "ALICE-Law"
checker = "scripts/g11_table_check.py"
paths = ["conformance/g11.toml"]
readers = ["ci.yml:test"]

[[entry]]
name = "the full-coverage baseline (the weekly coverage-full run)"
kind = "scheduled"
paths = ["scripts/line-coverage-baseline-full.txt"]
readers = ["quality-deep.yml:coverage-full"]

[[entry]]
name = "the weekly mutation ratchet's baseline"
kind = "scheduled"
paths = ["scripts/mutants-missed-baseline.txt"]
readers = ["quality-deep.yml:mutants-ratchet"]
