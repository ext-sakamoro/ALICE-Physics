# Which workflow runs are evidence for a landing. scripts/land.py pushes the commits to
# ci/<id>, waits for its CI, then fast-forwards main to the same SHA.
#
#   landing        must be green on the ci/<id> SHA before main is fast-forwarded to it
#   after-landing  started on the ci/<id> SHA (when its changes job outputs run=true); its
#                  result is read after the landing and does not hold it
# (the legs below have their own classes)
#   schedule-only  never runs on a ci/** push (schedule, manual dispatch, pull request)
#   tag-only       runs on a version tag
#
# Every workflow in .github/workflows has exactly one class here. docs/CI_TRIGGERS.md shows
# the same table; scripts/ci_triggers_check.py checks this file against the workflows and
# the document.

[workflows]
"bench-gate.yml" = "landing"
"ci.yml" = "landing"
"downstream.yml" = "landing"
"fuzz.yml" = "landing"
"integration-status.yml" = "landing"
"law-readme-block.yml" = "landing"
"oracle-status.yml" = "landing"
"python-binding.yml" = "landing"
"quality-deep.yml" = "schedule-only"
"reexport_check.yml" = "landing"
"release.yml" = "tag-only"
"security-audit.yml" = "landing"
"unsafe-and-parallel.yml" = "after-landing"
"wiring-status.yml" = "landing"

# legs of a landing workflow whose result is not read before the landing: the job id, the
# matrix value and the events whose run includes the leg (scripts/ci_triggers_check.py
# evaluates the job's matrix for each event and fails when they differ)
#   after-landing       started on the ci/<id> SHA with the rest of the run, read after the landing
#   main-after-landing  not started on ci/** at all: runs on the push to main (and on the
#                       nightly schedule), read on main after the landing
# event labels: "push main", "push ci/**", "pull_request", "workflow_dispatch", "schedule"
# events_when_landing_scripts: the events whose run includes the leg when the ci.yml gate
# says the branch changes the landing script or its tests (needs.gate.outputs.landing_scripts);
# on a ci/** push the leg is then an ordinary job of the run, read before the landing

# the arm64 leg that holds the golden hashes: red after a landing is fixed or reverted at once
[[legs]]
workflow = "ci.yml"
job = "test"
matrix = "macos-latest"
class = "after-landing"
events = ["push main", "push ci/**", "pull_request", "workflow_dispatch"]

[[legs]]
workflow = "ci.yml"
job = "test"
matrix = "macos-15-intel"
class = "main-after-landing"
events = ["push main", "schedule"]
events_when_landing_scripts = ["push main", "push ci/**", "workflow_dispatch", "schedule"]

# the optimised determinism tests on arm64 macOS (a target with a fused multiply-add): read
# after the landing like the other macOS legs; ubuntu-24.04-arm covers the same rewrite
# before it
[[legs]]
workflow = "ci.yml"
job = "determinism-release"
matrix = "macos-latest"
class = "after-landing"
events = ["push main", "push ci/**", "pull_request", "workflow_dispatch"]
