name: Downstream

# Build and test the crates that depend on alice-physics (ALICE-SDF, ALICE-LOL
# and ALICE-TRT, their main branches) against this commit, so a change here that
# breaks them fails here. scripts/downstream_check.sh does the work and runs the
# same way locally; it lists which downstream tests run and why.
#
# One Linux job: the downstream suites are tested on every OS in their own
# repositories, and this job only has to see the crates compile and pass against
# the changed alice-physics.

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/downstream.txt)
    # ci/**: the same checks on the ci/<id> branch before main is fast-forwarded to it
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'scripts/downstream_check.sh'
      - 'scripts/downstream_trt_probe.sh'
      - 'scripts/downstream_resolve.sh'
      - 'scripts/downstream_select_tag.py'
      - 'scripts/downstream_major_rewrite.py'
      - 'scripts/downstream_test_counts.py'
      - 'scripts/ansi.py'
      - 'scripts/changed_paths.py'
      - '.github/workflows/downstream.yml'
      - '.github/paths/downstream.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # one group per ref; a newer push cancels the older run of its branch, never a main run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/downstream.txt

  downstream:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: ALICE-SDF, ALICE-LOL and ALICE-TRT against this commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ALICE-TRT's GPU tests return early, and pass, when wgpu finds no
      # adapter, and the runner has no GPU: Mesa's software Vulkan driver
      # (lavapipe) gives wgpu a CPU adapter, as in ALICE-TRT's own Linux GPU
      # lanes. downstream_check.sh fails the TRT step when the adapter is
      # missing. Not cached: apt-get update is most of the ~20 s and must run
      - name: Install Mesa software Vulkan (lavapipe) for the ALICE-TRT GPU tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary || echo "vulkaninfo --summary failed (exit $?); the ALICE-TRT GPU probe decides"

      # fetched first so the cache below can key on the downstream manifests
      # ALICE-SDF, ALICE-LOL and ALICE-TRT (with ALICE-ML, ALICE-DB and
      # ALICE-Crypto, path dependencies of ALICE-TRT) at main; ALICE-LLM and
      # ALICE-Zip at the newest
      # release tag that fits ALICE-LOL both ways. ALICE-Kinematics at main: its
      # only release tag requires alice-lol 0.3 and ALICE-LOL main is 0.4; drop
      # this once a release tag accepts the current alice-lol
      - name: Fetch downstream repositories
        env:
          DOWNSTREAM_ROOT: ${{ runner.temp }}/downstream
          KINEMATICS_REF: main
        run: bash scripts/downstream_check.sh --fetch-only

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: downstream
          workspaces: |
            ${{ runner.temp }}/downstream/ALICE-SDF -> ${{ runner.temp }}/downstream/target/sdf
            ${{ runner.temp }}/downstream/ALICE-LOL -> ${{ runner.temp }}/downstream/target/lol
            ${{ runner.temp }}/downstream/ALICE-TRT -> ${{ runner.temp }}/downstream/target/trt

      - name: Build and test downstream (requirements raised in the fetched copies on a major bump; fails on a requirement that rejects this version, a test binary with 0 tests or an ignored test, fewer than 3 downstream compared, an unpatched alice-physics or no GPU adapter for ALICE-TRT)
        env:
          DOWNSTREAM_ROOT: ${{ runner.temp }}/downstream
          DOWNSTREAM_TARGET_DIR: ${{ runner.temp }}/downstream/target
        run: bash scripts/downstream_check.sh --no-fetch

  # one result for the workflow: run=true needs every job above to succeed, run=false needs
  # them skipped (a skipped, cancelled or failed job after run=true is red)
  # not a required status check: a pull request that touches none of the paths has no run
  gate:
    name: Gate
    if: always()
    needs: [changes, downstream]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
