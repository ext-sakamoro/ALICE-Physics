name: Security & Hygiene

# canonical CI template: [[reference_alice_ci_canonical_template]]
# ALICE-SDF v1.7.7 (commit 52d26f9) を base に ALICE-Physics 用に調整
#
# 目的:
# - RustSec advisory (CVE) の週次検知
# - dep license 逸脱 (GPL 侵入等) の block
# - 未使用依存の炙り出し (mesa bloat 予防)
# - 仮実装 (todo! / unimplemented! / panic!(STUB) / dbg!) の CI gate

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      # snapshot 再生成 commit でも public-api job を再実行する (paths 漏れだと red が残り続ける)
      - 'docs/PUBLIC_API_SNAPSHOT.txt'
      - '.github/workflows/security-audit.yml'
      - '.github/actions/**'
      - 'examples/*/Cargo.toml'
      - 'bindings/*/Cargo.toml'
      - 'bindings/*/*/Cargo.toml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      # snapshot 再生成 commit でも public-api job を再実行する (paths 漏れだと red が残り続ける)
      - 'docs/PUBLIC_API_SNAPSHOT.txt'
      - '.github/workflows/security-audit.yml'
      - '.github/actions/**'
      - 'examples/*/Cargo.toml'
      - 'bindings/*/Cargo.toml'
      - 'bindings/*/*/Cargo.toml'
  schedule:
    # 毎週月曜 09:00 UTC = 18:00 JST
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  audit:
    name: cargo audit (RustSec CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # advisory-db は audit 実行時に自動取得
      # yanked crate は deny、unmaintained warning は個別 ignore で管理
      # 現在の ignore 対象:
      # - RUSTSEC-2026-0176: pyo3 0.27.2 nth/nth_back OOB (0.29 移行で解消 pending)
      # - RUSTSEC-2026-0177: pyo3 0.27.2 Sync 欠落 (同上)
      # (deny.toml と同期、pyo3 0.29 移行完了時に削除)
      # RUSTSEC-2025-0141 / RUSTSEC-2026-0235: J-4 bridge restoration
      #   (v0.14.0-preview.8) で alice-db が bincode 1.3.3 + rkyv 0.7.46 を
      #   transitive に pull sibling が bincode 2.x / rkyv 0.8+ に移行後
      #   本 ignore を撤去する (deny.toml と同期)
      - name: Run cargo audit
        run: |
          cargo audit \
            --deny yanked \
            --ignore RUSTSEC-2026-0176 \
            --ignore RUSTSEC-2026-0177 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2026-0235

  deny:
    name: cargo-deny (license + advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # EmbarkStudios/cargo-deny-action@v2 は Docker container 内で稼働し、
      # /github/workspace のみ mount するため sibling path dep が見えず fail する
      # 直接 install で回避 (canonical [[reference_alice_ci_canonical_template]] 罠 #1)
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # false-positive は Cargo.toml の [package.metadata.cargo-machete] ignored で除外
      - uses: bnjbvr/cargo-machete@main

  stub-guard:
    name: Stub / mock / dbg guard (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # CLAUDE.md「仮実装完了偽装の禁止ルール」準拠
      - name: Detect todo! / unimplemented! / panic!(STUB) in src/**
        run: |
          set -eo pipefail
          # STUB (uppercase) のみに絞る (canonical 罠 catalog 更新済)
          # trait default method の `panic!("... not implemented by this backend")`
          # 等は legitimate な pattern で stub ではない
          hits=$(grep -rnE 'todo!\(|unimplemented!\(|panic!\([^)]*STUB' \
            src/ --include="*.rs" \
            --exclude-dir=bin \
            || true)
          if [ -n "$hits" ]; then
            echo "❌ Stub / unimplemented / STUB panic detected in src/ (production path):"
            echo "$hits"
            echo ""
            echo "Fix: use ? operator, Result<T, E>, or remove the stub."
            echo "  See CLAUDE.md § 仮実装完了偽装の禁止ルール"
            exit 1
          fi
          echo "✓ No todo! / unimplemented! / panic!(STUB) in src/ (excluding src/bin/)"

      - name: Detect dbg!() residual in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rn 'dbg!(' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "❌ dbg!() macro left in src/:"
            echo "$hits"
            exit 1
          fi
          echo "✓ No dbg!() in src/"

      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'TODO|FIXME|XXX|HACK' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO/FIXME/XXX/HACK found in src/ (informational, not blocking):"
            echo "$hits" | head -50
          else
            echo "✓ No TODO/FIXME/XXX/HACK in src/"
          fi

  coverage:
    name: Coverage (cargo-llvm-cov、informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: |
          cargo llvm-cov --lib --summary-only 2>&1 | tee coverage-summary.txt

      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  public-api-diff:
    name: cargo-public-api (surface snapshot verification)
    # macos-latest (aarch64) を採用: SIMD items (`Fix128::sub_simd` /
    # `Vec3Fix::cross_simd` / `dot_batch_4` / `Fix128::pack_pair` 等) は
    # `#[cfg(target_arch = "x86_64")]` gate 経由で x86_64 のみに存在、
    # Linux x86_64 CI runner で snapshot regenerate すると Mac aarch64
    # 開発環境の baseline と乖離して drift 誤検知が発生する
    # Mac aarch64 runner に統一することで開発者環境と snapshot 生成環境を
    # 一致させ、SIMD platform-specific items は「x86_64-only feature」として
    # snapshot 対象外にする (regression detection の目的には aarch64
    # baseline で十分、x86_64 SIMD path の変更は独立の #[cfg] gate で管理)
    runs-on: macos-latest
    # v1.0 roadmap Item C: docs/PUBLIC_API_SNAPSHOT.txt に対する
    # cargo public-api の出力を diff、乖離があれば fail
    # 意図的な public API 追加/変更時は開発者側で snapshot を再生成 + commit
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-api-macos

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked

      - name: Generate current snapshot
        run: |
          cargo +nightly public-api \
            --features "std,simd,parallel,ffi,gpu-solver-bridge" \
            --simplified \
            > /tmp/current-api.txt

      - name: Diff against docs/PUBLIC_API_SNAPSHOT.txt
        run: |
          if ! diff -u docs/PUBLIC_API_SNAPSHOT.txt /tmp/current-api.txt; then
            echo "::error::Public API surface drift detected."
            echo "::error::The generated snapshot differs from docs/PUBLIC_API_SNAPSHOT.txt."
            echo "::error::"
            echo "::error::If this drift is intentional, regenerate the baseline with:"
            echo "::error::  cargo +nightly public-api --features \"std,simd,parallel,ffi,gpu-solver-bridge\" --simplified > docs/PUBLIC_API_SNAPSHOT.txt"
            echo "::error::and commit the diff alongside the API change so the PR reviewer sees the delta."
            exit 1
          fi
          echo "✓ Public API snapshot matches docs/PUBLIC_API_SNAPSHOT.txt"

  semver-checks:
    name: cargo-semver-checks (API compat、hard-gate)
    runs-on: ubuntu-latest
    # v0.14.0-preview.4 で `publish = false` を解除、crates.io publish 済
    # (2026-09-13 initial publish、以降 preview.5 / preview.6 / ...)
    # 2026-09-14 v1.0 Item C 有効化: continue-on-error 解除、hard-gate
    # モードに移行 breaking API 変更を含む PR はここで block される
    # crates.io baseline との比較も可能だが、preview 版どうしの比較は
    # noise 多いため引き続き git baseline (main~1) で比較
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # baseline-rev 比較のため full history 必要
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # version 明示 pin: `@latest` は rustc MSRV を追いかける (0.50.0 = 1.93+) ので、
      # rust-toolchain.toml の pin が遅れると赤になる (2026-09-14 事案) toolchain と
      # 一緒に月次で bump する
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0

      # publish=false のため --baseline-rev で git 経由の比較
      # main の直前 commit と比較 (informational、break あっても block しない)
      - name: Run cargo semver-checks
        run: |
          cargo semver-checks check-release \
            --package alice-physics \
            --baseline-rev "HEAD~1" \
            || true
