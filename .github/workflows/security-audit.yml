name: Security & Hygiene

# ALICE-SDF v1.7.7 (commit 52d26f9) を base に ALICE-Physics 用に調整
#
# 目的:
# - RustSec advisory (CVE) の週次検知
# - dep license 逸脱 (GPL 侵入等) の block
# - 未使用依存の炙り出し (mesa bloat 予防)
# - 仮実装 (todo! / unimplemented! / panic!(STUB) / dbg!) の CI gate

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/security-audit.txt)
    # ci/**: the same checks on the ci/<id> branch before main is fast-forwarded to it
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'deny.toml'
      - 'scripts/cfg-items/Cargo.lock'
      - 'rust-toolchain.toml'
      - '**/Cargo.toml'
      - '**/*.rs'
      - '.gitignore'
      - 'README.md'
      - 'docs/PUBLIC_API_SNAPSHOT.txt'
      - 'scripts/semver_checked.py'
      - 'scripts/ansi.py'
      - 'scripts/line_coverage_ratchet.py'
      - 'scripts/line-coverage-baseline.txt'
      - 'scripts/package_contents_check.py'
      - 'scripts/test_package_contents_check.py'
      - 'LICENSE-AGPL'
      - 'LICENSE-COMMERCIAL.md'
      - 'scripts/changed_paths.py'
      - '.github/workflows/security-audit.yml'
      - '.github/paths/security-audit.txt'
  schedule:
    # 毎週月曜 09:00 UTC = 18:00 JST
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  # one group per ref; a newer push cancels the older run of its branch, never a main run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/security-audit.txt

  audit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo audit (RustSec CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # advisory-db は audit 実行時に自動取得
      # yanked crate は deny、unmaintained warning は個別 ignore で管理
      # 現在の ignore 対象:
      # - RUSTSEC-2026-0176: pyo3 0.27.2 nth/nth_back OOB (0.29 移行で解消 pending)
      # - RUSTSEC-2026-0177: pyo3 0.27.2 Sync 欠落 (同上)
      # (deny.toml と同期、pyo3 0.29 移行完了時に削除)
      - name: Run cargo audit
        run: |
          cargo audit \
            --deny yanked \
            --ignore RUSTSEC-2026-0176 \
            --ignore RUSTSEC-2026-0177

      # scripts/cfg-items is a separate workspace (the source parser of the
      # mutation scripts) with its own lock, which the root audit does not read
      - name: Run cargo audit (scripts/cfg-items)
        run: cargo audit --file scripts/cfg-items/Cargo.lock --deny yanked

  deny:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-deny (license + advisories + bans + sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # EmbarkStudios/cargo-deny-action@v2 は Docker container 内で稼働し、
      # /github/workspace のみ mount するため sibling path dep が見えず fail する
      # 直接 install で回避
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check all
        run: cargo deny --all-features check all

      - name: Run cargo deny check all (scripts/cfg-items, its own workspace)
        run: cargo deny --manifest-path scripts/cfg-items/Cargo.toml --config deny.toml check all

  unused-deps:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # false-positive は Cargo.toml の [package.metadata.cargo-machete] ignored で除外
      - uses: bnjbvr/cargo-machete@main

  stub-guard:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Stub / mock / dbg guard (grep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # production code must not ship stubs
      - name: Detect todo! / unimplemented! / panic!(STUB) in src/**
        run: |
          set -eo pipefail
          # STUB (uppercase) のみに絞る
          # trait default method の `panic!("... not implemented by this backend")`
          # 等は legitimate な pattern で stub ではない
          hits=$(grep -rnE 'todo!\(|unimplemented!\(|panic!\([^)]*STUB' \
            src/ --include="*.rs" \
            --exclude-dir=bin \
            || true)
          if [ -n "$hits" ]; then
            echo "❌ Stub / unimplemented / STUB panic detected in src/ (production path):"
            echo "$hits"
            echo ""
            echo "Fix: use ? operator, Result<T, E>, or remove the stub."
            exit 1
          fi
          echo "✓ No todo! / unimplemented! / panic!(STUB) in src/ (excluding src/bin/)"

      - name: Detect dbg!() residual in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rn 'dbg!(' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "❌ dbg!() macro left in src/:"
            echo "$hits"
            exit 1
          fi
          echo "✓ No dbg!() in src/"

      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'TODO|FIXME|XXX|HACK' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO/FIXME/XXX/HACK found in src/ (informational, not blocking):"
            echo "$hits" | head -50
          else
            echo "✓ No TODO/FIXME/XXX/HACK in src/"
          fi

  package-integrity:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Package integrity (publish される .crate が build できるか)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # publish される .crate に必要な file が全部入っているかを見る
      #
      # include_str! / include_bytes! が package 境界を越える、exclude を効かせ過ぎる、
      # 必要 file が漏れる — これらは repo / workspace に file がある限り
      # cargo build も cargo test も clippy も preflight も全部通り、
      # crates.io から取得した利用者だけが compile 不能になる
      # (2026-09-28 ALICE-LOL lol.gbnf)
      #
      # semver-checks は baseline を build するので結果的に検出するが、
      # (a) 壊れた版を publish した後にしか分からない
      # (b) 未 publish crate は baseline が無く発火しない ので予防にならない
      # Cargo.toml の include (allowlist) が repository の道具 (.github/ scripts/ docs/ 等) と
      # toolchain の pin を出荷していないか、必要 file が揃っているかを見る (0 件は fail)
      - name: 出荷 file の一覧
        run: |
          python3 scripts/test_package_contents_check.py
          python3 scripts/package_contents_check.py

      - name: cargo package (.crate を作る)
        # --no-verify: 未 publish の sibling に path dep がある repo では verify step が
        #   registry 解決で落ちる 展開後の隔離 build が本体なので verify は不要
        run: cargo package --no-verify --allow-dirty

      - name: 展開して隔離 build
        # job の CARGO_TERM_COLOR: always のままだと Executable が色の escape で囲まれ
        # (直後が空白でなく escape になる)、下の件数が 0 になる
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          crate=$(find target/package -maxdepth 1 -name '*.crate' | head -1)
          [ -n "$crate" ] || { echo "::error::.crate が生成されていない"; exit 1; }
          echo "packaged: $(basename "$crate") ($(du -h "$crate" | cut -f1))"
          tmp=$(mktemp -d)
          tar xzf "$crate" -C "$tmp"
          cd "$tmp"/*/
          # 親 workspace を継承すると member 扱いになり、境界を越えた file が
          # 再び見えてしまう (検査の意味が消える) ので単独 package として build
          printf '\n[workspace]\n' >> Cargo.toml
          # wasm / ffi が排他 feature (src/lib.rs の compile_error!) なので --all-features は
          # 設計上必ず落ちる packaging 検査としては default features で成立する
          cargo check
          # test target (lib の unit test と #[path] / include_bytes! で取り込む file を含む)
          # も展開した crate だけで build できるかを見る build した test binary が 0 本なら fail
          cargo test --tests --no-run --locked 2>&1 | tee "$tmp/test-build.log"
          n=$(grep -c 'Executable ' "$tmp/test-build.log" || true)
          echo "test binaries built from the packaged crate: $n"
          [ "$n" -gt 0 ] || { echo "::error::展開した crate から test binary が 1 本も build されていない"; exit 1; }

  coverage:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Coverage (cargo-llvm-cov, line-coverage ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: |
          set -o pipefail
          cargo llvm-cov --lib --summary-only 2>&1 | tee coverage-summary.txt

      # coverage may not fall below scripts/line-coverage-baseline.txt (total, and
      # per file for files of 50 lines or more); a rise is recorded with --write.
      # This measures the lib unit tests only; lib + tests/ is ratcheted weekly
      # by the coverage-full job of quality-deep.yml (about an hour, too long for
      # every push).
      - name: Line-coverage ratchet
        run: python3 scripts/line_coverage_ratchet.py --summary coverage-summary.txt

      - name: Upload coverage summary as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  public-api-diff:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-public-api (surface snapshot verification)
    # macos-latest (aarch64) を採用: SIMD items (`Fix128::sub_simd` /
    # `Vec3Fix::cross_simd` / `dot_batch_4` / `Fix128::pack_pair` 等) は
    # `#[cfg(target_arch = "x86_64")]` gate 経由で x86_64 のみに存在、
    # Linux x86_64 CI runner で snapshot regenerate すると Mac aarch64
    # 開発環境の baseline と乖離して drift 誤検知が発生する
    # Mac aarch64 runner に統一することで開発者環境と snapshot 生成環境を
    # 一致させ、SIMD platform-specific items は「x86_64-only feature」として
    # snapshot 対象外にする (regression detection の目的には aarch64
    # baseline で十分、x86_64 SIMD path の変更は独立の #[cfg] gate で管理)
    runs-on: macos-latest
    timeout-minutes: 15
    # v1.0 roadmap Item C: docs/PUBLIC_API_SNAPSHOT.txt に対する
    # cargo public-api の出力を diff、乖離があれば fail
    # 意図的な public API 追加/変更時は開発者側で snapshot を再生成 + commit
    # ⚠️ **toolchain と cargo-public-api は version pin する** (2026-09-30)
    #
    # 旧構成は `dtolnay/rust-toolchain@nightly` (= 常に最新) + `cargo install
    # cargo-public-api --locked` (= 常に最新) だったので、**snapshot が commit と
    # 無関係に drift** した 実測 (run 36672491680): diff は 1 行だけで
    #
    #   -pub ...DestructionType::Custom::sdf: alloc::sync::Arc<...>
    #   +pub ...DestructionType::Custom::sdf: alloc::rcs::arc::Arc<...>
    #
    # = **nightly の std 内部 module 再編による rendering 変更**で、公開 API は
    # 1 文字も変わっていない ⚠️ **時間に対して flaky (commit に対してではない)**
    # ので「再実行したら通る」類ではなく、**snapshot を再生成するまで `src/` を
    # 触る全 commit が red** になる (実測: B-13 の commit が巻き込まれた)
    #
    # 対処は pin の 2 本立て — rendering を決めるのは **rustdoc (nightly) と
    # cargo-public-api の両方**なので、片方だけ pin しても drift は残る
    #
    # **pin を上げる時は意図的に**: toolchain / tool の version を上げた commit で
    # `cargo +nightly-<新日付> public-api --features "std,simd,parallel,ffi,gpu-solver-bridge"
    # --simplified > docs/PUBLIC_API_SNAPSHOT.txt` を同時に走らせ、diff を同 commit
    # に載せる (そうすれば「API が変わった」と「rendering が変わった」を diff で
    # 区別できる) 2026-09-30 時点の pin は local 開発環境と一致を実測済
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-26
          components: rustc-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-api-macos

      - name: Install cargo-public-api (version pin、上の comment 参照)
        run: cargo install cargo-public-api --locked --version 0.52.0

      - name: Generate current snapshot
        run: |
          cargo +nightly-2026-09-26 public-api \
            --features "std,simd,parallel,ffi,gpu-solver-bridge" \
            --simplified \
            > /tmp/current-api.txt

      - name: Diff against docs/PUBLIC_API_SNAPSHOT.txt
        run: |
          if ! diff -u docs/PUBLIC_API_SNAPSHOT.txt /tmp/current-api.txt; then
            echo "::error::Public API surface drift detected."
            echo "::error::The generated snapshot differs from docs/PUBLIC_API_SNAPSHOT.txt."
            echo "::error::"
            echo "::error::If this drift is intentional, regenerate the baseline with:"
            echo "::error::  cargo +nightly public-api --features \"std,simd,parallel,ffi,gpu-solver-bridge\" --simplified > docs/PUBLIC_API_SNAPSHOT.txt"
            echo "::error::and commit the diff alongside the API change so the PR reviewer sees the delta."
            exit 1
          fi
          echo "✓ Public API snapshot matches docs/PUBLIC_API_SNAPSHOT.txt"

  semver-checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-semver-checks (API compat、hard-gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # v0.14.0-preview.4 で `publish = false` を解除、crates.io publish 済
    # (2026-09-13 initial publish、以降 preview.5 / preview.6 / ...)
    # 2026-09-14 v1.0 Item C 有効化: continue-on-error 解除、hard-gate
    # モードに移行 breaking API 変更を含む PR はここで block される
    # crates.io baseline との比較も可能だが、preview 版どうしの比較は
    # noise 多いため引き続き git baseline (main~1) で比較
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # baseline-rev 比較のため full history 必要
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # version 明示 pin: `@latest` は rustc MSRV を追いかける (0.50.0 = 1.93+) ので、
      # rust-toolchain.toml の pin が遅れると赤になる (2026-09-14 事案) toolchain と
      # 一緒に月次で bump する
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0

      # Compared with the previous commit (--baseline-rev). The features are named
      # explicitly: the default heuristic enables every feature, and `wasm` with
      # `ffi` is a compile_error!, so rustdoc failed on every run and `|| true`
      # turned a run that compared nothing into a pass. Now the step fails when
      # the tool fails or prints no `Checked ... N checks` line; semver findings
      # themselves stay informational (breaking changes accumulate between
      # releases without a version bump) and go to the job summary.
      # The count is read by scripts/semver_checked.py (ANSI codes stripped, a
      # missing or zero count prints `::error::` and fails); colour is also off
      # for this step so the log reads plainly.
      - name: Run cargo semver-checks
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo semver-checks check-release \
            --package alice-physics \
            --baseline-rev "HEAD~1" \
            --only-explicit-features \
            --features "std,simd,parallel,ffi,gpu-solver-bridge" 2>&1 | tee semver.txt
          rc=${PIPESTATUS[0]}
          checked=$(python3 scripts/semver_checked.py semver.txt --exit-code "$rc")
          ok=$?
          set -e
          if [ "$ok" -ne 0 ]; then
            echo "$checked"
            exit 1
          fi
          {
            echo "### cargo semver-checks: $checked checks against HEAD~1 (exit $rc)"
            grep -E 'Summary|FAIL|requires new' semver.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::cargo semver-checks reports semver findings (informational); see the job summary"
          fi

  # one result for the workflow: run=true needs every job above to succeed, run=false needs
  # them skipped (a skipped, cancelled or failed job after run=true is red)
  # not a required status check: a pull request that touches none of the paths has no run
  gate:
    name: Gate
    if: always()
    needs: [changes, audit, deny, unused-deps, stub-guard, package-integrity, coverage, public-api-diff, semver-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
