name: Integration Status

# docs/integration-status.md: every pub item in src/ classified by what reaches it
# (L0 unreached / L1 example-only / live), from rust-analyzer SCIP indexes with
# resolved references. Complements docs/wiring-status.md, whose name-based guard
# counts an example-only caller as wired and cannot tell same-named items apart.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**/*.rs'
      - 'examples/**/*.rs'
      - 'benches/**/*.rs'
      - 'fuzz/**/*.rs'
      - 'Cargo.toml'
      - 'scripts/scip_index.sh'
      - 'scripts/scip_reach.py'
      - 'scripts/wiring_guard.py'
      - 'scripts/wiring-baseline.txt'
  workflow_dispatch:

permissions:
  contents: read

# the check only reads the tree, so runs can be cancelled by a newer push
concurrency:
  group: integration-status-main
  cancel-in-progress: true

jobs:
  generate-integration-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # pyo3's build script (python feature) needs an interpreter; 3.11 for tomllib
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # rust-toolchain.toml pins the toolchain; rust-analyzer comes from the same pin
      - name: Install rust-analyzer
        run: |
          rustup show active-toolchain
          rustup component add rust-analyzer
          rust-analyzer --version

      - uses: Swatinem/rust-cache@v2

      - name: Analysis tests
        run: python3 scripts/test_scip_reach.py

      # The ledger is regenerated and committed when a change lands
      # (scripts/land.py); this workflow only checks that the committed copy
      # matches the tree. It does not commit: a bot commit would add an author.
      - name: Check docs/integration-status.md is up to date
        run: |
          scripts/scip_index.sh
          python3 scripts/scip_reach.py --write docs/integration-status.md
          if ! git diff --exit-code docs/integration-status.md; then
            echo "::error::docs/integration-status.md is stale: regenerate it (scripts/land.py does) and commit it with the change"
            exit 1
          fi
