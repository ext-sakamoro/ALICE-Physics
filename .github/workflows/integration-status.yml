name: Integration Status

# docs/integration-status.md: every pub item in src/ classified by what reaches it
# (L0 unreached / L1 example-only / live), from rust-analyzer SCIP indexes with
# resolved references. Complements docs/wiring-status.md, whose name-based guard
# counts an example-only caller as wired and cannot tell same-named items apart.

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/integration-status.txt)
    # ci/**: the same checks on the ci/<id> branch before main is fast-forwarded to it
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # two groups: at most one main run and one ci/** run at a time; a new run waits instead
  # of cancelling the running one, so a ci/** push never cancels the main run (GitHub keeps
  # one waiting run per group: a newer push replaces the older waiting one)
  # (scripts/ci_load_check.py requires this shape)
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && 'main' || 'ci' }}
  cancel-in-progress: false

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/integration-status.txt

  generate-integration-status:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # pyo3's build script (python feature) needs an interpreter; 3.11 for tomllib
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # rust-toolchain.toml pins the toolchain; rust-analyzer comes from the same pin
      - name: Install rust-analyzer
        run: |
          rustup show active-toolchain
          rustup component add rust-analyzer
          rust-analyzer --version

      - uses: Swatinem/rust-cache@v2

      - name: Analysis tests
        run: python3 scripts/test_scip_reach.py

      # The ledger is regenerated and committed when a change lands
      # (scripts/land.py); this workflow only checks that the committed copy
      # matches the tree. It does not commit: a bot commit would add an author.
      - name: Check docs/integration-status.md is up to date
        run: |
          scripts/scip_index.sh
          python3 scripts/scip_reach.py --write docs/integration-status.md
          if ! git diff --exit-code docs/integration-status.md; then
            echo "::error::docs/integration-status.md is stale: regenerate it (scripts/land.py does) and commit it with the change"
            exit 1
          fi

  # one result for the workflow: run=true needs every job above to succeed, run=false needs
  # them skipped (a skipped, cancelled or failed job after run=true is red)
  # not a required status check: a pull request that touches none of the paths has no run
  gate:
    name: Gate
    if: always()
    needs: [changes, generate-integration-status]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
