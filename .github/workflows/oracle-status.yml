name: Oracle Status

on:
  push:
    branches: [ main ]
    paths:
      - 'tests/**/*.rs'
      - 'src/**/*.rs'
      - 'scripts/gen-oracle-status.py'

permissions:
  contents: write

jobs:
  generate-oracle-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate oracle status report
        run: python3 scripts/gen-oracle-status.py

      - name: Check if oracle status changed
        id: check
        run: |
          if git diff --quiet docs/oracle-status.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push oracle status if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "oracle-bot"
          git config user.email "noreply@github.com"
          git add docs/oracle-status.md
          git commit -m "docs: update oracle status [automated]"
          git push origin main || true
        continue-on-error: true
