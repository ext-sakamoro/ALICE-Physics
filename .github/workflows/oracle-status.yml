name: Oracle Status

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/oracle-status.txt)
    # ci/**: the same checks on the ci/<id> branch before main is fast-forwarded to it
    branches: [main, 'ci/**']
  # a run dropped by the one-pending-run-per-group rule is re-created on the ci/<id> SHA
  # with `gh workflow run <workflow> --ref ci/<id>` (docs/CI_TRIGGERS.md, dropped runs)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # one group per ref; a newer push cancels the older run of its branch, never a main run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/oracle-status.txt

  generate-oracle-status:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # The ledger's "Root cause outside this repository" table reads the
      # dependency versions from the committed Cargo.lock; `--locked` stops the
      # job when the lock is out of date with Cargo.toml instead of writing
      # versions the lock does not hold.
      - name: Rust toolchain and dependency resolution
        run: |
          rustup show active-toolchain
          cargo metadata --locked --format-version 1 --all-features > /dev/null

      # The ledger is regenerated and committed when a change lands
      # (scripts/land.py); this workflow only checks that the committed copy
      # matches the tree. It does not commit: a bot commit would add an author.
      - name: Check docs/oracle-status.md is up to date
        run: |
          python3 scripts/gen-oracle-status.py
          if ! git diff --exit-code docs/oracle-status.md; then
            echo "::error::docs/oracle-status.md is stale: regenerate it (scripts/land.py does) and commit it with the change"
            exit 1
          fi

  # one result for the workflow: run=true needs every job above to succeed, run=false needs
  # them skipped (a skipped, cancelled or failed job after run=true is red)
  # not a required status check: a pull request that touches none of the paths has no run
  gate:
    name: Gate
    if: always()
    needs: [changes, generate-oracle-status]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
