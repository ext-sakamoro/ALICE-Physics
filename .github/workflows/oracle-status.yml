name: Oracle Status

on:
  push:
    branches: [ main ]
    paths:
      - 'tests/**/*.rs'
      - 'src/**/*.rs'
      - 'scripts/gen-oracle-status.py'

permissions:
  contents: write

# wiring-status と oracle-status は同じ push で起動して同じ main へ push する
# 1 つの group に直列化する (2026-10-03 実測: 並走すると遅い方が必ず
# `! [rejected] main -> main (fetch first)` で落ち、`|| true` に隠されて台帳が古いまま残った)
# cancel-in-progress は false: 走行中の run は最後まで走らせ、待ちは最新の 1 本だけ残る
concurrency:
  group: status-docs-main
  cancel-in-progress: false

jobs:
  generate-oracle-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # The ledger's "Root cause outside this repository" table needs the resolved
      # dependency versions. Cargo.lock is not committed, so the generator runs
      # `cargo metadata --all-features`; resolve once here so a failure stops the
      # job instead of writing "not resolved" into the ledger.
      - name: Rust toolchain and dependency resolution
        run: |
          rustup show active-toolchain
          cargo metadata --format-version 1 --all-features > /dev/null

      - name: Generate and publish oracle status
        run: |
          git config user.name "oracle-bot"
          git config user.email "noreply@github.com"
          # 台帳は main の先端の状態の写し: push する直前の先端で生成し直し、先に他の push が
          # 入っていたら (non-fast-forward) 取り直してもう一度生成する  rebase で古い版を載せない
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach --force origin/main
            python3 scripts/gen-oracle-status.py
            if git diff --quiet docs/oracle-status.md; then
              echo "docs/oracle-status.md is already up to date"
              exit 0
            fi
            git add docs/oracle-status.md
            git commit -m "docs: update oracle status [automated]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::docs/oracle-status.md を main へ push できなかった (5 回): 台帳が古いまま残る"
          exit 1
