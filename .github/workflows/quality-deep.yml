# quality-deep — 週次 / 手動の深い品質検査 (crate 厳密評価の CI 層、2026-09-15 制定)
#
# 週次 + 夜間 + workflow_dispatch だけで動き、push では動かない: どれも重く、runner を
# 占有すると取り込み (ci/** の CI 待ち) を止めるため 夜間は前日 main に入った変更の行だけを変異試験:
# - mutants : cargo-mutants (test が bug を検出できるかの逆検査)  夜間 / PR では --in-diff で差分のみ (見逃しは失敗)、
#             週次は core shard の見逃しを scripts/mutants-missed-baseline.txt と比べる (scripts/mutants_ratchet.py)
# - miri    : UB 検出 (unsafe / parallel 持ち crate)  SIMD / FFI / wasm は miri 非対応のため除外
# - bench   : criterion 回帰 (main baseline vs HEAD、critcmp)  GH runner のノイズがあるため informational
# - ignored : `#[ignore]` test を実際に走らせて理由文の主張と突き合わせる (2026-09-30 追加)
# - opt0-suite : CI が opt-level 2 (profile ci-test) で走らせる suite 全体の 2 step を opt-level 0 で
# - coverage-full : lib + 統合試験 (tests/) の行 coverage を週次で測り、専用の baseline
#                   (scripts/line-coverage-baseline-full.txt) を下回ったら失敗 push ごとの
#                   ratchet (security-audit.yml) は lib だけを測る (統合込みは 8 core で約 68 分)
#
# continue-on-error は compile error も green に潰すので使わない
# informational job は結果を Job Summary に書いて exit 0 (失敗は summary で読む)
name: Quality Deep

on:
  schedule:
    - cron: '30 17 * * 6'    # 日曜 02:30 JST: 全項目 (core shard の変異試験 + ratchet / Miri / loom / bench / ignored)、夜間に回せなかった範囲の変異試験
    - cron: '30 17 * * 1-5'   # 火〜土 02:30 JST: 前回測り終えた夜以降に main に入った変更の行だけを変異試験 (見逃しで失敗)
  workflow_dispatch:
    inputs:
      scope:
        # 例: "--file src/solver.rs -F update_velocities -F raycast"  空 = 通常の core 16 shard × 2 feature
        # local では並行する cargo build と競合してメモリ不足 / timeout で測定が壊れる (2026-09-15)
        # ため、関数限定の measurement は GH runner で行う (mutants-scoped job 1 本、shard job は skip)
        description: 'cargo mutants の対象限定引数 (--file / -F)、空なら週次と同じ core shard'
        required: false
        default: ''
        type: string
      features:
        # feature-gated module (analytics_bridge = `analytics` 等) は default 軸では
        # 全 mutant が「非 compile = missed」になり 0 % に見える (2026-09-15 a* run) → 測定する
        # feature を明示する 空 = 通常の 2 軸 (default / parallel,gpu-solver-bridge)
        description: 'scoped 測定時に有効化する cargo features (例: analytics)、空なら 2 軸'
        required: false
        default: ''
        type: string
      diff_base:
        # 例: 40 桁の commit  その commit から HEAD までの差分を夜間と同じ形 (shard に分けた in-diff) で試す
        # 記録は夜間の起点には数えない (kind pr)、週次の項目 (core shard / Miri / bench 等) は走らない
        description: 'in-diff の起点の commit (空 = 週次と同じ全項目)'
        required: false
        default: ''
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/quality-deep.yml'

# one run at a time (the weekly run waits for the nightly one instead of doubling the load)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants-scoped:
    name: Mutation testing (scoped, ${{ inputs.scope }})
    if: github.event_name == 'workflow_dispatch' && inputs.scope != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # an explicit `features` input replaces the two default axes (an
        # `exclude` entry with an empty-string value does not match, so the
        # axis list is built with fromJSON instead; 2026-09-16)
        features: ${{ fromJSON(inputs.features != '' && format('["{0}"]', inputs.features) || '["", "parallel,gpu-solver-bridge"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          # the version .cargo/mutants.toml (profile = "ci-test") was verified with, as in ci.yml
          tool: cargo-mutants@27.1.0
      - name: Mutants (scoped)
        run: |
          # build deadline + ulimit: a mutated `const fn` (math.rs CORDIC tables) can
          # send rustc const-eval into an unbounded loop that the test timeout never
          # reaches; the runner then dies of OOM (shard 7/8 twice, 2026-09-15).
          # The build deadline is 3x this run's own unmutated build (--build-timeout-multiplier),
          # not a fixed time: at a fixed 240 s the feature axis (unmutated build 157-168 s, two
          # builds at once under -j 2) read build timeout for 129 of 171, 132 of 132 and 78 of
          # 105 mutants on the nights of 11-17, 11-20 and 11-21, and tested none of them.
          # Exit codes: 0 all caught, 2 missed, 3 timeouts = measurement results;
          # anything else (4 = unmutated baseline red, 1 = usage) fails the job —
          # a red baseline measured nothing and used to be hidden by `|| true`.
          # Test timeout: derived from this run's own unmutated baseline (cargo-mutants measures
          # the baseline with no limit, then gives each mutant multiplier x that time). A fixed
          # --timeout also bounds the baseline: at 300 s the baseline itself timed out (runs
          # 43120898219 and 44420952496, e.g. 162 s build + 300 s test, 0 mutants tested), and
          # on nights whose baseline took 201-286 s almost every mutant read TIMEOUT without
          # hanging (46/47, 41/42, 59/60). Multiplier 3 from the measured spread: under -j 2 a
          # mutant's test run takes a median 1.5-2.4x the baseline's, max 2.6x (nightlies 11-10
          # to 11-20: 6->9 s, 9->15 s, 19->46 s, 28->63 s, 43->93 s, 112->207 s, 144->262 s;
          # largest single mutant 19->49 s); the floor of 60 s covers a
          # baseline of a few seconds. A mutant that hangs costs 3x the baseline (about 6 min
          # at the 2 min baselines above) instead of 300 s.
          # Exit 4 = the unmutated baseline failed or timed out: nothing was measured, so the
          # job fails with the baseline's measured time (never a quiet "0 mutants tested").
          ulimit -v 6291456
          set +e
          cargo mutants ${{ inputs.scope }} --timeout-multiplier 3 --minimum-test-timeout 60 --build-timeout-multiplier 3 -j 2 --output mutants.out \
            ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }} -- --lib 2>&1 | tee /tmp/mutants.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 4 ]; then
            base=$(sed -E 's/\x1b\[[0-9;]*m//g' /tmp/mutants.log | grep -m1 'Unmutated baseline' || echo 'no baseline line in the log')
            echo "::error::cargo-mutants exit 4: the unmutated baseline failed or timed out, 0 mutants tested ($base)"
            exit 4
          fi
          case $rc in 0|2|3) ;; *) echo "::error::cargo-mutants exit $rc (baseline red or usage error)"; exit "$rc";; esac
      - name: Summary
        if: always()
        run: |
          {
            echo "## cargo-mutants scoped: \`${{ inputs.scope }}\` (features: ${{ matrix.features == '' && 'default' || matrix.features }})"
            # cargo-mutants writes into mutants.out/mutants.out/ (--output names the parent)
            root=mutants.out; [ -d mutants.out/mutants.out ] && root=mutants.out/mutants.out
            export MUTANTS_ROOT="$root"
            if [ -f "$root/outcomes.json" ]; then
              python3 - <<'PY'
          import json
          import os
          d = json.load(open(os.path.join(os.environ["MUTANTS_ROOT"], "outcomes.json")))
          caught = d.get("caught", 0); missed = d.get("missed", 0); un = d.get("unviable", 0); to = d.get("timeout", 0)
          tot = caught + missed
          print(f"- caught {caught} / missed {missed} / unviable {un} / timeout {to}")
          print(f"- mutation score: {caught / tot * 100:.1f}% (目標 ≥ 80%)" if tot else "- no viable mutants")
          PY
              echo; echo "### missed"; cat "$root/missed.txt" 2>/dev/null | head -100
            else
              echo "no output (build failed?)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutants-scoped-${{ matrix.features == '' && 'default' || matrix.features }}
          path: mutants.out
          if-no-files-found: ignore

  mutants-plan:
    # What the mutation jobs of this run are (scripts/mutants_nightly.py):
    # - nightly / PR: the diff since the base, cut into shards of at most 100 mutants per feature
    #   axis. One job gets through 115-180 mutants in its 270 min (nights of 11-17 to 11-21), and the
    #   plans of those nights were 1022 / 690 / 1634 / 388 / 105: as one job per axis only the last
    #   could finish. At most 8 shards per axis; a larger plan is not run, the job fails with the
    #   count and the range is set aside for the weekly run.
    # - the nightly base is the head of the latest nightly run that measured every shard (or was
    #   set aside, or had no mutant), not a clock: the schedule starts 4.7-6.4 h late, and a night
    #   that was cancelled or did not finish must not drop its lines.
    # - weekly: the 16 core shards x 2 axes, and every range set aside and not yet measured.
    # Each plan is uploaded as a record (kept 30 days; the runs are read back 21 days).
    name: Mutation plan (shards of the diff, ranges set aside)
    if: github.event_name != 'workflow_dispatch' || inputs.scope == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          BASE_REF: ${{ github.base_ref }}
          DIFF_BASE: ${{ inputs.diff_base }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "$EVENT" = pull_request ] || [ -n "$DIFF_BASE" ]; then mode="pr"
          elif [ "$SCHEDULE" = '30 17 * * 1-5' ]; then mode="nightly"
          else mode="weekly"; fi
          head=$(git rev-parse HEAD)
          python3 scripts/mutants_nightly.py fetch --repo "$GITHUB_REPOSITORY" --self "$GITHUB_RUN_ID" --out /tmp/runs.json
          over=false
          if [ "$mode" = weekly ]; then
            python3 scripts/mutants_nightly.py weekly --runs /tmp/runs.json --head "$head" --now "$now" \
              --out-record mutants-record.json --out-matrix /tmp/matrix.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if [ -n "$DIFF_BASE" ]; then
              base=$(git rev-parse --verify -q "$DIFF_BASE^{commit}") || { echo "::error::diff_base '$DIFF_BASE' is not a commit"; exit 1; }
              git merge-base --is-ancestor "$base" HEAD || { echo "::error::diff_base $base is not an ancestor of HEAD"; exit 1; }
              why="the dispatch's diff_base"
            elif [ "$mode" = pr ]; then
              base=$(git rev-parse "origin/$BASE_REF"); why="the base of the pull request"
            else
              base=$(python3 scripts/mutants_nightly.py base --runs /tmp/runs.json 2> /tmp/why)
              why=$(cat /tmp/why)
              if [ -n "$base" ] && ! git merge-base --is-ancestor "$base" HEAD; then
                why="$why, but $base is not an ancestor of HEAD"; base=
              fi
              if [ -z "$base" ]; then
                base=$(git rev-list -1 --before="25 hours ago" HEAD)
                why="$why: falling back to the commit of 25 hours ago"
              fi
            fi
            echo "base $base ($why), head $head" | tee -a "$GITHUB_STEP_SUMMARY"
            git diff "$base" HEAD -- src tests Cargo.toml > /tmp/change.diff
            counts=()
            for axis in "default=" "features=parallel,gpu-solver-bridge,simd"; do
              n=0
              if [ -s /tmp/change.diff ]; then
                python3 scripts/mutants_in_diff_plan.py /tmp/change.diff --features "${axis#*=}" --out /tmp/planned.diff > /dev/null
                if [ -s /tmp/planned.diff ]; then
                  cargo mutants --list --in-diff /tmp/planned.diff > /tmp/listed.txt
                  n=$(grep -c . /tmp/listed.txt || true)
                fi
              fi
              counts+=(--count "${axis%%=*}=$n")
            done
            set +e
            python3 scripts/mutants_nightly.py plan --mode "$mode" --runs /tmp/runs.json --base "$base" --head "$head" \
              --base-reason "$why" --now "$now" "${counts[@]}" \
              --out-record mutants-record.json --out-matrix /tmp/matrix.json 2> /tmp/plan.err | tee -a "$GITHUB_STEP_SUMMARY"
            rc=${PIPESTATUS[0]}
            set -e
            cat /tmp/plan.err >&2
            case $rc in
              0) ;;
              5) over=true; echo "::error::$(sed 's/^error: //' /tmp/plan.err)" ;;
              *) exit "$rc" ;;
            esac
          fi
          {
            echo "mode=$mode"
            echo "over=$over"
            echo "matrix=$(cat /tmp/matrix.json)"
            echo "jobs=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["include"]))' /tmp/matrix.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutants-record
          path: mutants-record.json
          retention-days: 30
          if-no-files-found: error
      - name: The plan is within the cap
        if: steps.plan.outputs.over == 'true'
        run: |
          echo "::error::the plan is over the cap: no mutant was tested tonight, the range is set aside for the weekly run"
          exit 1

  mutants-accounted-age:
    name: Ranges set aside for the weekly run (none open for more than 8 days)
    needs: mutants-plan
    if: needs.mutants-plan.outputs.mode == 'weekly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: mutants-record
      - name: No range has been open for more than 8 days
        run: python3 scripts/mutants_nightly.py age --record mutants-record.json --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"

  mutants:
    needs: mutants-plan
    if: needs.mutants-plan.outputs.jobs != '0'
    # 2026-09-15 初回実測: 全 crate = 30,677 mutant × 6-9 s (毎回 1378 test) × -j 2 ≈ 30 h、
    # 300 min timeout で a* 5 file しか進まず cancelled (MISSED 290 = animation_blend 157 /
    # anisotropic 55 / aeroelasticity 46 / analytics_bridge 26 / acoustic_wave 6)
    # → PR は --in-diff (差分のみ)、週次は決定論 core 8 module を shard 並列
    # 2 回目実測 (8 shard): GH runner は 1 mutant ≈ 7 s build + 46-76 s test (integration 含む 1382 test)、
    # 360 mutant / shard で 2h37m、7/8 shard が 180 min timeout → 16 shard + `-- --lib` (integration 除外、
    # Mac 実測 66 s → 28 s) + timeout 300 に変更 shard 2 の score: caught 64 / missed 192 = 25%
    # 2026-09-15 3 回目実測: default feature だけだと `#[cfg(feature = "parallel")]` / gpu-solver-bridge 内の
    # code が compile されず「変異しても変わらない = missed」に数えられる (solver.rs で 163 / 575) → feature 軸を追加
    name: Mutation testing (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # at most four mutation jobs at once: the weekly 32 jobs ran together and
      # held the runners the landing CI needed for hours
      max-parallel: 4
      # one entry per job, from the plan: kind (diff / core), shard, of, features, base, head,
      # label, artifact. The second feature axis also turns `simd` on: the x86_64 SIMD paths
      # (`cross_simd`, `dot_batch_4`, the `simd_width` lane count) are only compiled with it,
      # and the default axis keeps testing the scalar fallbacks
      matrix: ${{ fromJSON(needs.mutants-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # a range set aside is tested at its own head (the diff's line numbers are that tree's)
          ref: ${{ matrix.head }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          # the version .cargo/mutants.toml (profile = "ci-test") was verified with, as in ci.yml
          tool: cargo-mutants@27.1.0
      - name: Mutants (in-diff shard, a missed mutant fails)
        if: matrix.kind == 'diff'
        run: |
          # the plan's base: the head of the latest night that measured (or the pull request's base)
          base="${{ matrix.base }}"
          # tests/ is in the diff so the plan sees the test files the change came with (they are
          # run, never mutated: the plan leaves them out of /tmp/planned.diff)
          git diff "$base" HEAD -- src tests Cargo.toml > /tmp/change.diff
          if [ ! -s /tmp/change.diff ]; then echo "no source change between $base and HEAD"; touch /tmp/measured; exit 0; fi
          # a module behind #[cfg(feature = ...)] is not compiled without its feature, so all
          # its mutants would read "missed"; turn the features of the changed modules on and
          # run, besides --lib, the integration tests named after them, the test files the diff
          # changes, and the test files that name a changed module (until 2026-11-22 only the
          # first: the oracle of a cloth change in tests/analytic_self_contact.rs was not run and
          # its mutants read missed). A file that marks tests `// mutants: fast` runs only those
          # (`skip`); the summary lists each target with its reason and what was not run
          # changed lines under a cfg the host test run cannot build (a wasm / python-only item) are not
          # mutated: the plan reports them by count in the summary as not exercised, never as missed
          plan=$(python3 scripts/mutants_in_diff_plan.py /tmp/change.diff \
            --features "${{ matrix.features }}" --out /tmp/planned.diff --summary "$GITHUB_STEP_SUMMARY")
          echo "plan: $plan"
          features=$(printf '%s' "$plan" | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)["features"]))')
          tests=$(printf '%s' "$plan" | python3 -c 'import json,sys; print(" ".join("--cargo-arg=--test=" + t for t in json.load(sys.stdin)["tests"]))')
          skips=$(printf '%s' "$plan" | python3 -c 'import json,sys; print(" ".join("--skip " + t for t in json.load(sys.stdin)["skip"]))')
          if [ ! -s /tmp/planned.diff ]; then echo "no change in code the host test run can build"; touch /tmp/measured; exit 0; fi
          ulimit -v 6291456
          set +e
          # `--cargo-arg` limits the build of every mutant to the lib tests and the planned
          # integration tests (`-- --lib` built every test target, about 4 min per mutant).
          # The run is stopped with SIGINT before the job's own timeout, so cargo-mutants
          # writes what it tested; an unfinished run then fails below instead of being
          # cancelled with its missed mutants unreported.
          # shellcheck disable=SC2086
          # Test timeout: derived from this run's own unmutated baseline (cargo-mutants measures
          # the baseline with no limit, then gives each mutant multiplier x that time). A fixed
          # --timeout also bounds the baseline: at 300 s the baseline itself timed out (runs
          # 43120898219 and 44420952496, e.g. 162 s build + 300 s test, 0 mutants tested), and
          # on nights whose baseline took 201-286 s almost every mutant read TIMEOUT without
          # hanging (46/47, 41/42, 59/60). Multiplier 3 from the measured spread: under -j 2 a
          # mutant's test run takes a median 1.5-2.4x the baseline's, max 2.6x (nightlies 11-10
          # to 11-20: 6->9 s, 9->15 s, 19->46 s, 28->63 s, 43->93 s, 112->207 s, 144->262 s;
          # largest single mutant 19->49 s); the floor of 60 s covers a
          # baseline of a few seconds. A mutant that hangs costs 3x the baseline (about 6 min
          # at the 2 min baselines above) instead of 300 s.
          # Exit 4 = the unmutated baseline failed or timed out: nothing was measured, so the
          # job fails with the baseline's measured time (never a quiet "0 mutants tested").
          timeout --signal=INT --kill-after=10m 270m \
            cargo mutants --in-diff /tmp/planned.diff --shard "${{ matrix.shard }}/${{ matrix.of }}" --timeout-multiplier 3 --minimum-test-timeout 60 --build-timeout-multiplier 3 -j 2 --output mutants.out \
            ${features:+--features "$features"} --cargo-arg=--lib $tests ${skips:+-- -- --exact $skips} 2>&1 | tee /tmp/mutants.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 4 ]; then
            base=$(sed -E 's/\x1b\[[0-9;]*m//g' /tmp/mutants.log | grep -m1 'Unmutated baseline' || echo 'no baseline line in the log')
            echo "::error::cargo-mutants exit 4: the unmutated baseline failed or timed out, 0 mutants tested ($base)"
            exit 4
          fi
          # cargo-mutants exits 0 without an output directory when the diff holds nothing
          # to mutate (doc comments only, Cargo.toml only): nothing to check, not a failure
          if [ "$rc" -eq 0 ] && [ ! -d mutants.out ]; then
            echo "no mutant in the changed lines"
            touch /tmp/measured
            exit 0
          fi
          # equivalent mutants (scripts/mutants-equivalent.txt, keyed by position and the
          # hash of their source line) are reported by cargo-mutants on every run; only
          # the others are survivors
          # cargo-mutants writes into mutants.out/mutants.out/; until 2026-11-16 this read
          # mutants.out/missed.txt, which does not exist, so every run reported 0 missed
          root=mutants.out; [ -d mutants.out/mutants.out ] && root=mutants.out/mutants.out
          if [ ! -f "$root/missed.txt" ]; then
            # a killed run writes no missed.txt: the status below says so; a complete one must have it
            if python3 scripts/mutants_run_status.py mutants.out > /dev/null; then
              echo "::error::the run is complete but $root/missed.txt does not exist (nothing was compared)"
              exit 1
            fi
            : > mutants.out/missed-real.txt
          else
            python3 scripts/mutants_equivalent.py --filter "$root/missed.txt" > mutants.out/missed-real.txt
          fi
          missed=$(grep -c . mutants.out/missed-real.txt || true)
          if [ "${missed:-0}" -gt 0 ]; then
            echo "::error::$missed mutant(s) of the changed lines were missed (see the summary)"
            cat mutants.out/missed-real.txt
          fi
          # killed (stopped before every planned mutant had an outcome) and not measured (mostly
          # build timeouts: the run measured its build deadline) are not results: the step fails
          # with the line, never reads as green or as "missed"
          set +e
          line=$(python3 scripts/mutants_run_status.py mutants.out)
          verdict=$?
          set -e
          if [ "$verdict" -ne 0 ]; then
            echo "::error::in-diff mutants $line (cargo-mutants exit $rc)"
            exit 1
          fi
          # every planned mutant of this shard has an outcome: the night counts as measured for
          # this shard whether or not a mutant was missed (the step below reports it)
          touch /tmp/measured
          if ! python3 scripts/mutants_ratchet.py --out mutants.out --complete-only; then
            echo "::error::the in-diff run did not finish: its mutants were not all tested (cargo-mutants exit $rc)"
            exit 1
          fi
          # 0 = all caught, 2 = a mutant survived (fails unless every survivor is a listed
          # equivalent mutant: the change came without a test that sees it),
          # 3 = timeouts only (reported, not failed), anything else = baseline red / usage error
          case $rc in
            0|2|3) [ "${missed:-0}" -eq 0 ] || exit 1 ;;
            *) echo "::error::cargo-mutants exit $rc (baseline red or usage error)"; exit "$rc" ;;
          esac
      # `--cargo-arg=--lib` restricts both the build and the test run of every mutant to the
      # lib tests. `-- --lib` (until 2026-10) ran the same tests but built every integration
      # test and example per mutant: 3.5 min per mutant against 10 s, same missed set.
      # read by the plan of later runs (scripts/mutants_nightly.py, MEASURED_STEP): a night is the
      # next base, and a range set aside is closed, only when this step passed in every shard job
      - name: Measured (every planned mutant of this shard has an outcome)
        if: always() && matrix.kind == 'diff'
        run: test -f /tmp/measured
      - name: Mutants (weekly = core 8 module, shard ${{ matrix.shard }}/16, lib test のみ)
        if: matrix.kind == 'core'
        run: |
          ulimit -v 6291456
          set +e
          # test timeout derived from the run's own baseline (see the in-diff step for the numbers)
          cargo mutants --shard ${{ matrix.shard }}/16 -j 2 --timeout-multiplier 3 --minimum-test-timeout 60 --build-timeout-multiplier 3 --output mutants.out \
            ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }} \
            --file src/solver.rs --file src/solver_tgs.rs --file src/math.rs --file src/collider.rs \
            --file src/bvh.rs --file src/joint.rs --file src/contact_cache.rs --file src/ccd.rs \
            --cargo-arg=--lib 2>&1 | tee /tmp/mutants.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 4 ]; then
            base=$(sed -E 's/\x1b\[[0-9;]*m//g' /tmp/mutants.log | grep -m1 'Unmutated baseline' || echo 'no baseline line in the log')
            echo "::error::cargo-mutants exit 4: the unmutated baseline failed or timed out, 0 mutants tested ($base)"
            exit 4
          fi
          case $rc in 0|2|3) ;; *) echo "::error::cargo-mutants exit $rc (baseline red or usage error)"; exit "$rc";; esac
      - name: Summary
        if: always()
        run: |
          {
            echo "## cargo-mutants (${{ matrix.label }})"
            # cargo-mutants writes into mutants.out/mutants.out/ (--output names the parent)
            root=mutants.out; [ -d mutants.out/mutants.out ] && root=mutants.out/mutants.out
            export MUTANTS_ROOT="$root"
            if [ -f "$root/outcomes.json" ]; then
              python3 - <<'PY'
          import json
          import os
          d = json.load(open(os.path.join(os.environ["MUTANTS_ROOT"], "outcomes.json")))
          s = d.get("summary", d)
          caught = s.get("caught", 0); missed = s.get("missed", 0); un = s.get("unviable", 0); to = s.get("timeout", 0)
          tot = caught + missed
          print(f"- caught {caught} / missed {missed} / unviable {un} / timeout {to}")
          print(f"- mutation score: {caught / tot * 100:.1f}% (目標 ≥ 80%)" if tot else "- no viable mutants")
          PY
              # complete / killed (n/planned tested) / not measured: a killed or unmeasured run is not a result
              python3 scripts/mutants_run_status.py mutants.out || true
              echo; echo "### missed"; cat "$root/missed.txt" 2>/dev/null | head -50
            else
              echo "no output (build failed?)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: mutants.out
          if-no-files-found: ignore

  mutants-ratchet:
    # the weekly shards' missed mutants against scripts/mutants-missed-baseline.txt:
    # a mutant missed that was not missed before fails, and so does a baseline
    # entry this run caught (remove it); a shard that did not finish, or is
    # missing, fails the ratchet. Record a new baseline with `--write` after reviewing it.
    name: Mutation ratchet (weekly shards vs the missed baseline)
    needs: mutants
    if: always() && inputs.diff_base == '' && (github.event.schedule == '30 17 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.scope == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: mutants-out-*
          path: mutants-runs
      - name: Compare the missed mutants with the baseline
        # 16 shards x 2 feature axes: a shard that was cancelled, timed out or never
        # uploaded fails the ratchet instead of leaving its mutants unchecked
        run: python3 scripts/mutants_ratchet.py --out mutants-runs/* --expect-dirs 32

  loom:
    name: loom (batch colouring protocol, --cfg loom)
    if: inputs.diff_base == '' && (github.event.schedule != '30 17 * * 1-5')  # the nightly run is the in-diff mutants only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # loom explores every interleaving of the threads that write one colour
      # batch; a colouring that put two constraints sharing a dynamic body into
      # the same batch shows up as an unsynchronised access (the invariant the
      # raw-pointer slice wrappers rely on)
      - name: loom model tests
        run: cargo test --lib --features parallel loom_ -- --nocapture
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: 3

  miri:
    name: Miri (UB 検出、parallel feature)
    if: inputs.diff_base == '' && (github.event.schedule != '30 17 * * 1-5')  # the nightly run is the in-diff mutants only
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # 全 1378 test は数時間かかるため unsafe / 並列に触る test を指名
      # Mac 実測 (2026-09-15): coloring 4 test 12 s / bvh+contact_cache 26 test 17 s / solver::tests 全 52 は 10 分超
      # 対象を増やす時は本 list に追記 (solver = BodySlicePtr raw pointer 並列、bvh = escape pointer、
      # contact_cache = HashMap index、math = SIMD 以外の unsafe なし)
      # rayon (crossbeam-epoch 0.9 の tagged pointer) は Stacked Borrows では偽 UB を報告する
      # (2026-09-15 実測: `parallel_step_rebuilds_*` が SB で fail / Tree Borrows で pass) ため
      # parallel test は -Zmiri-tree-borrows、pool thread の終了待ちなしは -Zmiri-ignore-leaks で許容
      # parallel_step_static_hub_matches_sequential_solver (200 spoke × step) は miri ではメモリ不足で kill される
      # (Mac 実測 2026-09-15) ため対象外、rebuilds_* 1 本 (TB 32 s) のみ
      - name: Miri (solver coloring + parallel step, Tree Borrows)
        run: cargo +nightly miri test --lib --features parallel -- solver::tests::coloring solver::tests::parallel_step_rebuilds
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-ignore-leaks
      - name: Miri (bvh / contact_cache, Stacked Borrows)
        run: cargo +nightly miri test --lib -- bvh::tests contact_cache::tests
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  ignored-tests:
    # `#[ignore]` はこの repo で 2 つの互換でない意味に使われており、理由文だけが
    # それを見分ける手掛かり (`runtime:` = 通るが CI には遅い / `src gap:` `src bug:`
    # `the red is correct` = 現状では通らない目標) したがって 1 回の `--ignored` 走行を
    # 「green か red か」では読めない — `runtime:` の fail は退行、`src gap:` の pass は
    # doc に書かれた反転条件の成立であって、後者で job を red にすると意味が逆になる
    # 振り分けは scripts/run_ignored.py が行う (期待値表は source の理由文から毎回導出、
    # file に持たないので表そのものは drift しない 導出漏れは drift として報告される)
    #
    # 2026-09-30 追加の背景: それまで `--ignored` / `--include-ignored` を走らせる経路が
    # scripts/ にも .github/ にも 1 つも無く、ignore 側は compile されるだけで
    # (1) runtime の主張は誰も検証せず (2) gap が埋まっても誰も気付かない状態だった
    #
    # PR では走らせない (本 file の他 job と同じ方針): `runtime:` の 1 本だけで
    # CI Test job に +154..+309 s かかる実測がある (armaly_backward_step.rs の理由文)
    name: Ignored tests (runtime = must pass / src gap = must fail)
    if: inputs.diff_base == '' && (github.event_name != 'pull_request' && github.event.schedule != '30 17 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # build が落ちた時にも分類だけは log に残す (build 不要、1 秒未満)
      # step summary には書かない (下の step が同じ表を出すため二重になる)
      - name: Expectation table (derived from the #[ignore] reason strings)
        run: python3 scripts/run_ignored.py --list
      # feature set は scripts/preflight.sh の NATIVE を読む (script 側) —
      # preflight と 1 feature 違えた再生成で公開 API が 126 行消えた事案があるため
      # workflow 側に feature 文字列を書かない
      - name: Run the ignored tests and check each one against its reason
        run: python3 scripts/run_ignored.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ignored-report
          path: target/ignored-report.md
          if-no-files-found: ignore

  opt0-suite:
    # CI の Test job は suite 全体の 2 step (`cargo test` / `cargo test --features parallel`) を
    # opt-level 2 の profile ci-test で走らせる (Cargo.toml、debug assertions と overflow 検査は有効)
    # 最適化しない build でだけ現れる差 (未定義の振る舞いに依る結果・時間に依る oracle 等) を
    # 見落とさないため、同じ 2 step を週に 1 回 opt-level 0 (test profile) で走らせる
    # 0 件の実行は red (test result の行が無い・passed が 0)
    name: Whole suite at opt-level 0 (the two ci-test steps of CI, unoptimised)
    if: inputs.diff_base == '' && (github.event_name != 'pull_request' && github.event.schedule != '30 17 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test and cargo test --features parallel at opt-level 0
        shell: bash
        run: |
          set -o pipefail
          for features in "" "parallel"; do
            log="opt0-${features:-default}.log"
            cargo test --no-fail-fast ${features:+--features "$features"} 2>&1 | tee "$log"
            lines=$(grep -c '^test result: ' "$log" || true)
            passed=$(grep -E '^test result: ' "$log" | sed -E 's/.* ([0-9]+) passed.*/\1/' | awk '{s+=$1} END {print s+0}')
            echo "opt-level 0, features '${features:-default}': $lines result line(s), $passed test(s) passed" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "${lines:-0}" -gt 0 ] && [ "${passed:-0}" -gt 0 ] || { echo "::error::no test ran at opt-level 0 (features '${features:-default}')"; exit 1; }
          done

  laminar-plume:
    # 層流の点源 plume の検証場面 (examples/smoke_laminar_plume.rs、上面開放、0.32 × 0.64 × 0.32 m) を
    # 10 mm で 2 通り走らせる (窓は規則で決まる: 直前 4 s の流出 ≥ 0.95·源となった最初の秒 t0 から 8 s、
    # 実測 t0 = 18 s、最大 40 s): 熱 400 K/s は閉形式の成立条件 (plume の届く範囲が箱の内、その外の
    # 遠方場の N·t < 0.1、窓の間の流出が源と 5 % 以内) を満たし指数を出す (exit 0、SCENE ... valid)、
    # 熱 100 K/s は届く範囲が箱に入らず「scene invalid: reach」で失敗する (成立域の境界の記録)
    # 5 mm と 2.5 mm は Paperspace (checkpoint 付き)、指数の許容は細分化の収束を測ってから足す
    # 結果の行が 1 本も無い時は red (比較 0 件)
    name: Laminar plume scene at 10 mm (validity of the closed form, exponents)
    if: inputs.diff_base == '' && (github.event.schedule == '30 17 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.scope == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the run
        run: cargo build --release --example smoke_laminar_plume
      - name: heat 400 K/s (valid, window from t0 by rule, at most 40 s) and 100 K/s (outside validity, at most 60 s)
        shell: bash
        run: |
          set -o pipefail
          run=target/release/examples/smoke_laminar_plume
          "$run" 10 200 400 40 0.10 0.40 open > h400.log 2>&1 &
          a=$!
          "$run" 10 200 100 60 0.10 0.40 open > h100.log 2>&1 &
          b=$!
          rc400=0; wait "$a" || rc400=$?
          rc100=0; wait "$b" || rc100=$?
          grep -E '^(SCENE|RESULT)|scene invalid' h400.log h100.log | tee -a "$GITHUB_STEP_SUMMARY"
          if ! { [ "$rc400" -eq 0 ] && grep -q 'SCENE .* valid$' h400.log && grep -q '^RESULT ' h400.log; }; then
            echo "::error::heat 400 K/s did not run as a valid scene (exit $rc400)"
            tail -40 h400.log
            exit 1
          fi
          if ! { [ "$rc100" -ne 0 ] && grep -q 'scene invalid: reach' h100.log; }; then
            echo "::error::heat 100 K/s should be outside validity by its reach (exit $rc100)"
            tail -40 h100.log
            exit 1
          fi

  bench-regress:
    name: Bench regression (criterion, informational)
    if: inputs.diff_base == '' && (github.event.schedule != '30 17 * * 1-5')  # the nightly run is the in-diff mutants only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # install-action は critcmp 未対応 (::error 注釈 + binstall fallback) のため cache-cargo-install-action
      - name: Install critcmp
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: critcmp
      - name: Baseline (main)
        run: |
          git worktree add /tmp/base origin/main
          cd /tmp/base
          cp -r "$GITHUB_WORKSPACE/.github" . 2>/dev/null || true
          cargo bench --bench physics_bench -- --save-baseline main --noplot --warm-up-time 1 --measurement-time 3
          cp -r target/criterion "$GITHUB_WORKSPACE/target-criterion-main"
      - name: HEAD
        run: |
          mkdir -p target && rm -rf target/criterion && cp -r target-criterion-main target/criterion
          cargo bench --bench physics_bench -- --save-baseline head --noplot --warm-up-time 1 --measurement-time 3
      - name: Compare (±15% を summary に、informational)
        if: always()
        run: |
          {
            echo "## criterion main → head (GH runner ノイズあり = informational)"
            echo "### 全 bench (main / head)"
            echo '```'
            critcmp main head || true
            echo '```'
            echo "### 差分 15% 超のみ (dispatch on main は base = head なので空が正常)"
            echo '```'
            critcmp main head --threshold 15 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  coverage-full:
    name: Coverage (lib + integration tests, weekly ratchet)
    if: inputs.diff_base == '' && (github.event.schedule == '30 17 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.scope == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-full

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage (lib + tests/)
        run: |
          set -o pipefail
          cargo llvm-cov --lib --tests --summary-only 2>&1 | tee coverage-full-summary.txt

      # the same ratchet as the per-push lib job, against its own baseline: code
      # tested only from tests/ is held here; a rise is recorded with --write
      - name: Line-coverage ratchet (lib + tests/)
        run: >-
          python3 scripts/line_coverage_ratchet.py
          --summary coverage-full-summary.txt
          --baseline scripts/line-coverage-baseline-full.txt

      - name: Upload coverage summary as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-full-summary
          path: coverage-full-summary.txt
          retention-days: 30
