name: Wiring Status

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**/*.rs'
      - 'scripts/wiring_guard.py'
      - 'scripts/wiring-baseline.txt'
      - 'scripts/gen-wiring-status.py'

permissions:
  contents: read

# the check only reads the tree, so runs can be cancelled by a newer push
concurrency:
  group: status-docs-main
  cancel-in-progress: true

jobs:
  generate-wiring-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # The ledger is regenerated and committed when a change lands
      # (scripts/land.py); this workflow only checks that the committed copy
      # matches the tree. It does not commit: a bot commit would add an author.
      - name: Check docs/wiring-status.md is up to date
        run: |
          python3 scripts/gen-wiring-status.py
          if ! git diff --exit-code docs/wiring-status.md; then
            echo "::error::docs/wiring-status.md is stale: regenerate it (scripts/land.py does) and commit it with the change"
            exit 1
          fi
