name: Fuzz

# ALICE-SDF v1.7.7 (commit 52d26f9) を base に ALICE-Physics 用に調整
#
# 目的:
# - fuzz/Cargo.toml の [[bin]] を全部 build し (push / PR、build-all job)、push / PR では
#   core 4 target、夜間と手動では全 target を time-boxed 実行 (一覧は scripts/fuzz_targets.py)
# - 決定論 lockstep が scene format 経由で保たれることを検証 (roundtrip)
#
# 罠:
# - cargo-fuzz は nightly toolchain 必須 (rust-toolchain 不使用時も明示指定)

on:
  push:
    # no paths here: a branch created at a SHA another ref already has gets an empty
    # diff from GitHub's filter and the run is skipped; the changes job below compares
    # with merge-base(origin/main) instead (patterns: .github/paths/fuzz.txt)
    # ci/**: the same checks on the ci/<id> branch before main is fast-forwarded to it
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'scripts/fuzz_targets.py'
      - 'scripts/test_fuzz_targets.py'
      - 'scripts/changed_paths.py'
      - '.github/workflows/fuzz.yml'
      - '.github/paths/fuzz.txt'
  schedule:
    # 毎日 03:00 UTC = 12:00 JST (idle 時間帯)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-target fuzz duration (seconds)'
        required: false
        default: '60'
        type: string

concurrency:
  # one group per ref; a newer push cancels the older run of its branch, never a main run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/fuzz.txt

  # the targets to run, from fuzz/Cargo.toml: the core set on push / PR, every
  # [[bin]] on the nightly schedule and on a manual run
  targets:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - name: List the fuzz targets
        id: list
        run: |
          python3 scripts/test_fuzz_targets.py
          list=$(python3 scripts/fuzz_targets.py --matrix "${{ github.event_name }}")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "targets: $list"

  # every target compiles on every run, including those only run nightly (it ran on push
  # and PR only; the Gate needs one job set for every event)
  build-all:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Fuzz — build every target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Build every [[bin]] of fuzz/Cargo.toml
        run: |
          cd fuzz
          cargo +nightly build --bins

  fuzz:
    name: Fuzz — ${{ matrix.target }}
    needs: [changes, targets]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v5

      # cargo-fuzz は nightly toolchain 必須
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # build は blocking: compile error を continue-on-error で隠さない
      # (2026-09-15 まで job-level continue-on-error だったため
      #  fuzz_deterministic_roundtrip の E0639 が 2 日間 green 表示で silent だった)
      - name: Build fuzz target
        run: |
          cd fuzz
          cargo +nightly fuzz build "${{ matrix.target }}"

      - name: Set fuzz duration
        id: dur
        run: |
          DURATION="${{ github.event.inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            DURATION=60
          fi
          echo "seconds=$DURATION" >> "$GITHUB_OUTPUT"

      # a crash is a reproducible defect: the job fails, and the input that
      # crashed is kept as an artifact for triage
      - name: Run fuzz target (time-boxed)
        id: run
        run: |
          cd fuzz
          cargo +nightly fuzz run "${{ matrix.target }}" -- \
            -max_total_time=${{ steps.dur.outputs.seconds }}

      - name: Upload crash artifacts (if any)
        if: failure() && steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Report crash
        if: failure() && steps.run.outcome == 'failure'
        run: echo "::error::fuzz target ${{ matrix.target }} found a crash — see the fuzz-crash-${{ matrix.target }} artifact"

  # one result for the workflow: run=true needs every job above to succeed, run=false needs
  # them skipped (a skipped, cancelled or failed job after run=true is red)
  # not a required status check: a pull request that touches none of the paths has no run
  gate:
    name: Gate
    if: always()
    needs: [changes, targets, build-all, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
