name: CI

on:
  push:
    # `ci/**` is a staging branch: push a batch there, let the 4-OS suites run off
    # the local machine (all but Mac Intel), then fast-forward main to the same SHA
    # once the non-macOS legs are green; that push to main runs all 5 OS (the
    # evidence a publish needs). The local gate is `scripts/preflight.sh --fast`.
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  # nightly Mac Intel leg only, and only when main's HEAD has no successful Intel
  # job yet (the `gate` job); every other job skips the schedule
  schedule:
    - cron: '15 16 * * *'
  # a run dropped by the one-pending-run-per-group rule is re-created on the ci/<id> SHA
  # with `gh workflow run <workflow> --ref ci/<id>` (docs/CI_TRIGGERS.md, dropped runs)
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # On the schedule: a safety net. Every commit reaching main already runs all 5 OS
  # on its push, so the nightly runs the Mac Intel leg only when main's HEAD has no
  # successful `Test (macos-15-intel)` job (scripts/intel_nightly_gate.py reads
  # HEAD's CI runs with the read-only token; an API error runs the leg). Any other
  # event: run.
  # On a ci/** push or a manual run: `landing_scripts` is true when the branch changes
  # the landing script or its tests (compared with merge-base(origin/main) on a new or
  # force-pushed branch and on a manual run, before..after otherwise; an error is true).
  # The Mac Intel leg then runs on the ci/<id> SHA too and is read before the landing:
  # those files run the runner's own git and tools, which differ on the Intel image
  # (docs/CI_TRIGGERS.md, Mac Intel on a ci/** push).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run || 'true' }}
      # skipped (main push, schedule, pull request): false; ran without an answer: true
      landing_scripts: ${{ steps.landing.outcome == 'skipped' && 'false' || steps.landing.outputs.run || 'true' }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'
      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        with:
          fetch-depth: 0
      - id: landing
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
        # a manual run is compared like a new branch (changed_paths.py runs every manual run)
        run: >-
          if [ "$EVENT" = workflow_dispatch ]; then EVENT=push CREATED=true; fi;
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --pattern 'scripts/land.py' --pattern 'scripts/test_land.py'
      - id: decide
        if: github.event_name == 'schedule'
        # a crash of the script leaves the output empty, which reads as 'true' above
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/intel_nightly_gate.py

  test:
    name: Test (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    # per leg, from the slowest of the last successful runs: Intel macOS (max 192 min,
    # avg 100) stays at the 360-minute cap of a hosted runner, since twice its
    # maximum is above it; Windows (max 80) 160; the other legs (max 60) 120
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 360 || matrix.os == 'windows-latest' && 160 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        # v1.0 Item E Phase 2: 5 native platform matrix (WASM は独立 job で扱う)
        # - macos-latest       → aarch64-apple-darwin       (Mac ARM, primary dev, golden hash baseline)
        # - macos-15-intel     → x86_64-apple-darwin        (Mac Intel)
        # - ubuntu-latest      → x86_64-unknown-linux-gnu   (Linux x86)
        # - ubuntu-24.04-arm   → aarch64-unknown-linux-gnu  (Linux ARM、GA runner 2025-01+)
        # - windows-latest     → x86_64-pc-windows-msvc     (Windows x86)
        # + wasm-test job below → wasm32-wasip1 (WASI) via wasmtime
        # The Mac Intel leg (about 100 min) runs on pushes to main (all 5 OS) and on
        # the nightly schedule (that leg alone); a ci/** staging push or a pull request
        # runs the other four. Landing reads the non-macOS legs; macOS results are
        # read after landing. Exception: a ci/** push or a manual run whose branch
        # changes the landing script or its tests (gate: landing_scripts) runs all 5,
        # and the landing reads the Intel leg too.
        os: ${{ fromJSON(github.event_name == 'schedule' && '["macos-15-intel"]' || (github.event_name == 'push' && github.ref == 'refs/heads/main') && '["macos-latest", "macos-15-intel", "ubuntu-latest", "ubuntu-24.04-arm", "windows-latest"]' || (github.event_name != 'pull_request' && needs.gate.outputs.landing_scripts == 'true') && '["macos-latest", "macos-15-intel", "ubuntu-latest", "ubuntu-24.04-arm", "windows-latest"]' || '["macos-latest", "ubuntu-latest", "ubuntu-24.04-arm", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v5

      # README.md / README_JP.md / docs/MODULES.md vs Cargo.toml and src/lib.rs
      # (features, MSRV, dependency versions, example, module list, links).
      # Run on every OS so a locale or path difference in the checker itself
      # shows up here rather than as a silent pass.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: README sync checker (tests)
        run: python scripts/test_readme_sync.py
      - name: README sync (docs agree with Cargo.toml and src/)
        run: python scripts/readme_sync.py --check
      - name: Version sync checker (tests)
        run: python scripts/test_version_sync.py
      - name: Version sync (metadata and install lines follow Cargo.toml)
        run: python scripts/version_sync.py --check
      # ALICE-Law G11 (c): the files shared with the other crates are the bytes ALICE-Law's
      # table records (table and checker fetched at .github/shared-files-pin, both SHA-256
      # pinned); a difference, an unlisted shared path or nothing compared fails
      - name: Shared files equal ALICE-Law's table
        shell: bash
        run: |
          python3 scripts/test_shared_files.py
          scripts/shared_files.sh
      - name: Lib-test gate (tests)
        run: python scripts/test_lib_test_gate.py
      - name: Release determinism check (tests of the checker)
        run: python scripts/test_determinism_release.py
      - name: no_std dependent check (tests of the checker)
        run: python scripts/test_no_std_consumer.py
      - name: Binding build commands in the README (tests and check)
        run: |
          python scripts/test_binding_build_commands.py
          python scripts/binding_build_commands.py --check
      - name: Facade checker (tests)
        run: python scripts/test_facade_check.py
      - name: Preflight runs every cargo test of ci.yml (tests and check)
        run: |
          python scripts/test_preflight_ci_parity.py
          python scripts/preflight_ci_parity.py
      - name: Fuzz target list (tests and check)
        run: |
          python scripts/test_fuzz_targets.py
          python scripts/fuzz_targets.py --check
      - name: Semver-checks log reader (tests)
        run: python scripts/test_semver_checked.py
      - name: Semver baseline package reader (tests)
        run: python scripts/test_semver_baseline_has.py
      - name: Escape-sequence stripping for tool output (tests)
        run: python scripts/test_ansi.py
      - name: Clippy configuration of the library code (tests)
        run: python scripts/test_clippy_lib_gate.py
      # public documents: no development-process vocabulary or private names;
      # CHANGELOG version headings and [Unreleased] categories well formed
      - name: Docs lint (tests)
        run: python scripts/test_docs_lint.py
      - name: Docs lint (public documents, CHANGELOG structure)
        run: python scripts/docs_lint.py --check
      # no built library or executable is tracked outside .github/tracked-binaries.txt
      - name: Tracked binaries (tests)
        run: python scripts/test_tracked_binaries.py
      - name: Tracked binaries (no built binary is tracked)
        run: python scripts/tracked_binaries.py
      # coverage tables (docs/coverage/*.toml, hand-written): every cited test and
      # source symbol exists, oracles are not ignored, partial items and the
      # LIMITATION(<id>) comments in src/ point at each other
      - name: Coverage tables (tests)
        run: python scripts/test_coverage_check.py
      - name: Coverage reference converter (tests)
        run: python scripts/test_coverage_refs_to_symbols.py
      - name: Line-coverage ratchet (tests)
        run: python scripts/test_line_coverage_ratchet.py
      - name: Mutation ratchet (tests)
        run: python scripts/test_mutants_ratchet.py
      - name: Mutants exclude_re entries still match a real mutant (tests)
        run: python scripts/test_mutants_exclude_check.py
      - name: Equivalent mutants (tests)
        run: python scripts/test_mutants_equivalent.py
      # every equivalent-mutant entry has a reason and still matches its source line
      # (a moved or edited line fails here); an empty list fails
      - name: Equivalent mutants still match the source
        run: python scripts/mutants_equivalent.py --check
      - name: Mutation in-diff plan (tests)
        run: python scripts/test_mutants_in_diff_plan.py
      - name: Nightly Mac Intel gate (tests)
        run: python scripts/test_intel_nightly_gate.py
      # the weekly ignored-test run fails on a crash, a binary that runs too
      # long, or a run that checked nothing; these keep that runner honest on
      # every push (the run itself is too heavy for the landing path)
      - name: Ignored-test runner (tests)
        run: python scripts/test_run_ignored.py
      # ALICE-Law G14, static half: no fast-math-style flag, target-cpu=native or flag
      # value the guard cannot resolve in any file a flag can come from (deliberate
      # occurrences in scripts/build_config_allowlist.toml); nothing read fails. The
      # dynamic half's parser is tested here too (the check runs in determinism-release),
      # and the per-binary minimum of scripts/run_tests.sh
      - name: Build configuration guard (G14, tests and check)
        run: |
          python scripts/test_build_config_guard.py
          python scripts/build_config_guard.py
          python scripts/test_build_flags_check.py
          python scripts/test_run_tests.py
      - name: Ignored-test table derives
        run: python scripts/run_ignored.py --list
      - name: Bench count check (tests)
        run: python scripts/test_bench_counts_check.py
      - name: Heavy workflows stay off the landing path (tests)
        run: python scripts/test_ci_load_check.py
      - name: Heavy workflows stay off the landing path
        run: python scripts/ci_load_check.py
      # the changes jobs of the path-gated workflows, and the trigger table of
      # docs/CI_TRIGGERS.md against the workflows and .github/ci-evidence.toml
      - name: Changed-paths decider (tests and sync)
        run: |
          python scripts/test_changed_paths.py
          python scripts/changed_paths.py sync
      - name: CI trigger table (tests and check)
        run: |
          python scripts/test_ci_triggers_check.py
          python scripts/ci_triggers_check.py
      - name: Downstream release-tag selection (tests)
        run: python scripts/test_downstream_select_tag.py
      - name: Downstream repositories ALICE-LOL takes by path (tests)
        run: python scripts/test_downstream_siblings.py
      # includes a cargo build of a small provider and consumer (offline, no dependencies)
      - name: Downstream major-bump requirement rewrite (tests)
        run: python scripts/test_downstream_major_rewrite.py
      - name: Downstream path rewrite to the facade (tests)
        run: python scripts/test_downstream_path_rewrite.py
      - name: Downstream per-binary test counts (tests)
        run: python scripts/test_downstream_test_counts.py
      - name: Downstream GPU probe report (tests)
        run: python scripts/test_downstream_trt_probe.py
      # a small consumer locked to an older version from a local git source (offline)
      - name: Downstream lock move and resolve guard (tests)
        run: python scripts/test_downstream_resolve.py
      - name: Coverage tables (docs/coverage vs src/ and tests/)
        run: python scripts/coverage_check.py
      # SCIP integration ledger (docs/integration-status.md): the analysis is
      # tested on hand-built indexes here; the real index needs rust-analyzer and
      # is built by integration-status.yml
      - name: SCIP reach analysis (tests)
        run: python scripts/test_scip_reach.py
      - name: Known-defect symbol resolution (tests)
        run: python scripts/test_audit_refs.py
      - name: Feature-gated test runner (tests)
        run: python scripts/test_run_feature_gated_tests.py
      # how each module and each C ABI consumer is integrated
      # (docs/integration-levels.md): the analysis on hand-built indexes, and the
      # C ABI coverage, which needs no index (the module part runs in the scip job)
      - name: Integration levels (tests)
        run: python scripts/test_integration_levels.py
      - name: C ABI declared by every consumer or listed with a reason
        run: python scripts/integration_levels.py --no-index --check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # after the toolchain: land.py's children find cargo / rustc in the cargo directory, which
      # some runner images have only once the toolchain is installed (scripts/test_land.py
      # checks this order)
      - name: Landing script (tests)
        run: python scripts/test_land.py

      # the tools land.py's children need (python3 >= 3.11, bash, cargo, rustc, rust-analyzer
      # when installed, git) started the way a landing starts them, from a minimal environment;
      # seconds, and it fails when it executed nothing
      - name: Landing child environment (env-smoke)
        shell: bash
        # the cargo of this step's PATH is named to land.py (LAND_CARGO_DIR): the image may keep it
        # outside $CARGO_HOME/bin, and the emptied environment cannot find it otherwise
        run: |
          py="$(command -v python)"
          cargo="$(command -v cargo)" || { echo "::error::cargo is not on the PATH of this step"; exit 1; }
          cargo_dir="$(dirname "$cargo")"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo_dir="$(cygpath -w "$cargo_dir")"
            env -i SYSTEMROOT="$SYSTEMROOT" USERPROFILE="$USERPROFILE" HOME="$HOME" LAND_CARGO_DIR="$cargo_dir" PATH=/usr/bin "$py" scripts/land.py --env-smoke
          else
            env -i HOME="$HOME" USER="${USER:-runner}" LAND_CARGO_DIR="$cargo_dir" PATH=/usr/bin:/bin "$py" scripts/land.py --env-smoke
          fi

      - uses: Swatinem/rust-cache@v2

      # Cargo.lock is committed: every job builds the same dependency versions
      # the oracle ledger records, and a Cargo.toml change without its lock
      # update fails here instead of resolving afresh.
      - name: Cargo.lock matches Cargo.toml
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      # .cargo/mutants.toml's exclude_re entries are line-anchored proofs of
      # equivalence; code added above an excluded function shifts
      # cargo-mutants' reported line:col, silently making the entry match 0
      # mutants (scripts/mutants_exclude_check.py). `--list` only enumerates
      # candidate sites (no build-and-test per mutant), so this runs on every
      # push, not just the weekly cargo-mutants job in quality-deep.yml.
      # One OS only (ubuntu-latest): the match counts are a property of the
      # source text, not the platform, and installing cargo-mutants on all 5
      # OS every push would spend shared runner time with nothing to show
      # for the other 4 (their `cargo mutants --list` output is unverified
      # against this baseline, so a platform-specific difference there would
      # not be any more caught by running it 5 times than by running it once).
      - name: Install cargo-mutants
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutants exclude_re entries still match a real mutant
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/mutants_exclude_check.py

      # PIN markers must name an open known defect; external root causes must
      # name a crate Cargo resolves (docs/oracle-status.md lists both), read from
      # the committed Cargo.lock.
      - name: Oracle ledger links (PIN / root external)
        run: python scripts/gen-oracle-status.py --check

      # A crate that depends on this one builds every crate type in `[lib]
      # crate-type`, so the no_std story is checked the way a user meets it: a
      # `#![no_std]` crate with `default-features = false` (consumers/no_std),
      # warnings denied, alice-physics built and only as an rlib.
      - name: Build (no_std)
        run: cargo build --lib --no-default-features
      - name: Build (no_std dependent, warnings denied)
        run: python scripts/no_std_consumer.py

      - name: Build (std only)
        run: cargo build --lib --no-default-features --features "std"

      - name: Build (core — default features)
        run: cargo build --lib

      - name: Test (unit + integration + doc)
        run: cargo test

      # 1.2.0: the C ABI consumers (Unity P/Invoke, unreal-plugin/) link the
      # cdylib / staticlib — assert both are actually produced, not just the rlib.
      # the ffi test module (goldens the Unity / UE5 bindings replay) was never
      # executed in CI before 1.2.0 — only built
      - name: Test (FFI, lib)
        # quoted: a bare trailing `ffi::` makes YAML read the line as a mapping
        # (actionlint syntax-check; two pushes were red on this, 2026-09-15)
        run: 'cargo test --lib --features "ffi" "ffi::"'

      # The WebAssembly and Python bindings were compiled by no CI step: the
      # wasm unit tests run natively, the Python module (an extension module
      # that links against the interpreter at import time) is type-checked
      - name: Test (WebAssembly binding, lib)
        run: 'cargo test --lib --features "wasm" "wasm::"'

      - name: Check (Python binding)
        run: cargo check --lib --features "python"

      # `[lib] crate-type` is rlib only (3.0.1): the C libraries are built with the
      # commands the README documents, read from its binding-build-commands block, so
      # the documented commands and the build cannot diverge
      - name: Build (FFI) with the README's commands + assert cdylib / staticlib artifacts
        run: python scripts/binding_build_commands.py --run c

      - name: Build (parallel)
        run: cargo build --lib --features "parallel"

      - name: Test (parallel — unit + integration)
        run: cargo test --features "parallel"

      # full native feature set: the gpu-solver-bridge tests were only linted
      # (clippy), never run, before 1.2.0 — the quality-deep mutants job found
      # them failing in the unmutated tree
      - name: Test (full native feature set, lib)
        run: cargo test --lib --features "std,simd,parallel,ffi,gpu-solver-bridge"
      # the alice-crypto re-exports and KeyedRappor are behind their own feature
      - name: Test (privacy-crypto, lib)
        run: cargo test --lib --features privacy-crypto privacy

      # PHYSICS_SEMANTICS_ID and its table are constants no cfg gates: the same
      # file runs in `cargo test` above (default features) and here with the
      # features of the gated stepping paths, and both assert the same hex.
      # scripts/preflight.sh runs the same command
      - name: Test (semantics identifier, parallel + gpu-solver-bridge)
        run: cargo test --test physics_semantics_id --features "parallel,gpu-solver-bridge"

      # ALICE-Law G7: the peer entry checked against the resolved
      # alice-analytics, the closed list of boundaries, and every bridge path
      # refusing a GPU backend of another semantics; run_tests.sh fails unless
      # that many tests ran (a cfg'd-out test is red, not an empty green run)
      - name: Test (ALICE-Law G7 handshakes, analytics + gpu-solver-bridge)
        shell: bash
        run: |
          scripts/run_tests.sh physics_semantics_id=21 -- cargo test --test physics_semantics_id --features "analytics,neural"
          scripts/run_tests.sh law_g7_boundaries=4 -- cargo test --test law_g7_boundaries --features "analytics,gpu-solver-bridge"

      # The alice-physics facade (crates/alice-physics): every importable item of the core's
      # public API resolves through it (facade_paths, generated by scripts/facade_check.py),
      # and its identifier and types are the core's (facade_identity)
      - name: Test (facade paths and identity)
        shell: bash
        run: |
          scripts/run_tests.sh facade_paths=1 -- cargo test -p alice-physics --features "std,simd,parallel,ffi,gpu-solver-bridge" --test facade_paths
          scripts/run_tests.sh facade_identity=3 -- cargo test -p alice-physics --features "std,simd,parallel,ffi,gpu-solver-bridge" --test facade_identity
          cargo test -p alice-physics --doc

      # Integration tests gated on neural / analytics / gpu-solver-bridge:
      # the steps above enable those features only with --lib, so a file under
      # #![cfg(feature = "analytics")] compiled to zero tests and stayed green. The
      # script derives the file list from tests/ and fails when a selected target
      # executes zero tests; preflight.sh calls the same script with no arguments
      - name: Test (feature-gated integration tests, zero executed is red)
        run: python scripts/run_feature_gated_tests.py

      # test, not just build: a feature whose code is only compiled is a feature
      # whose effect nobody verifies (external review 2026-09-15: the SIMD paths
      # were scalar with dead intrinsics and no test caught the mismatch claim).
      - name: Test (SIMD, lib)
        run: cargo test --lib --features "simd"

      # ALICE-Law G14: round-to-nearest-even and no flush-to-zero, asserted at run
      # time in both profiles; scripts/run_tests.sh float_environment=2 fails unless
      # both tests passed (an ignored or cfg'd-out test is red, not an empty green run)
      - name: Test (float environment, debug and release)
        shell: bash
        run: |
          scripts/run_tests.sh float_environment=2 -- cargo test --test float_environment
          scripts/run_tests.sh float_environment=2 -- cargo test --release --test float_environment
      # ALICE-Law G3, syntax-tree check (tools/no-outer-fneg-of-fma, byte-identical to
      # ALICE-LOL's, built with --locked): its own tests over the shared probes
      # (tools/fneg-fma-ir-probes), then the check over src/ tests/ examples/ benches/ with
      # the exact fma-call counts of scripts/no-outer-fneg-of-fma-allowlist.toml
      - name: No negated fma result (syntax tree, format then tests then check)
        shell: bash
        run: |
          cargo fmt --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --check
          cargo test --quiet --locked --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml
          cargo run --quiet --locked --release --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --root .

  # Every example is built in release and executed (scripts/run_examples.py):
  # the examples were compiled by clippy --all-targets but never run, so three
  # of them kept asserting behaviour a library fix had changed and one ran for
  # more than ten minutes with every job green. The script takes the example
  # list and the union of their required-features from `cargo metadata`, fails
  # on a non-zero exit or a per-example timeout, and fails when it executed 0
  # examples; preflight.sh calls the same script with no arguments
  examples:
    if: github.event_name != 'schedule'
    name: Run examples (release)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: examples-release
      - name: Example runner (tests)
        run: python scripts/test_run_examples.py
      - name: Run every example (release, timeout per example, zero executed is red)
        run: python scripts/run_examples.py

  # v1.0 Item E Phase 2: WASM determinism check
  # `wasm32-wasip1` target で determinism_golden test を build → wasmtime で
  # 実行 SHA-256 hash が native platform (macOS ARM baseline) と bit-exact
  # 一致することを検証 Fix128 は純粋整数演算のため cross-platform bit-exact、
  # SDF 経路の f32 も IEEE 754 basic ops (+/-/*/sqrt) が platform 非依存
  # rust-analyzer SCIP index of the crate: every symbol a known-defect reason
  # names must exist (scripts/audit_refs.py), and no public item may become
  # unreached by non-test code without updating scripts/integration-baseline.txt
  # The determinism tests in release on the targets with a fused multiply-add
  # instruction (aarch64) and without one (x86_64): the optimiser may rewrite a
  # negated fused multiply-add into one with negated operands, which changes the
  # sign of a zero result, and only an optimised build on an FMA target shows it
  # (x86_64's default target calls libm's fma and has nothing to rewrite) The
  # test legs above run the same tests unoptimised; the counts are read per test
  # binary so a filter that matches nothing is red
  determinism-release:
    if: github.event_name != 'schedule'
    name: Determinism tests (release, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # the job does not run on the schedule (if: above); the matrix says the same so
        # scripts/ci_triggers_check.py reads the macOS leg's events correctly
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: determinism-release
      - name: Determinism tests (release)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: python3 scripts/determinism_release.py
      # ALICE-Law G14, dynamic half: the flags cargo really passes to rustc, read from
      # `-v` in a fresh target directory (a reused one prints Fresh without the command
      # line), in the release profile, for the default, full native and no_std feature
      # sets; fails on a native / fast-math / x87 flag, and when no command line for this
      # crate was seen
      - name: Effective rustc flags (G14)
        shell: bash
        run: |
          python3 scripts/build_flags_check.py -- cargo check --release --lib
          python3 scripts/build_flags_check.py -- cargo check --release --lib --features "std,simd,parallel,ffi,gpu-solver-bridge"
          python3 scripts/build_flags_check.py -- cargo check --release --lib --no-default-features

  scip:
    if: github.event_name != 'schedule'
    name: SCIP checks (defect references, L0 ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install rust-analyzer
        run: |
          rustup show active-toolchain
          rustup component add rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - name: Build SCIP indexes
        run: scripts/scip_index.sh
      - name: Every symbol named by a known-defect reason exists
        run: python3 scripts/audit_refs.py --check
      - name: No new L0 item, no stale baseline entry
        run: python3 scripts/scip_reach.py --check-baseline
      - name: Integration levels ledger, README and MODULES.md figures up to date
        run: python3 scripts/integration_levels.py --check

  sibling-features:
    if: github.event_name != 'schedule'
    name: Test (neural / analytics via crates.io siblings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sibling-features
      # The bridge modules (alice-ml / alice-analytics) come from crates.io.
      # Their contract tests never ran in CI before 1.2.0, so a sibling's stub
      # went unnoticed then; this job runs them.
      - name: Test (lib, neural + analytics)
        run: cargo test --lib --features "neural,analytics"

  js-binding:
    if: github.event_name != 'schedule'
    # the wasm-bindgen package called from JavaScript (Node), as an application would
    name: Test (WebAssembly binding from JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (with wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Ensure wasm32-unknown-unknown rust-std is installed
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-js
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # the CLI must be the version of the wasm-bindgen crate in Cargo.lock
      # (scripts/build_wasm_pkg.sh fails on a mismatch)
      - name: wasm-bindgen version of Cargo.lock
        id: wbg
        shell: bash
        run: |
          set -euo pipefail
          v=$(awk '/^\[\[package\]\]/{p=0} $0=="name = \"wasm-bindgen\""{p=1} p&&/^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          [ -n "$v" ] || { echo "error: no wasm-bindgen in Cargo.lock" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install the wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - name: Build the package and run tests/js (zero executed is red)
        run: bash scripts/run_js_binding_tests.sh
      # the package is built from the facade: its exports and its glue must be the engine's
      - name: The facade's wasm package equals the engine's (exports, JS glue, d.ts)
        run: python3 scripts/facade_wasm_check.py
      # every feature that applies in a browser, built for the browser target
      # (parallel / python / ffi do not apply; simd has no wasm path and falls
      # back to scalar)
      # the default and std-only builds draw no entropy source: a dependency
      # that needs one (getrandom) must not reach them (2.3.0 review)
      - name: Build for wasm32-unknown-unknown (default features)
        run: cargo build --lib --target wasm32-unknown-unknown
      - name: Build for wasm32-unknown-unknown (std only)
        run: cargo build --lib --target wasm32-unknown-unknown --no-default-features --features std
      - name: Build for wasm32-unknown-unknown with every browser feature
        run: cargo build --lib --target wasm32-unknown-unknown --no-default-features --features "std,wasm,neural,analytics,gpu-solver-bridge,simd"
      - name: Build for wasm32-unknown-unknown (privacy-crypto, entropy from the browser)
        run: cargo build --lib --target wasm32-unknown-unknown --no-default-features --features "std,wasm,privacy-crypto"

  wasm-test:
    if: github.event_name != 'schedule'
    name: Test (wasm32-wasip1 via wasmtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (with wasm32-wasip1)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      # dtolnay/rust-toolchain の targets: が rustup target 追加を silent
      # fail することがある fallback として明示 rustup target add を実行
      # (idempotent、既に install 済なら no-op)
      - name: Ensure wasm32-wasip1 rust-std is installed
        run: rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-wasip1

      # 2026-09-15: `curl … | bash` は curl が network error (35 Connection reset) でも
      # pipeline exit が bash 側 = 0 になり step green のまま次 step で `wasmtime: command not found`
      # (exit 127) になる (run 34863693753) 公式 setup action に置換 (retry 内蔵、pipefail 問題が消える)
      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Build determinism_golden test (wasm32-wasip1)
        run: cargo test --test determinism_golden --target wasm32-wasip1 --no-run

      - name: Run determinism_golden test via wasmtime
        run: |
          WASM_BIN=$(find target/wasm32-wasip1/debug/deps -name 'determinism_golden-*.wasm' -not -name '*.d' | head -1)
          echo "Executing: $WASM_BIN"
          wasmtime "$WASM_BIN"

      # v1.1.0: the f32/f64 field modules are pinned too (det_math + IEEE basic ops)
      - name: Build determinism_golden_f32 test (wasm32-wasip1)
        run: cargo test --test determinism_golden_f32 --target wasm32-wasip1 --no-run

      - name: Run determinism_golden_f32 test via wasmtime
        run: |
          WASM_BIN=$(find target/wasm32-wasip1/debug/deps -name 'determinism_golden_f32-*.wasm' -not -name '*.d' | head -1)
          echo "Executing: $WASM_BIN"
          wasmtime "$WASM_BIN"

      # contact scenes (restitution, friction, static friction, pre-solve veto);
      # the scenes above contain no body-body contact
      - name: Build determinism_golden_contacts test (wasm32-wasip1)
        run: cargo test --test determinism_golden_contacts --target wasm32-wasip1 --no-run

      - name: Run determinism_golden_contacts test via wasmtime
        run: |
          WASM_BIN=$(find target/wasm32-wasip1/debug/deps -name 'determinism_golden_contacts-*.wasm' -not -name '*.d' | head -1)
          echo "Executing: $WASM_BIN"
          wasmtime "$WASM_BIN"

  # The published C ABI libraries are built from the facade (alice-physics) so that their
  # names stay alice_physics; the #[no_mangle] functions live in the engine. Release
  # profile, as release.yml builds them: the exported symbols of the cdylib and the
  # defined C symbols of the staticlib are equal between the engine's and the facade's
  # build and include every function of include/alice_physics.h (0 compared fails)
  facade-artifacts:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Facade C ABI artifacts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # llvm-nm / llvm-readobj come from the toolchain rust-toolchain.toml pins (its
      # components list llvm-tools), which is the one the build runs on
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: facade-artifacts-${{ matrix.os }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Engine and facade libraries export the same C symbols
        run: python scripts/facade_artifacts.py

  clippy:
    if: github.event_name != 'schedule'
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # the release tags: scripts/id_move_check.py compares with the newest one
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (default features, lib + all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (the facade, native feature set, all targets)
        run: cargo clippy -p alice-physics --all-targets --features "std,simd,parallel,ffi,gpu-solver-bridge" -- -D warnings

      # every feature of the facade builds through it (scripts/facade_check.py)
      - name: Facade builds with each forwarded feature
        run: python3 scripts/facade_check.py --build-features

      # `--all-features` is not possible: `wasm` × `ffi` is a deliberate
      # `compile_error!`, and `python` needs a Python toolchain. Every
      # other feature is exercised here so lint drift in feature-gated
      # code (parallel / neural / analytics / ...) is a red gate, not a `-W`.
      - name: Clippy (full native feature set, lib + all targets)
        run: >-
          cargo clippy
          --features "std,simd,parallel,ffi,gpu-solver-bridge,neural,analytics,privacy-crypto"
          --all-targets -- -D warnings

      # The library code also may not call f32 / f64 max and min (the sign of an
      # equal pair of zeros differs between aarch64 and x86_64); it uses
      # det_math::max / min The extra entries are in .github/clippy-lib/clippy.toml,
      # generated from clippy.toml, so tests / examples / benches keep the std
      # functions The script checks that file is up to date and that clippy with
      # it flags every forbidden form in scripts/clippy-lib-canary (exit non-zero
      # and one diagnostic per form), so a configuration clippy does not read
      # cannot pass
      - name: Clippy (library code, f32 / f64 max and min forbidden)
        env:
          CLIPPY_CONF_DIR: .github/clippy-lib
        run: >-
          cargo clippy --lib
          --features "std,simd,parallel,ffi,gpu-solver-bridge,neural,analytics,privacy-crypto"
          -- -D warnings
      # `wasm` and `python` are left out of the set above (`wasm` × `ffi` is a
      # compile_error!), so their modules are linted on their own, for the
      # disallowed methods (libm and max / min) and the disallowed types
      # (std HashMap / HashSet / RandomState, seeded from OS randomness) only:
      # src/wasm.rs has exported
      # functions with more arguments than clippy's default, which no other step
      # lints either
      # The no_std build (`cfg(not(feature = "std"))` code) is linted the same way
      # (`[lib] crate-type` is rlib only, so `cargo clippy` builds it as is; the
      # no_std build has no warnings, which scripts/no_std_consumer.py keeps so)
      - name: Clippy (library code, max / min forbidden, wasm and python bindings, no_std)
        env:
          CLIPPY_CONF_DIR: .github/clippy-lib
        run: |
          cargo clippy --lib --features "wasm" -- -D clippy::disallowed_methods -D clippy::disallowed_types
          cargo clippy --lib --features "python" -- -D clippy::disallowed_methods -D clippy::disallowed_types
          cargo clippy --lib --no-default-features -- -D clippy::disallowed_methods -D clippy::disallowed_types
      - name: Library clippy configuration is current and fires (canary)
        run: python3 scripts/clippy_lib_gate.py
      # the manifest's allow_attributes_without_reason fires on every form of a
      # reasonless allow (canary), and each clock read clippy finds is covered
      # only by an allow on its own statement
      - name: Allow reasons (canary + clock reads)
        run: python3 scripts/allow_reason_guard.py --clippy
      # G9: an identifier (PHYSICS_SEMANTICS_ID) moves only with a breaking version, with the
      # released value in its previous list and the named previous-tests failing without it,
      # or both values named in CHANGELOG.md; the released value is read from the published
      # crate at the newest release tag (scripts/id_move_check.py, shared with the other ALICE
      # crates). A registry that cannot be read fails on main and warns on ci/ branches and PRs
      - name: Identifier moves (tests)
        run: python3 scripts/test_id_move_check.py
      - name: Identifier moves (the release compared with)
        id: id-base
        run: echo "crate=$(python3 scripts/id_move_check.py --print-base)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/registry/cache/*/${{ steps.id-base.outputs.crate }}.crate
          key: id-move-${{ steps.id-base.outputs.crate }}
      - name: Identifier moves (against the published release)
        run: python3 scripts/id_move_check.py

  # The declared `rust-version` is compiled with exactly that toolchain from the
  # committed Cargo.lock (generated with resolver = "3", which picks versions
  # that support `rust-version`) for the default, no_std and full native feature
  # sets. Bump `rust-version` and the
  # `@<version>` below in the same commit.
  # The pre-1.2.0 job regenerated the lockfile with stable and checked only the
  # std feature set, so the "1.70.0" claim was never actually compiled.
  msrv:
    if: github.event_name != 'schedule'
    name: MSRV (rust-version = 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.85

      - uses: Swatinem/rust-cache@v2

      # built and the library tests run from the committed lock: --locked fails
      # if the lock would need a version the toolchain cannot build
      - name: MSRV (lib, no_std build)
        run: cargo +1.85 build --lib --locked --no-default-features
      - name: MSRV (lib tests, default features)
        run: cargo +1.85 test --lib --locked
      # Library only: the sibling-crate bridge features (neural / analytics) and
      # privacy-crypto follow their own minimum, see README "Minimum supported
      # Rust version" and the msrv-privacy-crypto job below.
      - name: MSRV (lib tests, core native feature set)
        run: >-
          cargo +1.85 test --lib --locked
          --features "std,simd,parallel,ffi,gpu-solver-bridge"

  # privacy-crypto's dependency ctutils 0.4.5 needs Rust 1.87: the effective
  # minimum with that feature, built and tested from the committed lock
  msrv-privacy-crypto:
    if: github.event_name != 'schedule'
    name: MSRV with privacy-crypto (Rust 1.87)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: privacy-crypto on 1.87 (lib tests)
        run: cargo +1.87 test --lib --locked --features privacy-crypto
      # neural takes alice-ml 0.4, whose rust-version is 1.87: the same lane
      - name: neural on 1.87 (lib tests)
        run: cargo +1.87 test --lib --locked --features neural

  fmt:
    if: github.event_name != 'schedule'
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # the facade's features are the core's both ways, its lib is the glob re-export
      # only, and tests/facade_paths.rs is what docs/PUBLIC_API_SNAPSHOT.txt gives
      - name: Facade check (features, lib, generated path test)
        run: python3 scripts/facade_check.py

      # README § Determinism lists the f32 / f64 modules; the list is
      # generated from src/ and drifts silently when a module is added (1.2.0)
      - name: README f32 module row matches src/
        run: python3 scripts/f32_modules.py --check

      # 配線ガード: 実装したが production から呼ばれていない pub item と、理由の無い
      # allow(dead_code) の新規追加を止める (既存分は scripts/wiring-baseline.txt)
      - name: wiring-guard oracle (検査器自身の試験)
        run: python3 scripts/test_wiring_guard.py
      - name: wiring-guard (新規の未配線 / 理由の無い dead_code が無い)
        run: python3 scripts/wiring_guard.py
      # 決定論: production の code は OS の entropy も時計も使わない
      - name: Entropy guard (test first)
        run: python3 scripts/test_entropy_guard.py
      - name: Entropy guard (no OS entropy or wall clock in production code)
        run: python3 scripts/entropy_guard.py
      # float max / min come from alice-det-math, never a crate-local copy
      - name: Private max / min guard (test first)
        run: python3 scripts/test_no_private_minmax.py
      - name: Private max / min guard (no local copy of alice-det-math's max / min)
        run: python3 scripts/no_private_minmax.py
      # a max / min written as a comparison is not a method call, so clippy does not see it
      - name: G2 comparison rewrites (test first)
        run: python3 scripts/test_g2_rewrite_check.py
      - name: G2 comparison rewrites (every max / min written as a comparison is reviewed by type)
        run: python3 scripts/g2_rewrite_check.py
      # clippy refuses a reasonless allow (Cargo.toml); this judges the reasons
      - name: Allow reason guard (test first)
        run: python3 scripts/test_allow_reason_guard.py
      - name: Allow reason guard (reasons worth reading, no lint group, production allows counted)
        run: python3 scripts/allow_reason_guard.py
      # a bullet rewritten by a later commit must not survive twice in [Unreleased]
      - name: CHANGELOG duplicate bullets (test first)
        run: python3 scripts/test_changelog_dup_check.py
      - name: CHANGELOG duplicate bullets ([Unreleased] has no bullet written twice)
        run: python3 scripts/changelog_dup_check.py
      # the generated-file list and its all-at-once check (the preflight runs the check;
      # CI regenerates each ledger in its own status workflow)
      - name: Generated files list and stale check (test)
        run: python3 scripts/test_ledgers.py
      - name: Predictable randomness guard (test first)
        run: python3 scripts/test_csprng_guard.py
      - name: Predictable randomness guard
        run: python3 scripts/csprng_guard.py
      # G1, libm half: a direct libm dependency must come with the libm:: ban
      # in clippy.toml and scripts/libm_ban_check.py (0 manifests read fails)
      - name: libm dependency guard (test, then check)
        run: |
          # the guard parses Cargo.toml with tomllib (Python 3.11+); this job has
          # no setup-python, so fail with exit 2 instead of skipping if it is missing
          python3 -c 'import sys, importlib.util as u; print(sys.version); sys.exit(0 if u.find_spec("tomllib") else 2)'
          python3 scripts/test_libm_dependency_guard.py
          python3 scripts/libm_dependency_guard.py
      # 台帳 (docs/wiring-status.md / docs/oracle-status.md) の生成器の試験: 実際の
      # wiring_guard の出力の形を食わせる (違反を 1 件も拾えない空振りを止める)
      - name: status generators oracle (台帳の生成器自身の試験)
        run: python3 scripts/test_gen_status.py

  doc:
    if: github.event_name != 'schedule'
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Both the default and the docs.rs feature set: feature-gated modules
      # (gpu_bridge / ffi) had 9 broken intra-doc links that the default-only
      # job never saw (1.2.0).
      - name: cargo doc (no-deps, default features)
        run: cargo doc --lib --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"
      - name: cargo doc (no-deps, docs.rs feature set)
        run: cargo doc --lib --no-deps --features "std,simd,parallel,ffi,gpu-solver-bridge"
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    if: github.event_name != 'schedule'
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
      # every job has a job-level timeout-minutes (a hung step otherwise holds a shared
      # runner for GitHub's 6-hour limit); the checker's own tests run first
      - name: workflow-timeouts
        run: |
          python3 scripts/test_workflow_timeouts.py
          python3 scripts/workflow_timeouts.py

  feature-powerset:
    if: github.event_name != 'schedule'
    # 2026-09-15 追加: feature 組合せの compile 網羅
    # depth 2 = 単体 + 2 個組合せ (19 通り、Mac 実測 green)
    # - wasm は `std` 必須 (`compile_error!`) なので powerset から外し、std,wasm を別 step で check
    # - python (pyo3 build) / neural / analytics (sibling crate 実体必要) は除外
    name: Feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Powerset (depth 2, wasm/python/bridge 除外)
        run: cargo hack build --lib --feature-powerset --depth 2 --exclude-features python,neural,analytics,wasm
      - name: std + wasm (相互排他 ffi なし)
        run: cargo check --lib --no-default-features --features std,wasm
