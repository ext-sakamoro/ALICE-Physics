name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # v1.0 Item E Phase 1: 4 platform matrix
        # - macos-latest       → aarch64-apple-darwin   (Mac ARM, primary dev)
        # - macos-15-intel     → x86_64-apple-darwin    (Mac Intel, deprecation timeline aware)
        # - ubuntu-latest      → x86_64-unknown-linux-gnu (Linux x86)
        # - windows-latest     → x86_64-pc-windows-msvc (Windows x86)
        # Phase 2 (deferred): ubuntu-24.04-arm (Linux ARM) + WASM (wasm32-unknown-unknown)
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # inline stubs は composite action に集約 (canonical CI template [[reference_alice_ci_canonical_template]])
      # security-audit.yml / fuzz.yml と DRY で共有、license field 追加も一元管理
      - name: Create ALICE optional bridge stubs
        uses: ./.github/actions/alice-stubs

      - name: Build (no_std)
        run: cargo build --lib --no-default-features

      - name: Build (std only)
        run: cargo build --lib --no-default-features --features "std"

      - name: Build (core — default features)
        run: cargo build --lib

      - name: Test (unit + integration + doc)
        run: cargo test

      - name: Build (FFI)
        run: cargo build --features "ffi"

      - name: Build (parallel)
        run: cargo build --lib --features "parallel"

      - name: Test (parallel — unit + integration)
        run: cargo test --features "parallel"

      - name: Build (SIMD)
        run: cargo build --lib --features "simd"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -- -W clippy::all

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  doc:
    name: Doc (RUSTDOCFLAGS=-Dwarnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo doc (no-deps)
        run: cargo doc --lib --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
