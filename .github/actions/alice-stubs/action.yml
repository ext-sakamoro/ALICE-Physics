name: 'ALICE-Physics Optional Bridge Stubs'
description: |
  Create empty stub crates for the ALICE-Physics sibling path deps
  (alice-ml, alice-db, alice-analytics) so that ALICE-Physics can
  resolve its workspace-relative path deps in CI.
  These crates are private to the local ALICE Eco-System and not on crates.io.

  Canonical CI template: [[reference_alice_ci_canonical_template]]

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # ALICE-ML stub (basic)
        mkdir -p "../ALICE-ML/src"
        cat > "../ALICE-ML/Cargo.toml" <<'TOML'
        [package]
        name = "alice-ml"
        version = "0.1.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-ML/src/lib.rs"

        # ALICE-DB stub (basic)
        mkdir -p "../ALICE-DB/src"
        cat > "../ALICE-DB/Cargo.toml" <<'TOML'
        [package]
        name = "alice-db"
        version = "0.1.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-DB/src/lib.rs"

        # ALICE-Analytics stub (features 付き、`default = ["std"]` が Cargo.toml 側で参照される)
        mkdir -p "../ALICE-Analytics/src"
        cat > "../ALICE-Analytics/Cargo.toml" <<'TOML'
        [package]
        name = "alice-analytics"
        version = "0.1.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = ["std"]
        std = []

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-Analytics/src/lib.rs"

        echo "Created stubs: alice-ml / alice-db / alice-analytics (all with license = MIT OR Apache-2.0)"
