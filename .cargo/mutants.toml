# cargo-mutants configuration (quality-deep.yml weekly / scoped / in-diff jobs)
#
# Mutants inside `#[cfg(test)] mod tests` helpers (`tests::snapshot_world`,
# `tests::near`, …) are not production code and only dilute the score; the
# lib tests are the oracle, not the subject.
#
# Equivalent mutants, excluded with the reason (every entry must be proven to
# give bit-identical results, not just results inside a test tolerance). An
# entry here names no file position, which scripts/mutants_exclude_check.py
# refuses: a proof about one site of a function goes in
# scripts/mutants-equivalent.txt, keyed by that function and its hash.
#
# `replace > with >= in scaled_exp_neg` (src/smoke_fire.rs): the two forms
#   differ only when the remaining exponent is exactly the step (16). `>`
#   returns `a * exp_fix(-16)`; `>=` takes one more step and returns
#   `a * exp_fix(-16) * exp_fix(0)`, and `exp_fix(0)` is exactly 1 (the Taylor
#   series leaves only its first term), so the bits are the same for every `a`.
#   Any loop boundary of this function has the same property: the result is
#   continuous at the boundary, which is what makes the mutant equivalent.
#
# `replace < with <= in AABB::union` (src/collider.rs) and
# `replace > with >= in AABB::union` (src/collider.rs): per-axis
#   min/max selection; same tie argument as swept_aabb above (these are the
#   only `<`/`>` sites in this function, so no line-number restriction is
#   needed here).
#
# `replace > with >= in solve_hinge_joint` and
# `replace > with >= in solve_slider_joint` and
# `replace > with >= in solve_d6_joint` (src/joint.rs): each is a
#   joint's upper limit check (`angle > *m` / `along_axis > *m` / `proj >
#   limit_max` / `angle > limit_max`). At the exact limit the resulting
#   `error` (`angle - max` etc.) is exactly zero regardless of which branch
#   computed it, and every one of these is gated behind `if !error.is_zero()`
#   (or the angular equivalent) before any correction is applied — confirmed
#   by reading the slider and d6 solvers directly: a
#   zero-error correction is skipped entirely, not just zero-scaled. (d6 has
#   two sites, linear and angular; both equivalent for the same reason, so no
#   line-number restriction is needed for it. hinge and slider have exactly
#   one upper-bound `>` site each.)
#
# src/math.rs and src/bvh.rs (each line gives bit-identical results for every
# input the function can receive):
#
# `replace | with ^` in `Fix128::sqrt`, `Fix128::half`, `Fix128::shr_bits`,
#   `Fix128::double`, `<impl Div for Fix128>::div`, `select_fix128`,
#   `expand_bits`, `morton_code` and `BvhNode::leaf`: every `|` there joins two operands that have no set
#   bit in common (`x << 64` with a 64-bit value, `x << k` with a value below
#   `2^k`, `x >> 1` with a single top bit, a value and its complement mask,
#   fields packed into disjoint bit ranges, the 21-bit inputs `morton_code`
#   clamps before `expand_bits` spreads them). For disjoint operands `a | b`
#   and `a ^ b` are the same bits.
#
# `replace < with <= in Fix128::from_f64`: `f <= 0.0` differs from `f < 0.0`
#   only at `f == 0.0`, where the fraction `lo` is 0, so `f <= 0.0 && lo != 0`
#   is false either way (NaN fails both comparisons).
#
# `replace < with <= in Fix128::from_ratio`: `num <= 0` differs only at
#   `num == 0`, where the quotient is 0 and its negation is 0; `denom <= 0`
#   differs only at `denom == 0`, which returned before.
#
# NOT excluded despite looking like the upper-bound case below: `replace <
# with <= in solve_hinge_joint` (src/joint.rs), `...in solve_slider_joint`
# and `...in solve_d6_joint`, the
# four lower limit checks (`angle < *m` / `along_axis < *m` / `proj <
# limit_min` / `angle < limit_min`), each paired with an `else if value >
# max`. These were investigated and found NOT equivalent, and deliberately
# left in scripts/mutants-missed-baseline.txt: with an inverted interval
# (`min > max`), the tie point `value == min` can also satisfy `value >
# max` (e.g. `min = 1, max = 0`, value `= 1`), so the original `<` skips
# the min branch and falls into the max branch with a genuinely nonzero
# error (`value - max = 1`), while the mutated `<=` takes the min branch
# instead with a *zero* error (`min - value = 0`) — a real, observable
# difference. `HingeJoint::with_limits`, `SliderJoint::with_limits`,
# `D6Joint::with_linear_limits` and `with_angular_limits` reject `min >
# max` at construction, but that is not the only way to reach the solver:
# `PhysicsWorld::joints` is `pub Vec<Joint>` (src/solver.rs), and
# every joint's limit fields are themselves `pub`, so a struct literal, a
# direct field assignment, or `restore_world`'s snapshot deserialisation
# (src/solver/world_snapshot.rs, each joint variant read field by field
# with no ordering or sign check) can all construct an inverted interval
# without ever calling the builder. Making the limit fields private, or
# validating every one of these paths, would both be public-API breaking
# changes and are not pursued here.
exclude_re = [
    "tests::",
    "replace > with >= in scaled_exp_neg",
    "replace < with <= in AABB::union",
    "replace > with >= in AABB::union",
    "replace > with >= in solve_hinge_joint",
    "replace > with >= in solve_slider_joint",
    "replace > with >= in solve_d6_joint",
    "replace \\| with \\^ in Fix128::(sqrt|half|shr_bits|double)$",
    "replace \\| with \\^ in <impl Div for Fix128>::div$",
    "replace \\| with \\^ in select_fix128$",
    "replace \\| with \\^ in (expand_bits|morton_code|BvhNode::leaf)$",
    "replace < with <= in Fix128::(from_f64|from_ratio)$",
]
