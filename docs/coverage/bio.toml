# Biomechanics coverage of ALICE-Physics, against an external reference frame.
# 実装が無い分野の範囲宣言
#
# What this table is: a declaration of the field's extent for a field the crate
# does not implement yet (musculoskeletal mechanics, locomotion, soft tissue,
# bone, blood flow, the heart, cells and molecules, impact injury). It lists
# every capability that the standard texts (Fung, Biomechanics: Mechanical
# Properties of Living Tissues and Biomechanics: Circulation; Zajac 1989 on
# Hill-type muscle; Winter, Biomechanics and Motor Control of Human Movement;
# Humphrey, Cardiovascular Solid Mechanics; Keener-Sneyd, Mathematical
# Physiology; Boal, Mechanics of the Cell), reference implementations (OpenSim,
# FEBio, AnyBody, SimVascular) and standard benchmarks (Hill's force-velocity
# relation, isometric twitch and tetanus, the Windkessel pressure waveform,
# energy recovery of inverted-pendulum walking, the head injury criterion, the
# Hodgkin-Huxley action potential, the Womersley profile) expect of a
# biomechanics code, one [[item]] per capability. Nearly every row is missing:
# the table fixes the scope before biological laws are moved into this crate
# from another crate, so that each law has a place decided in advance. The rows
# are written by hand: the axes and the items come from the reference frame,
# not from the modules that exist.
#
# The few rows that are not missing are compositions of existing parts with
# physiological inputs (blood viscosity through the Carreau law, hovering power
# through actuator-disk momentum theory, a long bone as a hollow circular beam,
# soft tissue fitted with an isotropic rubber-like law); they are
# implemented-no-oracle because no test checks them against biological data.
#
# Boundary with the other tables (one capability goes in one table only):
#   - rigid multibody articulation, ragdolls, character controllers, joint
#     motors and robot inverse dynamics: the rigid-body and multibody tables
#     (COV-RIGID-030 joint motors, 032 joint reaction output, 042 recursive
#     Newton-Euler, 111 / 115 pendulums; COV-MBD-093 anthropometric segment
#     masses, 094 / 097 ragdoll joints and tree, 096 segment inertia from radii
#     of gyration, 100 powered ragdoll, 075-078 inverse kinematics, 111 the
#     locomotion state machine, 117 rotor momentum theory). Here the biological
#     models on top of them: muscle and tendon laws, muscle-driven dynamics,
#     gait analysis, the mechanics of animal locomotion.
#   - numerical flow solvers: the CFD table (COV-CFD-097 plane Poiseuille,
#     108 Womersley channel flow, 110 Hagen-Poiseuille duct, 063 generalised-
#     Newtonian viscosity in the momentum equation, 066 species transport).
#     Here the closed-form and lumped models of the circulation (Poiseuille
#     resistance, Womersley number and profile, Windkessel, pulse wave speed,
#     1-D network models as a model class) and blood as a material.
#   - finite-element solution of hyperelastic and viscoelastic solids: the FEM
#     table (COV-FEM-027-030 isotropic hyperelastic laws, 042 Prony
#     viscoelasticity, 025 / 026 anisotropic elasticity). Here the constitutive
#     laws of living tissue (Fung, Holzapfel-Gasser-Ogden, QLV, biphasic,
#     growth and remodelling) and their tissue-level tests.
#   - closed-form strength of materials (beams, pressure vessels, creep): the
#     structures table (COV-STRUCT-009 beams, 030 thin-walled vessels, 064
#     Findley creep). Here their use for bone and vessels.
#   - material data (parameter sets of tissues, fluids and bone): the
#     materials table. Here only the laws that consume them.
#   - fluid-structure interaction as a coupled solve: the coupling table.
#   - heat conduction solvers: the thermal table; the Pennes bioheat source
#     term is a row here.
#   - generic ODE integrators (needed by the excitable-cell models): the
#     numerical-methods table (COV-NUM-045 / 049 / 051).
#   - neural-network or learned controllers that output joint torques
#     (src/neural.rs): the deterministic inference is COV-ENGINE-127, the
#     control law belongs to the sensing and control table.
#   - crowd dynamics of pedestrians: the particle table (social force).
#
# Search notes: the words "Hill" (src/laminate_failure.rs Tsai-Hill failure,
# "downhill" in the character controllers), "bone" (animation skeleton bones),
# "vessel" (ships), "Froude" (Froude-Krylov wave force), "growth" (error and
# wave growth), "oscillator" (wake oscillator, piezo harvester) and
# "swimming" (a character state) match other meanings only; rows below that
# say "src 0 件" were checked word by word.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`).
#
# keys: id (COV-BIO-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs:line`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Ids of other tables cited
# in `evidence` (COV-RIGID-*, COV-MBD-*, COV-CFD-*, COV-FEM-*, COV-STRUCT-*,
# COV-NUM-*, COV-PART-*, COV-THERM-*, COV-ENV-*, COV-SOFT-*,
# COV-ENGINE-*) are those of the tables as
# written at the time of this table.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).


