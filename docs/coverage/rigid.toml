# Rigid-body, constraint and contact coverage of ALICE-Physics, against an
# external reference frame.
#
# What this table is: every capability that the standard texts (Featherstone,
# Rigid Body Dynamics Algorithms; Erleben et al., Physics-Based Animation;
# Ericson, Real-Time Collision Detection), reference engines (Bullet, PhysX,
# MuJoCo, Box2D, Rapier) and standard benchmarks expect of a rigid-body engine,
# one [[item]] per capability, with what the crate has today. The rows are
# written by hand: the axes and the items come from the reference frame, not
# from the modules that exist, so a missing capability is visible instead of
# absent.
#
# Boundary with the other tables (one capability lives in one table only):
#   - vehicles, ragdolls and character controllers belong to the multibody (MBD)
#     table; the joints and the articulated-body solver they are built from are
#     here
#   - cloth, ropes and soft bodies belong to the SOFT table; a rope between two
#     rigid bodies as a single unilateral constraint is here
#   - generating collision shapes from an SDF (meshing, convex decomposition)
#     and colliding against an SDF are here; the SDF numerics themselves are not
#   - closed-form contact mechanics (Hertz stress, fatigue) is not a rigid-body
#     solver capability and is marked out-of-scope
# Functions that exist but are not called by the world step say so in
# `evidence`.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test
#                          checks it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a rigid-body capability (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-RIGID-NNN) / axis / item / source (book, chapter, paper or
# reference-engine feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`). "(推測)" marks a row
# whose status rests on a search that may have missed a synonym.
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

