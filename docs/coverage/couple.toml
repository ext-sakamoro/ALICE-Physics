# Multiphysics coupling (COUPLE) coverage of ALICE-Physics, against an external
# reference frame.
#
# What this table is: every capability that the standard texts (Hou-Wang-Layton
# 2012 FSI review; Bisplinghoff-Ashley-Halfman, Aeroelasticity; Dowell, A Modern
# Course in Aeroelasticity; Nowacki, Thermoelasticity; IEEE Std 176
# piezoelectricity), reference implementations (preCICE coupling schemes,
# acceleration and mapping; MOOSE MultiApp / Transfers; OpenFOAM solids4Foam;
# the FMI 2.0 standard) and standard benchmarks (Turek-Hron FSI1-3, two-degree-
# of-freedom airfoil flutter, cylinder VIV lock-in, Danilovskaya thermal shock,
# piezoelectric cantilever harvester, added-mass piston) expect of a code that
# couples physics, one [[item]] per capability, with what the crate has today.
# The rows are written by hand: the axes and the items come from the reference
# frame, not from the modules that exist, so a missing capability is visible
# instead of absent. A row here is a combination of physics (who reads what from
# whom, and how the combined problem is solved); each single physics is counted
# in its own table.
#
# Boundary with the other tables (one capability goes in one table only):
#   - generic coupling numerics (the sub-iteration driver and its divergence /
#     wrap detection, constant / Aitken relaxation, IQN-ILS, monolithic Newton,
#     JFNK, Krylov, block equilibration, sample / splat transfer on a grid, the
#     added-mass piston as a numerical benchmark): num.toml (COV-NUM-059 to 065,
#     078, 079, 090, 091). Rows here cite those ids where a coupling would use
#     them.
#   - the thermal side of thermo-mechanical coupling (which temperature reaches
#     the mechanics, heat from plastic work, the two-way thermoplastic fixed
#     point, reconciling two temperature owners, Joule and thermoelastic heat
#     sources, conjugate heat transfer): therm.toml (COV-THERM-041, 042, 046,
#     058, 083 to 088). The mechanical side (FE thermal eigenstrain,
#     temperature-dependent FE material): fem.toml (COV-FEM-045, 096, 097).
#     Closed-form thermal stress (E alpha dT): struct.toml (COV-STRUCT-128).
#   - single-phase flow and the force integral on a body from a resolved flow:
#     cfd.toml (COV-CFD-094); dispersed particles one- or two-way coupled to a
#     flow (Euler-Lagrange): multiphase.toml (COV-MULTIPHASE-067, 068);
#     multiphase interfaces: multiphase.toml.
#   - aerodynamic forces evaluated on cloth and rope themselves (wind zone,
#     triangle drag) and rod-body attachment: soft.toml.
#   - vibro-acoustic coupling: acous.toml (COV-ACOUS-074). Vehicle aerodynamics
#     and DC motor models: mbd.toml.
#   - the electromagnetic field solvers themselves: the electromagnetics table.
#     The force they exert on bodies (Lorentz, Maxwell stress), piezoelectricity,
#     electrostatic actuation and magnetostriction are here.
#   - rigid bodies acted on by a fluid (buoyancy, Froude-Krylov, lift and drag of
#     a lifting surface, Morison) are here; the rigid-body dynamics is rigid.toml.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-COUPLE-NNN) / axis / item / source (book, chapter, paper,
# standard or reference-implementation feature; no quoted text) / status /
# evidence (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate /
# limitation (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

