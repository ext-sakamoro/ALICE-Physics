# Nonlinear dynamics, chaos and complex systems (NONLIN) coverage of
# ALICE-Physics, against an external reference frame.
#
# What this table is: every capability that the standard texts (Strogatz,
# Nonlinear Dynamics and Chaos; Ott, Chaos in Dynamical Systems; Kuznetsov,
# Elements of Applied Bifurcation Theory; Cross-Greenside, Pattern Formation
# and Dynamics in Nonequilibrium Systems), reference implementations (the
# feature lists of AUTO / MatCont and DynamicalSystems.jl) and standard
# benchmarks (the largest Lyapunov exponent of the Lorenz system, the
# Feigenbaum constants of the logistic map, the critical coupling of the
# Kuramoto model, the KdV two-soliton collision) expect of a simulator of
# nonlinear dynamics, one [[item]] per capability, with what the crate has
# today. The rows are written by hand: the axes and the items come from the
# reference frame, not from the modules that exist, so a missing capability is
# visible instead of absent.
#
# Axes: ode-system / map / lyapunov / section / bifurcation / hamiltonian /
# cellular-automaton / pattern / synchronisation / soliton / determinism /
# benchmark.
#
# What counts as implemented: an API that performs the capability. Most model
# rows need a general ODE integrator with a caller-supplied right-hand side,
# which the numerical-foundations table has as missing (COV-NUM-045 / 049 /
# 050); those rows say so. A solver of another field that integrates the same
# equation is counted (the wake oscillator of vortex-induced vibration with its
# coupling set to zero is the Van der Pol oscillator); a solver of a different
# equation is not.
#
# The determinism axis is what this crate adds to the field: the same initial
# state gives the same bits over horizons much longer than the Lyapunov time,
# and a perturbation of one unit in the last place (2^-64, absolute, in Q64.64)
# grows at the rate of the largest Lyapunov exponent, so the time at which two
# runs part is ln(Delta / 2^-64) / lambda (about 44.4 / lambda for Delta = 1).
#
# Boundary with the other tables (one capability goes in one table only; rows
# of the same grain are not made here, the id is cited instead, and a row that
# refines one of them says "COV-X-NNN の子" at the head of `evidence`):
#   - integrators and solvers as such (ODE, symplectic, Newton, continuation,
#     eigenvalues, FFT): the numerical-foundations table (COV-NUM-029, 036,
#     044 to 050, 088, 089, 093); here their use on dynamical systems
#   - long-time stability of orbits, the symplectic N-body integrator and the
#     restricted three-body problem: the orbit table (COV-ORBIT-034, 035, 038,
#     039, 063, 103)
#   - the rigid world's bit-exact stepping and snapshot / branching, and its
#     thread-count independence: the rigid and engine tables (COV-RIGID-014,
#     COV-ENGINE-005, 012); here their use on chaotic trajectories
#   - reaction-diffusion chemistry: the chemistry table (COV-CHEM-082); phase
#     field as an interface method: the multiphase table (COV-MULTIPHASE-021 /
#     022); Rayleigh-Benard convection: COV-CFD-106 / COV-ATMOS-076; nonlinear
#     water waves: COV-ENV-083; ion-acoustic solitons: COV-PLASMA-077; the
#     cellular-automaton floor field of crowds: COV-PART-100; central pattern
#     generators of locomotion: COV-BIO-034; the vortex-induced vibration model
#     as a coupled problem: COV-COUPLE-020 to 022
#   - derivatives of the world step (state Jacobians, tangent models for
#     optimisation): the optimisation table (COV-OPT-014, 016, 120)
#   - statistical mechanics (lattice models, Monte Carlo, Langevin dynamics):
#     the statistical-mechanics table (COV-STAT-*)
#
# Search notes (word collisions found while judging): automat ->
# automatically; pattern -> toolpath / infill / scan patterns; synchron ->
# network and thread synchronisation; symplectic -> the N-body, molecular
# dynamics and rigid-body integrator docs; bifurcation -> the scope of the
# vortex-induced vibration module; continuation -> the load path of FE
# increments; return map -> return mapping of plasticity; Van der Pol -> the
# wake oscillator. No hit for lyapunov, poincare, chaos, lorenz (only
# lorentz_berthelot of pair potentials), rossler, henon, logistic map,
# kuramoto, soliton, cellular, duffing, floquet, hopf.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this crate (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-NONLIN-NNN) / axis / item / source (book, topic, standard or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate /
# limitation (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).


