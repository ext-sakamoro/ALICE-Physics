# Optics coverage of ALICE-Physics, against an external reference frame.
#
# What this table is: a declaration of the field's extent for a field the crate
# does not implement yet. It lists every capability that the standard texts
# (Hecht, Optics; Born-Wolf, Principles of Optics; Saleh-Teich, Fundamentals of
# Photonics; Pharr-Jakob-Humphreys, Physically Based Rendering; Chandrasekhar,
# Radiative Transfer), reference implementations (Zemax OpticStudio, Code V,
# LightTools, Mitsuba, PBRT) and standard benchmarks (Snell refraction and the
# critical angle, the Brewster angle, the thin lens equation, Newton's rings,
# single-slit diffraction, Beer-Lambert decay, the white furnace test, the
# Rayleigh lambda^-4 law) expect of an optics code, one [[item]] per capability.
# Nearly every row is missing: the table fixes the scope before any optics
# module is written, so that a later move of optical laws into this crate can
# decide where each one goes. The rows are written by hand: the axes and the
# items come from the reference frame, not from the modules that exist.
#
# Optics here means light models that do not solve Maxwell's equations on a grid
# or mesh: geometric optics, closed-form wave optics, scattering in closed form,
# radiative transfer of radiance, surface optical properties and light-matter
# interaction. Rendering itself (GPU shaders, SDF drawing) belongs to the
# rendering crate outside this repository; it is not counted, and rendering
# rows here are about the physical model of light only.
#
# Boundary with the other tables (one capability goes in one table only):
#   - numerical solution of Maxwell's equations (FDTD, FEM, MoM), including the
#     numerical Fresnel reflection, dielectric slab, Mie sphere and physical
#     optics rows: the electromagnetics table. Closed forms of the same physics
#     are rows here and cite the electromagnetics ids in `evidence`.
#   - heat transfer by thermal radiation (blackbody emission, emissivity, view
#     factors, radiosity exchange, radiative heat flux in the energy equation
#     through P1 / discrete ordinates, gas band models): the thermal table.
#     Here the transport of radiance itself (beam attenuation, phase functions,
#     single and multiple scattering, Monte Carlo light transport); a row that
#     uses a thermal-table capability cites its id instead of repeating it.
#   - intersection of rays with collision geometry (raycast, shape cast): the
#     rigid-body table. Here only what light does at the hit (reflection,
#     refraction, transport).
#   - the geometry of a scanning range sensor: the sensing table. Its
#     radiometric return model is a row here.
#   - ray tracing of sound: the acoustics table.
#   - forces of light on bodies as a coupled problem: the coupling table; the
#     closed-form radiation pressure law is a row here.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`).
#
# keys: id (COV-OPTICS-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs:line`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Ids of other tables cited
# in `evidence` (COV-EM-*, COV-THERM-*, COV-RIGID-*) are those of the tables as
# written at the time of this table.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

