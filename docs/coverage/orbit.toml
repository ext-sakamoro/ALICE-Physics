# Orbital mechanics and celestial dynamics (ORBIT) coverage of ALICE-Physics,
# against an external reference frame.
#
# What this table is: every capability that the standard textbooks (Vallado,
# Fundamentals of Astrodynamics and Applications; Curtis, Orbital Mechanics for
# Engineering Students; Murray-Dermott, Solar System Dynamics; Battin, An
# Introduction to the Mathematics and Methods of Astrodynamics), reference
# implementations (REBOUND integrators and tools, GMAT and Orekit force models,
# propagators and frames) and standard benchmarks (Kepler orbit closure,
# figure-eight and Pythagorean three-body problems, J2 nodal precession,
# Trojan libration about L4, Hohmann delta-v) expect of a code for the
# two-body problem, N-body gravity, perturbations, the restricted three-body
# problem and the motion of spacecraft, one [[item]] per capability, with what
# the crate has today. The rows are written by hand: the axes and the items come
# from the reference frame, not from the modules that exist, so a missing
# capability is visible instead of absent.
#
# Boundary with the other tables (one capability goes in one table only):
#   - the atmosphere itself (density, temperature, wind): the environment table;
#     here only drag on an orbit as a perturbation (COV-ORBIT-052)
#   - numerical integration of free rigid-body rotation (gyroscopic term,
#     quaternion integration): the rigid-body table; here only attitude as a
#     spacecraft function (gravity-gradient torque, actuators, parameter sets)
#   - general relativity itself: the relativity table; here only the
#     relativistic correction as an orbit perturbation (COV-ORBIT-055, COV-ORBIT-104)
#   - generic ODE integrators, generic Verlet and generic root finding: the
#     numerical-foundation table (COV-NUM-045, 047, 037); the leapfrog of the
#     gravitational N-body law and the Newton iteration of Kepler's equation
#     are counted here as field capabilities
#   - tree codes and fast multipole methods for long-range sums: the particle
#     table (COV-PART-029); not repeated here
#   - attitude determination and control (estimation, sensors): the sensing and
#     control table
#
# Astrophysics axis (second wave, low priority for the crate's uses): collisionless
# N-body, cosmology, stellar structure and accretion discs. Every row is missing.
# The tree code and fast multipole sums stay in the particle table (COV-PART-029);
# the direct softened sum and leapfrog rows above (COV-ORBIT-027, 028, 034) are
# what a small-N benchmark would run on. Fix128 keeps 64 integer bits (up to
# 2^63, about 9.2e18), so astronomical quantities in SI units are out of range:
# the Sun's GM (about 1.327e20 m^3/s^2), one astronomical unit squared (about
# 2.2e22 m^2), the solar mass (about 2.0e30 kg), one megaparsec (about 3.1e22 m)
# (values to be checked against the source). The same limit is why the
# geomagnetic dipole is missing in the geophysics table. These rows assume
# dimensionless (N-body or Hubble) units; the rows say where that matters.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-ORBIT-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Book chapter numbers
# have not been checked against the editions.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

