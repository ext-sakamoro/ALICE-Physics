# Atmosphere, ocean and environment (ENV) coverage of ALICE-Physics, against an
# external reference frame.
#
# What this table is: every capability that the standard references for the
# physical environment of a simulation expect, one [[item]] per capability, with
# what the crate has today. The reference frame: the U.S. Standard Atmosphere
# 1976 / ISO 2533; Stull, An Introduction to Boundary Layer Meteorology; Holton,
# An Introduction to Dynamic Meteorology; MIL-F-8785C and MIL-HDBK-1797 (gust and
# turbulence models); EN 1991-1-3 / 1991-1-4 and ASCE 7 (snow and wind actions);
# Dean-Dalrymple, Water Wave Mechanics; DNV-RP-C205 and Goda, Random Seas (sea
# states); Tessendorf, Simulating Ocean Water; the wind, water and terrain tools
# of Houdini and Unreal; the feature lists of WRF and SWAN; and standard
# benchmarks (ISA table values and the 11 km tropopause, the log-law wind
# profile, deep-water dispersion, Stokes second-order crest height, the JONSWAP
# significant wave height). The axes and items come from that frame, not from
# the modules that exist. The rows are written by hand.
#
# Here: the environment fields (atmosphere state, wind, gusts and turbulence,
# precipitation, sea surface, terrain) and the closed-form environmental laws and
# loads. A capability whose physics is solved elsewhere is not repeated:
#   - Navier-Stokes solvers, wall functions and Boussinesq buoyancy in a flow:
#     the CFD table (the log law of the CFD wall model is cited, not counted)
#   - floating bodies and fluid loads on bodies: the coupling table
#     (buoyancy zone COV-COUPLE-066 to 068, Froude-Krylov COV-COUPLE-069, heave and
#     pitch response COV-COUPLE-070, Morison COV-COUPLE-072, the lifting-surface
#     force on a rigid body COV-COUPLE-073, vortex-induced vibration
#     COV-COUPLE-020); the aerodynamics axis here splits COV-COUPLE-073 into the
#     individual laws
#   - speed of sound with altitude: one implementation with the acoustics table
#     (COV-ACOUS-013 is the acoustic row; the atmosphere rows here count it as
#     part of the standard atmosphere, there is no separate row)
#   - drag at orbital altitude and tides: the orbit table (COV-ORBIT-052,
#     COV-ORBIT-056); the spherical-planet ground and its gravity: COV-ORBIT-088
#     to 091
#   - material removal by erosion, hydraulic erosion with sediment and talus
#     relaxation: the fracture table (COV-FRACT-084 to 092); terrain here is the
#     height field, its analysis and the landscape processes not listed there
#   - wind on cloth and hair particles: the soft-body table (COV-SOFT-072, 073);
#     vehicle aerodynamics with wind and weather-dependent road grip: the
#     multibody table (COV-MBD-044, 046, 047); rotors:
#     COV-MBD-115 to 132; collision with a height field: COV-RIGID-066
#   - the constant "wind" force field (ForceField::Directional) is a force, not a
#     wind velocity, and is not counted
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented (or composed from existing parts), no such
#                          test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-ENV-NNN) / axis / item / source (book, chapter, standard or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs:line`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Chapter and section
# numbers of the sources have not been checked against the originals.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

