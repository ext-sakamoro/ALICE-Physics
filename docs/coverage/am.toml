# Additive-manufacturing process physics (AM) coverage of ALICE-Physics, against
# an external reference frame.
#
# What this table is: every capability that the standard textbook
# (Gibson-Rosen-Stucker, Additive Manufacturing Technologies), the FDM process
# reviews (Turner-Strong-Gold 2014, Turner-Gold 2015), the classic process
# models (Jacobs 1992 working curve, Rosenthal 1946 moving heat source),
# reference implementations (Ultimaker Cura, PrusaSlicer, Simufact Additive,
# Ansys Additive feature lists) and standard benchmarks (warp cantilever, bridge
# length, overhang angle, interlayer tensile strength against build angle, resin
# working curve, NIST AM-Bench, NIST test artifact) expect of a code that
# predicts how a part behaves while and because it is printed, one [[item]] per
# capability, with what the crate has today. The rows are written by hand: the
# axes and the items come from the reference frame, not from the modules that
# exist, so a missing capability is visible instead of absent.
#
# Boundary with the other tables (one capability goes in one table only):
#   - heat conduction solvers, boundary conditions and the moving heat source as
#     a solver: the heat-transfer table. Here only how a print process uses
#     them (bead cooling, interlayer history, bed temperature, melt pool).
#   - closed-form structural results (beam deflection, constrained thermal
#     stress, bilayer mismatch stress, fillet stress concentration, plate
#     resonance of a thin printed wall): the structural table. The print
#     pipeline calls them; they are cited, not counted.
#   - finite-element thermo-elasticity (thermal eigenstrain) and orthotropic FE:
#     the FEM table (COV-FEM-096 / COV-FEM-025), cited where a process row
#     would need it.
#   - material constitutive models and property data (filament presets,
#     orthotropic constants as material models, failure criteria such as Hill
#     and Tsai-Wu): the materials table. Here only how a print process uses the
#     data (build-direction derating, shrinkage in warp, bridging limits).
#   - non-Newtonian flow as a fluid model: the fluid table; the nozzle pressure
#     drop of a melt is here.
#   - layer adhesion, thin-wall detection and warp risk are counted here (the
#     structural table names them as process effects).
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented (a source statement that a
#                          capability is absent is quoted in `evidence`)
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-AM-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

