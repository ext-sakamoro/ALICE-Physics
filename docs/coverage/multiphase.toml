# Multiphase and free-surface flow coverage of ALICE-Physics, against an
# external reference frame.
#
# What this table is: every capability that the standard texts (Tryggvason-
# Scardovelli-Zaleski, Direct Numerical Simulations of Gas-Liquid Multiphase
# Flows; Osher-Fedkiw, Level Set Methods; Bridson, Fluid Simulation for Computer
# Graphics; Brackbill-Kothe-Zemach 1992 CSF), reference implementations (OpenFOAM
# interFoam / interPhaseChangeFoam / multiphaseEulerFoam) and standard benchmarks
# (Zalesak disk, static drop and spurious currents, Rayleigh-Taylor growth rate,
# Martin-Moyce dam break, Hysing rising bubble, capillary-wave dispersion) expect
# of a multiphase / free-surface flow code, one [[item]] per capability, with what
# the crate has today. The rows are written by hand: the axes and the items come
# from the reference frame, not from the modules that exist, so a missing
# capability is visible instead of absent. Closed-form modules (non_newtonian,
# smoke_fire, buoyancy_zone, wave_ship) are not counted as flow capabilities;
# they are cited in `evidence` where they are the nearest thing.
#
# Boundary with the other tables (one capability goes in one table only):
#   - single-phase incompressible flow, the SPH / PBF / FLIP single-phase
#     machinery (kernels, density, equation of state, particle-grid transfer)
#     and the generalised-Newtonian / viscoelastic viscosity of a single-phase
#     momentum equation: the CFD table (this table has the free surface, the
#     interface and the phase-wise properties)
#   - latent heat, the Stefan problem and the enthalpy method: the thermal
#     table (this table has only the flow conditions at the interface)
#   - combustion chemistry (Arrhenius rates, species): the chemistry table
#     (this table has only the flow driven by combustion)
#   - non-Newtonian constitutive laws themselves: the material table (this
#     table has only their use in a multiphase flow)
#   - floating bodies, buoyancy on rigid bodies and fluid-structure coupling:
#     the coupling / rigid tables; ocean wave spectra: the environment table
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-MULTIPHASE-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

