# Numerical-infrastructure coverage of ALICE-Physics, against an external reference frame.
#
# What this table is: every general-purpose numerical building block that the
# standard references expect (Saad, Iterative Methods for Sparse Linear Systems;
# Hairer-Norsett-Wanner / Hairer-Wanner, Solving ODEs I/II; Hairer-Lubich-Wanner,
# Geometric Numerical Integration; Knoll-Keyes, JFNK survey (J. Comput. Phys. 2004);
# PETSc KSP / PC / SNES / TS / EPS-like eigen solvers; SUNDIALS CVODE / ARKODE /
# IDA / KINSOL; MOOSE Executioner / MultiApp; preCICE coupling schemes), one
# [[item]] per capability, with what the crate has today. The axes and the items
# come from that frame, not from the modules that exist.
#
# Scope and boundary with the other tables:
#   * A row here is about a reusable component: an API that takes the caller's
#     operator, residual, right-hand side or sweep. The same formula embedded in
#     one field's module (the private conjugate gradients of the FEM modules, the
#     FEM Newton / Newton-Krylov / Newmark, the MAC-grid pressure multigrid and
#     its slab decomposition, the per-module Verlet / symplectic Euler steps) is
#     cited in `evidence` but not counted: such a row stays `missing` here and
#     the field's table owns the embedded use.
#   * Rows that sit next to a solid-FE row of docs/coverage/fem.toml name that
#     row's id (COV-FEM-NNN) in `evidence`. The FE row judges the capability for
#     solids; the row here judges the general component. No capability is
#     counted in both tables.
#   * Closed-form results (e.g. the 3x3 polar decomposition, the 3x3 symmetric
#     eigen-decomposition of an inertia tensor) are small dense kernels of the
#     math layer and are counted here.
#   * Transforms (FFT), Monte Carlo estimators, matrix functions (exp(A),
#     CRAM), tridiagonal / dense symmetric eigensolvers and block-structured
#     mesh refinement are general components counted here; the field tables
#     (acoustics, CFD, quantum, nuclear, plasma, relativity) keep their uses.
#     Only a general component a caller can hand its inputs to is counted;
#     a combination of existing parts (e.g. the deterministic random number
#     generator plus a running mean / variance) is cited in the evidence of a
#     missing row.
#
# Search notes: "fft" / "dft" match the deformation-gradient variable names in
# src/linear_elastic_fem/consistent_tangent.rs; "Fourier" matches the replay
# compression description of an external crate; "Pade" matches the tanh
# approximation in src/neural.rs; "bisection" matches scalar root finding
# (Kepler, wall friction velocity, height-field probe); "tridiagonal" matches
# the Thomas linear solve; "refine" matches the tetrahedral longest-edge
# bisection of the FE mesher; "eigen" matches the thermal eigenstrain of the
# FE solver. None of these is the capability of the row it was searched for.
#
# status (exactly one of):
#   implemented+oracle     a general component exists, and at least one
#                          non-ignored test checks it against an independent
#                          reference (closed form, f64 elimination, another
#                          solver, or a pinned bit pattern)
#   implemented-no-oracle  a general component exists, no such test
#   partial                a general component exists with a restriction that the
#                          source states; `limitation` quotes it, and the source
#                          carries a `LIMITATION(<id>)` comment at that place
#   missing                no general component (a field-embedded one may exist,
#                          see `evidence`)
#   out-of-scope           not applicable to this crate (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`.
#
# keys: id (COV-NUM-NNN) / axis / item / source (book, chapter, or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Chapter numbers are given from the table of contents and are not checked
# against the original. Reference values marked "参照値要確認" are to be checked
# against the original publication before any test uses them. "(推測)" in
# `evidence` marks a judgement based on a search with synonyms that found
# nothing, not on reading every module.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

