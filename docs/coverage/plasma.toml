# Plasma physics and magnetohydrodynamics (PLASMA) coverage of ALICE-Physics,
# against an external reference frame.
# 実装が無い分野の範囲宣言
#
# What this table is: a declaration of the field's extent for a field the crate
# does not implement yet (collections of charged particles, kinetic and fluid
# plasma models, magnetohydrodynamics, plasma equilibrium and stability, and the
# plasmas of fusion, space and industry). It lists every capability that the
# standard texts (Chen, Introduction to Plasma Physics and Controlled Fusion;
# Birdsall-Langdon, Plasma Physics via Computer Simulation; Goedbloed-Poedts,
# Principles of Magnetohydrodynamics), reference implementations (Athena++,
# PLUTO, WarpX, OSIRIS) and standard benchmarks (two-stream instability growth,
# Landau damping, the Orszag-Tang vortex, the Brio-Wu shock tube, Alfven wave
# propagation, the cyclotron period) expect of a plasma code, one [[item]] per
# capability. Nearly every row is missing: the table fixes the scope before
# plasma models are added, so that each law has a place decided in advance. The
# rows are written by hand: the axes and the items come from the reference
# frame, not from the modules that exist.
#
# The few rows that are not missing are compositions of existing parts with
# plasma inputs (a Yukawa one-component plasma through the screened Coulomb
# pair potential and the periodic velocity-Verlet integrator; a charged body
# gyrating or drifting in a uniform field through the Lorentz force applied to
# a rigid body of the world); they are implemented-no-oracle because no test
# checks the composed path against a plasma reference.
#
# Boundary with the other tables (one capability goes in one table only):
#   - Maxwell field solvers (the Yee FDTD update with a current source, charge
#     continuity, divergence diagnostics), the single-particle pusher (Boris,
#     relativistic pushers, guiding-centre integration), field interpolation
#     from the Yee lattice to particles, charge-conserving current deposition,
#     closed-form fields of charges and dipoles, Drude / Debye / gyrotropic
#     dispersive media: the electromagnetics table (COV-EM-010, 064 to 066,
#     071, 078 to 082, 090; 044, 045, 049). Here the plasma models built on
#     them: the particle-in-cell cycle, electrostatic charge assignment and
#     field gather, collisions, kinetic and fluid models, and the closed-form
#     orbit theory (drift velocities, mirror, adiabatic invariants).
#   - forces of fields on bodies and the Lorentz body force added to an
#     incompressible flow solver (low magnetic Reynolds number MHD, Hartmann
#     flow): the coupling table (COV-COUPLE-047 to 050, 052, 098). Here MHD as
#     a plasma model: the ideal / resistive / Hall MHD systems of conservation
#     laws, their waves, their numerics (the divergence constraint on B, MHD
#     Riemann solvers) and their benchmarks.
#   - the numerical methods of compressible gas dynamics (exact and approximate
#     Riemann solvers, reconstruction, limiters for the Euler equations): the
#     shock and compressible-flow table (no table yet). Here only the
#     MHD-specific solvers.
#   - pair potentials between charges and the molecular-dynamics integrator
#     (Coulomb, Yukawa, Ewald, PPPM, velocity Verlet, cell lists, thermostats,
#     g(r)): the particle table (COV-PART-003, 004, 026, 027, 030, 038 to 046,
#     050, 055, 102). Here the strongly coupled plasma as a use of them.
#   - the FLIP / PIC transfer of an incompressible fluid (src/eulerian_grid.rs):
#     the CFD table (COV-CFD-091); it moves velocity, not charge.
#   - gravity of celestial bodies, orbits and thrust trajectories: the orbit
#     table (COV-ORBIT-069, 070 low-thrust transfer, 075 disturbance torques).
#     Here the plasma physics of thrusters and of space environments.
#   - generic linear solvers, Poisson multigrid and ODE integrators: the
#     numerical-methods table (COV-NUM-047, 086).
#   - electrochemistry and combustion chemistry: the chemistry table
#     (COV-CHEM-085).
#
# Search notes: the words "ion" (the ending of every "-ion" word: position,
# rotation, function, million), "gyro" (the gyroscope of src/sensors.rs and
# gyroscopic terms), "Debye" (Debye dispersive media in the scope note of
# src/maxwell_fdtd.rs and the Debye-Hueckel form of the Yukawa potential),
# "PIC" / "Particle-In-Cell" (the FLIP / PIC fluid transfer of
# src/eulerian_grid.rs), "Lorentz" (the Lorentz force, the Lorentz-Berthelot
# mixing rule, Lorentz dispersive media), "hall" (shallow), "pinch"
# (src/collision_mesh_gen.rs), "kink" (src/laminate_failure.rs), "confinement"
# (vorticity confinement in src/fluid.rs), "reconnect" (src/dynamic_bvh.rs),
# "fusion" (diffusion), "induction" (the induction-motor toy named in
# src/electromagnetic.rs), "Boltzmann" (the k_B of the molecular-dynamics
# temperature) and "drift" / "mirror" / "beta" (energy drift, mirrored
# boundaries, Newmark and Rayleigh coefficients) match other meanings only;
# rows below that say "src 0 件" were checked word by word.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`).
#
# keys: id (COV-PLASMA-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Ids of other tables cited
# in `evidence` (COV-EM-*, COV-COUPLE-*, COV-PART-*, COV-CFD-*, COV-NUM-*,
# COV-ORBIT-*, COV-CHEM-*) are those of the tables as written at the time of
# this table.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).


