# Heat transfer and phase change coverage of ALICE-Physics, against an external
# reference frame.
#
# What this table is: every capability that the standard textbooks
# (Incropera-DeWitt, Fundamentals of Heat and Mass Transfer; Carslaw-Jaeger,
# Conduction of Heat in Solids; Modest, Radiative Heat Transfer; Crank, Free and
# Moving Boundary Problems), reference implementations (Abaqus heat transfer,
# COMSOL Heat Transfer Module) and standard benchmarks (semi-infinite erfc
# solution, Fourier-series plane wall, one- and two-phase Stefan problems,
# lumped capacitance, parallel-plate radiation exchange, NAFEMS T1-T4) expect of
# a heat transfer code, one [[item]] per capability, with what the crate has
# today. The rows are written by hand: the axes and the items come from the
# reference frame, not from the modules that exist, so a missing capability is
# visible instead of absent.
#
# Implementations counted here: the engineering conduction solver
# (transient_thermal), the fixed-point coupling field (coupled_field), the
# thermal side of the thermo-mechanical coupling (linear_elastic_fem) and the
# grid of the SDF thermal / phase-change modifiers (thermal, phase_change,
# sim_field). Rows that rely on the SDF modifier grid say so in `evidence`; it
# is a separate line of implementation from transient_thermal and is not
# counted for the engineering-solver rows.
#
# Boundary with the other tables (one capability goes in one table only):
#   - temperature transport inside a fluid (advection, Boussinesq buoyancy,
#     conduction in the fluid, turbulent heat flux): cfd.toml. Conjugate
#     coupling between a solid and a fluid temperature is here.
#   - the mechanical side of thermal stress (thermal eigenstrain in FE,
#     temperature-dependent constitutive laws in FE): fem.toml; closed-form
#     thermal stress of bars, bilayers and plates: struct.toml. The thermal
#     side (which temperature reaches the mechanics, heat from plastic work) is
#     here.
#   - chemistry of combustion (Arrhenius rates): the chemistry table; flow-side
#     heat release and fire plumes: multiphase.toml. Only the receiving end
#     (a reaction heat source in the conduction solver) is here.
#   - interface flow of a phase change (Stefan flow, evaporation mass transfer,
#     boiling flow at a heated wall): multiphase.toml. Latent heat, the Stefan
#     problem, the enthalpy method and the boiling / condensation heat-transfer
#     correlations are here.
#   - thermal property data of materials (k, rho, c_p, emissivity values): the
#     materials table. The property models (constant / polynomial /
#     temperature-dependent evaluation) are here.
#   - cooling and warping of 3D-printed parts: the additive-manufacturing
#     table. The heat solvers those would use are here.
#   - general linear / time-integration components (tridiagonal solve, ODE
#     integrators, sub-iteration driver): num.toml.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source
#                          states; `limitation` quotes it, and the source carries
#                          a `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field, or nothing to apply
#                          it to (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-THERM-NNN) / axis / item / source (book, chapter, standard or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs:line`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Chapter numbers are not yet checked
# against a specific edition either.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

