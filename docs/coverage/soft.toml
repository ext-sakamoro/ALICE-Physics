# Cloth, soft-body and rod coverage of ALICE-Physics (real-time and
# physically based animation of deformable objects), against an external
# reference frame.
#
# What this table is: every capability that the standard texts (Bender et al.,
# Position-Based Simulation Methods in Computer Graphics; Müller et al. 2007
# Position Based Dynamics; Macklin et al. 2016 XPBD; Baraff-Witkin 1998; Bridson
# et al. 2002 cloth collisions; Bergou et al. 2008 Discrete Elastic Rods;
# Bouaziz et al. 2014 Projective Dynamics), reference implementations (NVIDIA
# Flex, PhysX cloth, Houdini Vellum) and standard benchmarks (hanging cloth,
# Cusick drape, crumpling, cantilever rod, catenary, Michell twisted ring, soft
# cube volume) expect of a deformable-object simulator, one [[item]] per
# capability, with what the crate has today. The rows are written by hand: the
# axes and the items come from the reference frame, not from the modules that
# exist, so a missing capability is visible instead of absent.
#
# Boundary with the other tables (one capability lives in one table only):
#   - a single rope joint between two rigid bodies (one unilateral constraint)
#     is the rigid table; rope particles attached to a body are here
#   - continuum solid FE (linear, hyperelastic, shells and membranes as finite
#     elements) and tetrahedral mesh generation are the solid FEM table; here
#     are the XPBD / position-based deformables
#   - fracture mechanics (energy release rate, crack growth) is the fracture
#     table; the geometric operation of cutting and tearing a mesh is here
#   - cloth-fluid and other cloth-flow coupling (cloth_fluid, fsi) are the
#     coupling table; aerodynamic forces evaluated on the cloth itself are here
#   - rigid-body sleeping, rigid contact and the 2D engine (physics2d) are the
#     rigid table
# Functions that exist but are not called by the step of a deformable, and
# module docs that name a capability without an implementation, say so in
# `evidence`.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test
#                          checks it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-SOFT-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`). "(推測)" marks a row
# whose status rests on a search that may have missed a synonym.
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

