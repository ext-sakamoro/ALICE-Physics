# Quantum mechanics coverage of ALICE-Physics, against an external reference
# frame.
#
# What this table is: a declaration of the field's extent for a field the crate
# does not implement (実装が無い分野の範囲宣言). It lists every capability that
# the standard texts (Griffiths, Introduction to Quantum Mechanics; Sakurai,
# Modern Quantum Mechanics; Tannor, Introduction to Quantum Mechanics: A
# Time-Dependent Perspective; Nielsen-Chuang, Quantum Computation and Quantum
# Information), the feature lists of reference implementations (QuTiP, Qiskit
# Aer, ITensor, PySCF) and standard benchmarks (harmonic oscillator levels
# (n + 1/2) hbar omega, the hydrogen Rydberg series, rectangular barrier
# transmission, Gaussian wave packet spreading, Rabi oscillation, two-level
# Lindblad relaxation T1 / T2) expect of a quantum mechanics code, one [[item]]
# per capability. Every row is missing: the crate has no complex number type,
# no wavefunction, no Hamiltonian operator and no general eigenvalue solver.
# The table fixes the scope before any quantum module is written, so that a
# later addition can decide where each capability goes. The rows are written by
# hand: the axes and the items come from the reference frame, not from the
# modules that exist. Classical counterparts that do exist (the Morse and
# Yukawa pair potentials, the harmonic mode of the molecular dynamics
# integrator, the magnetic dipole field, the seeded generator) are cited in
# `evidence` as the nearest thing; they are not counted as quantum
# capabilities.
#
# Scope: non-relativistic quantum mechanics of one particle (time-dependent and
# stationary solvers, closed-form systems, scattering), angular momentum and
# spin, approximation methods, open quantum systems, the entry to many-body
# methods, the physical side of quantum information (state-vector simulation,
# gates as time evolution, noise models), quantum statistics and semiclassical
# methods. Quantum chemistry beyond the Hartree-Fock / Kohn-Sham entry and
# quantum algorithms as computer science are not rows.
#
# Boundary with the other tables (one capability goes in one table only):
#   - general eigenvalue solvers, time integrators, Krylov methods and sparse
#     storage: the numerics table. A row here that needs one cites its id
#     (COV-NUM-*) in `evidence`. The numerics table has no FFT row; the
#     Fourier transform between position and momentum is a row here.
#   - thermal radiation as heat transfer (blackbody emission, emissivity,
#     radiation exchange): the thermal table (COV-THERM-059 onward); the
#     blackbody spectrum as a light source: the optics table (COV-OPTICS-081).
#     Here only the quantum origin of the spectrum (photon gas, mode counting,
#     Planck occupation).
#   - classical intermolecular potentials and classical molecular dynamics
#     (Lennard-Jones, Morse, Yukawa, thermostats): the particle table. Quantum
#     levels of the same potentials are rows here.
#   - relativistic quantum mechanics (Dirac equation, Klein-Gordon) and
#     relativistic corrections: the relativity side, which has no table yet;
#     not rows here.
#   - Maxwell's equations on a grid, photonic band structure and dispersive
#     media: the electromagnetics table. Electronic band structure is a row
#     here.
#   - the seeded random generator used for measurement sampling and quantum
#     trajectories: the engine table (COV-ENGINE-001 / 002).
#
# Search notes: the words "spin" (vehicle wheels, rotors, "spine" in the
# articulated bodies), "tunnel" (continuous collision detection, cloth
# tunnelling, a water tunnel), "harmonic" (harmonic means, the classical
# harmonic mode of the molecular dynamics integrator, the Morse harmonic force
# constant), "eigenvalue" (the thermo-plastic coupling Jacobian), "Arnoldi"
# (inside GMRES), "Crank-Nicolson" (the real-valued heat equation and a crank
# mechanism), "shooting" (overshooting), "ising" (English word endings such as
# localising), "complex" (a lint name and a journal title), "fft" / "dft"
# (matrix variable names), "Boltzmann" (the classical k_B argument), "Debye"
# (dispersive media and Debye-Hückel screening), "entropy" (privacy) and "mps"
# (substrings of other words) match other meanings only; rows below that say
# "src 0 件" were checked word by word.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`).
#
# keys: id (COV-QUANTUM-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs:line`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Textbook chapter numbers
# are given for orientation and have not been checked against each edition. Ids
# of other tables cited in `evidence` (COV-NUM-*, COV-PART-*, COV-THERM-*,
# COV-OPTICS-*, COV-EM-*, COV-ENGINE-*) are those of the tables as written at
# the time of this table.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).


