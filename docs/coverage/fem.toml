# Solid finite-element coverage of ALICE-Physics, against an external reference frame.
#
# What this table is: every capability that the standard textbooks (Bathe,
# Belytschko-Liu-Moran, Simo-Hughes, Zienkiewicz-Taylor, Wriggers), reference
# implementations (Abaqus, LS-DYNA, Code_Aster, MOOSE) and standard benchmarks
# expect of a solid FE code, one [[item]] per capability, with what the crate has
# today. The rows are written by hand: the axis and the items come from the
# reference frame, not from the modules that exist, so a missing capability is
# visible instead of absent. Closed-form modules (beam_stress, modal, buckling,
# ...) and other discretisations (cloth / deformable XPBD) are not counted as FE
# capabilities.
#
# status (exactly one of):
#   implemented+oracle     implemented in FE, and at least one non-ignored test
#                          checks it against an independent reference
#   implemented-no-oracle  implemented in FE, no such test
#   partial                implemented in FE with a restriction that the source
#                          states; `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented in FE
#   out-of-scope           not an FE capability, or nothing to apply it to (reason
#                          in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-FEM-NNN) / axis / item / source (book, chapter, standard or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

