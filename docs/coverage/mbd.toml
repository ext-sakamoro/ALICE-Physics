# Vehicle and robot multibody (MBD) coverage of ALICE-Physics, against an
# external reference frame.
#
# What this table is: every capability that the standard texts (Pacejka, Tire
# and Vehicle Dynamics; Gillespie, Fundamentals of Vehicle Dynamics;
# Featherstone, Rigid Body Dynamics Algorithms; Siciliano et al., Robotics:
# Modelling, Planning and Control; Shabana, Dynamics of Multibody Systems),
# reference tools (MuJoCo, Drake, Chrono::Vehicle, CarSim) and standard
# benchmarks (steady-state cornering and the understeer gradient, ISO 3888 lane
# change, ISO 7401 step steer, four-bar and slider-crank kinematics, Andrews'
# squeezing mechanism, PUMA 560 inverse dynamics, hover thrust balance) expect
# of vehicles, robots, ragdolls, characters and rotorcraft built from rigid
# bodies, one [[item]] per capability, with what the crate has today. The rows
# are written by hand: the axes and the items come from the reference frame,
# not from the modules that exist, so a missing capability is visible instead of
# absent.
#
# Boundary with the other tables (one capability lives in one table only):
#   - joints, joint motors (the PD law), gear / rack / pulley joints, closed
#     loops as a position constraint, the articulated-body algorithm, CRBA,
#     RNEA, Baumgarte position correction and the double pendulum belong to the
#     rigid-body table (COV-RIGID-*); rows here that depend on them cite the id
#   - aerodynamic laws (lift / drag coefficients, atmosphere) belong to the
#     environment table; the rotor thrust law and the vehicle's own drag / lift
#     use are here
#   - sensors, state estimation and learned or neural control laws belong to
#     the sensing table
#   - ropes, cloth and soft bodies belong to the SOFT table
#   - boats and buoyancy belong to the environment table
# A capability built from several existing parts without a test is
# `implemented-no-oracle`; a benchmark that can be assembled from existing
# functions but has no test is `missing` with the recipe in `evidence`.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-MBD-NNN) / axis / item / source (book, chapter, standard or
# reference-tool feature; no quoted text) / status / evidence
# (`src/...rs:line`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

