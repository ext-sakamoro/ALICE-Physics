# Manufacturing processes other than additive manufacturing (MFG) coverage of
# ALICE-Physics, against an external reference frame.
#
# What this table is: every capability that the standard references for casting,
# welding, injection moulding, metal forming and machining expect of a process
# simulation, one [[item]] per capability, with what the crate has today. The
# reference frame: Campbell, Complete Casting Handbook; Stefanescu, Science and
# Engineering of Casting Solidification; Kou, Welding Metallurgy; Radaj, Welding
# Residual Stresses and Distortion; Tadmor-Gogos, Principles of Polymer
# Processing; Marciniak-Duncan-Hu, Mechanics of Sheet Metal Forming;
# Hosford-Caddell, Metal Forming; Dieter, Mechanical Metallurgy; Shaw, Metal
# Cutting Principles; Altintas, Manufacturing Automation; Kalpakjian-Schmid,
# Manufacturing Engineering and Technology; the feature lists of MAGMASOFT,
# ProCAST, Moldflow, AutoForm and Simufact; and standard benchmarks (Rosenthal
# t8/5, centre-gated disc filling, Merchant forces, Taylor tool life, NUMISHEET).
# The axes and items come from that frame, not from the modules that exist. The
# rows are written by hand.
#
# Why a separate table and not an axis of the additive-manufacturing table: that
# table and its ids (COV-AM-NNN) are scoped to printing (orientation, supports,
# slicer, layer adhesion), and the processes here have their own references
# and benchmarks. The process physics the two share is cited, not repeated.
#
# Boundary with the other tables (one capability goes in one table only):
#   - heat solvers, the moving point / line heat source (Rosenthal,
#     COV-THERM-045), the solidification-time closed forms (Chvorinov,
#     COV-THERM-077), Joule and frictional heating (COV-THERM-042, 044) and
#     phase change: the heat-transfer table. Here only how a process uses them.
#   - free-surface flow and non-Newtonian viscosity: the multiphase and
#     materials tables (COV-MULTIPHASE-001, COV-MAT-096, 099).
#   - constitutive laws and data (Hill and Barlat yield, Johnson-Cook, sheet
#     data): the materials table (COV-MAT-012, 066, 067, 075).
#   - weld and bolt strength checks of a finished joint: the structural table
#     (COV-STRUCT-122).
#   - inherent strain and melt-pool cooling of printed metal: the
#     additive-manufacturing table (COV-AM-034, 039).
#   - cutting of soft bodies and the cutting force from a separation criterion:
#     the soft-body and fracture tables (COV-SOFT-076, COV-FRACT-095).
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-MFG-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Search notes: "cast" matches type casts and ray / shape casts; "weld" matches
# the weld (fixed) joint of the rigid-body solver; "cutting" matches soft-body
# cutting; "forming" matches the word "performing". None of these is a
# manufacturing capability.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

