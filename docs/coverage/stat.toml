# Statistical mechanics (STAT) coverage of ALICE-Physics, against an external
# reference frame.
#
# What this table is: every capability that the standard texts (Landau-Binder,
# A Guide to Monte Carlo Simulations in Statistical Physics; Newman-Barkema,
# Monte Carlo Methods in Statistical Physics; Frenkel-Smit, Understanding
# Molecular Simulation), reference implementations (the feature lists of ALPS,
# the thermostat / ensemble fixes of LAMMPS) and standard benchmarks (the 2-D
# Ising model with Onsager's critical temperature and Yang's spontaneous
# magnetisation, exact small-lattice enumeration, Kramers escape, the dragged
# harmonic trap of the Jarzynski equality) expect of a simulator of
# statistical mechanics, one [[item]] per capability, with what the crate has
# today. The rows are written by hand: the axes and the items come from the
# reference frame, not from the modules that exist, so a missing capability is
# visible instead of absent.
#
# Axes: lattice-model / mc-local / mc-advanced / estimator / critical /
# md-ensemble / stochastic-dynamics / kinetic-mc / nonequilibrium / transport /
# free-energy / sequence / benchmark.
#
# What counts as implemented: an API that performs the capability. Parts a
# caller could combine (the seeded generator, the pair potentials, the
# periodic box) are cited in `evidence`, and the row stays `missing`.
#
# Random numbers are written as sequences built deterministically from a seed
# and a stream (src/rng.rs::DeterministicRng, PCG, bit-identical on every
# platform, COV-ENGINE-001 / 002). A Monte Carlo run is then a deterministic
# function of the seed; the rows say "drawn from the seeded sequence", not
# "random".
#
# Boundary with the other tables (one capability goes in one table only; rows
# of the same grain are not made here, the id is cited instead, and a row that
# refines one of them says "COV-X-NNN の子" at the head of `evidence`):
#   - molecular dynamics: force fields, integrators, neighbour lists, periodic
#     box, the NVE observables and the named thermostats and barostats
#     (Berendsen, Nose-Hoover, Langevin, Andersen / Bussi, DPD, Parrinello-
#     Rahman), Brownian dynamics, initial Maxwell-Boltzmann velocities, g(r),
#     mean squared displacement, Green-Kubo, S(k), Lees-Edwards: the particle
#     table (COV-PART-035 to 046, 055, 057, 102 to 110); here the ensemble
#     theory around them (checks that a thermostat samples the right ensemble,
#     fluctuation formulas, the transport coefficients that refine COV-PART-104)
#   - quantum lattice models (Hubbard, transverse-field Ising, Heisenberg
#     chains, Bose-Hubbard) and quantum Monte Carlo: the quantum table
#     (COV-QUANTUM-088 to 090, 094, 132); here the classical lattice models
#   - the generator itself, its streams and its fixed-point distributions, the
#     generator state in a snapshot, and seeded scenario variation: the engine
#     table (COV-ENGINE-001 to 003, 145); here how a Monte Carlo run uses it
#   - the plain Monte Carlo estimator of an integral and variance reduction:
#     the numerical-foundations table (COV-NUM-095 / 096); stochastic decay
#     counts: COV-NUCLEAR-012; Monte Carlo particle and photon transport: the
#     nuclear and optics tables; ensemble data assimilation and global
#     population optimisers: the optimisation table (COV-OPT-047, 082)
#   - reaction rate laws and deterministic kinetics: the chemistry table; here
#     the stochastic (Gillespie / kinetic Monte Carlo) simulation of reactions
#   - chaos, bifurcations, cellular automata, pattern formation and
#     synchronisation: the nonlinear-dynamics table (COV-NONLIN-*)
#   - numerical integrators as such (ODE, symplectic): the numerical-
#     foundations table (COV-NUM-045 to 055)
#
# Fixed-point notes (Fix128 is Q64.64: integer part +-9.2e18, resolution
# 2^-64 ~ 5.4e-20):
#   - k_B in SI is below the resolution, so molecular simulation runs in reduced
#     units (COV-PART-037)
#   - Fix128::exp has a relative error of about 1e-6 for |x| <= 40, returns 0
#     below -44 and saturates above 43 (src/math.rs::exp): Boltzmann factors
#     beyond that range and partition functions or densities of states of more
#     than about 2^63 states are not representable, so a flat-histogram method
#     has to keep ln g(E), and an acceptance test inherits the 1e-6 error of
#     the factor
#   - sums of squared extensive quantities over many samples approach the
#     integer range on large lattices (the estimator rows give the numbers)
#   - multiplication truncates toward minus infinity, which is a bias of the
#     same sign at every product (src/math.rs::Fix128)
#
# Search notes (word collisions found while judging): ising -> localising /
# normalising; critical -> critical damping, critical buckling load, critical
# speed; ensemble -> the NVE ensemble of molecular dynamics only; boltzmann ->
# the constant in molecular dynamics; thermostat -> the bimetal reference in
# bimaterial; histogram -> analytics and pipeline counters; entropy ->
# privacy. No hit for monte, metropolis, langevin, brownian, potts, wolff,
# swendsen, landau, gillespie, jarzynski, kubo, fokker, percolat, partition
# function, free energy, random walk, order parameter, autocorrel.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this crate (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-STAT-NNN) / axis / item / source (book, topic, standard or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate /
# limitation (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).


