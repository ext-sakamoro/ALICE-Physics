# Optimisation, inverse problems, sensitivity, data assimilation, uncertainty
# quantification and reduced-order models (OPT) coverage of ALICE-Physics,
# against an external reference frame.
#
# What this table is: every capability that the standard texts (Nocedal-Wright,
# Numerical Optimization; Bendsoe-Sigmund, Topology Optimization; Kalnay,
# Atmospheric Modeling, Data Assimilation and Predictability; Smith, Uncertainty
# Quantification; Quarteroni-Manzoni-Negri, Reduced Basis Methods for PDEs),
# reference implementations (the feature lists of dolfin-adjoint, OpenMDAO,
# Dakota, PETSc TAO, and the differentiability of JAX MD and Brax) and standard
# benchmarks (MBB beam and cantilever topology optimisation, Rosenbrock, the
# Lorenz-96 twin experiment, the Ishigami function) expect of the side of a
# simulator that is used to design, calibrate, assimilate and learn, one
# [[item]] per capability, with what the crate has today. The rows are written
# by hand: the axes and the items come from the reference frame, not from the
# modules that exist, so a missing capability is visible instead of absent.
#
# Two uses the rows are judged against (tag at the head of `evidence`):
#   [A] shape optimisation of an additively manufactured part through its
#       strength check: geometry -> analysis mesh -> FE -> sensitivity ->
#       update -> strength with the printed anisotropy -> build orientation ->
#       printability report
#   [B] a learner (reinforcement learning, policy optimisation) that uses gradients of its training environment:
#       derivatives of the world step with respect to state, action and
#       parameters, through a horizon, batched
#   [A,B] both, [-] neither of the two (needed by the field in general)
#
# What counts as implemented: an API that performs the capability. Parts that
# a caller could combine (snapshot and branch, seeded generator, several worlds
# stepped together, a linear solve) are cited in `evidence`, and the row stays
# `missing` (the numerical-foundations table counts general components the
# same way). The prerequisites the rows rely on are rows of other tables:
# bit-identical arithmetic (COV-NUM-072 / 073), whole-world snapshot and
# branching (COV-ENGINE-012), several worlds stepped in parallel (COV-ENGINE-041),
# the seeded generator (COV-ENGINE-001), field transfer by sample / splat with
# splat the adjoint of sample (COV-NUM-065, the observation operator of a
# gridded field and its adjoint).
#
# Boundary with the other tables (one capability goes in one table only):
#   - linear and nonlinear equation solvers (Krylov, Newton, line search for
#     Newton, trust region for square systems, quasi-Newton for equations,
#     Newton-Krylov), eigen solvers, FFT, the plain Monte Carlo estimator and
#     variance reduction: the numerical-foundations table (COV-NUM-*); this
#     table uses them
#   - state estimation of a mechanism (Kalman filters, particle filter, observers)
#     and system identification from recorded motion (COV-SENSE-047 to 063,
#     078 to 080); model predictive control (COV-SENSE-068); here the assimilation
#     of a field state and the general inverse-problem machinery
#   - material parameter identification from homogeneous test data
#     (COV-MAT-051), inverse kinematics and inverse dynamics of gait
#     (COV-BIO-019 / 020), reaction-rate sensitivity (COV-CHEM-033): those rows
#     are cited, no row of the same grain is made here
#   - the reinforcement-learning environment interface (reset, step, reward,
#     vectorised envs): the engine table (COV-ENGINE-067); here the derivatives
#     that a gradient-based learner needs from the world
#   - build-orientation search of a printed part (COV-AM-001 / 002 / 007):
#     the additive-manufacturing table; here the general optimisers
#   - goal-oriented error estimation (DWR, COV-FEM-114) and FE modal analysis
#     (COV-FEM-083): the solid FE table
#   - training of network weights: outside this crate (only fixed-point
#     inference is here, COV-ENGINE-127 / COV-SENSE-075)
#
# Ensembles and sampling are written as sets built deterministically from a
# seed and a member index (the generator is portable and bit-identical).
#
# Search notes (word collisions found while judging): optimize -> crater
# pruning (sdf_destruction) and tree builds (bvh), orientation search (AM);
# sensitivity -> privacy budget and fatigue mean-stress / filament data;
# surrogate -> the linear tangent of the modified Newton in FEM; adjoint ->
# splat versus sample (coupled_field); level set -> interface capture of
# multiphase flow; reduced -> reduced integration / coordinates / mass;
# calibrated -> empirical fits; ensemble -> NVE of molecular dynamics;
# design -> prose. No hit for uncertain, assimil, Sobol, Halton, chaos, POD,
# SVD, Pareto, penalt, gradient descent.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this crate (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-OPT-NNN) / axis / item / source (book, topic, standard or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate /
# limitation (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).


