# Geophysics (GEO) coverage of ALICE-Physics, against an external reference
# frame.
#
# What this table is: every capability that the standard textbooks of solid-
# Earth and surface geophysics (Aki-Richards, Quantitative Seismology; Shearer,
# Introduction to Seismology; Schubert-Turcotte-Olson, Mantle Convection in the
# Earth and Planets; Turcotte-Schubert, Geodynamics; Pedlosky, Geophysical Fluid
# Dynamics / Ocean Circulation Theory; Bear, Dynamics of Fluids in Porous Media;
# Chow-Maidment-Mays, Applied Hydrology; Heiskanen-Moritz, Physical Geodesy;
# Merrill-McElhinny-McFadden, The Magnetic Field of the Earth; Pugh, Tides,
# Surges and Mean Sea-Level), reference implementations (SPECFEM3D, ASPECT,
# MODFLOW, HEC-RAS, the IGRF and tidal-prediction tools) and standard benchmarks
# (Lamb's problem, the LOH.1 layer over a half-space, 1-D site amplification,
# the Blankenbach mantle-convection benchmark, Christensen's dynamo benchmark,
# the Stommel gyre, the Theis well, Philip infiltration, Ogata-Banks, Henry's
# saltwater intrusion) expect of a geophysics code, one [[item]] per capability,
# with what the crate has today. The rows are written by hand: the axes and the
# items come from the reference frame, not from the modules that exist, so a
# missing capability is visible instead of absent. Axes: elastic-waves /
# seismic-numerics / source / ground-motion / mantle-convection / lithosphere /
# geomagnetism / geodesy-gravity / ocean-circulation / tides / hydrology /
# groundwater / sediment / benchmark.
#
# The crate has almost none of this field today: the rows mostly declare the
# range. Soil and rock as engineering materials (constitutive laws,
# consolidation, bearing capacity, slopes, liquefaction, excavation, piles,
# frost) are the geotechnical table (docs/coverage/geotech.toml); seismic
# ground motion and site response stay here, their soil curves are there.
#
# Boundary with the other tables (one capability goes in one table only; a row
# here that refines a row of another table says "COV-X-NNN の子" in evidence):
#   - the atmosphere: the environment and atmosphere tables (ENV, ATMOS); the
#     rotating-frame balances shared with the ocean (f / beta plane, Rossby
#     waves, Ekman pumping, mixed layer) are COV-ATMOS-011 to 022 and
#     COV-ATMOS-103 / 104, cited here and not repeated
#   - water-surface waves, shallow-water flow over terrain (COV-ENV-090), flow
#     routing, stream power and hillslope diffusion on a height field
#     (COV-ENV-100 to 102), terrain generation and the height field itself:
#     the environment table; rows here are the hydrological and morphodynamic
#     laws that refine them
#   - material removal by erosion, game-style hydraulic erosion with sediment
#     and talus relaxation: the fracture table (COV-FRACT-084 to 092)
#   - gravity of a planet, J2, spherical-harmonic gravity, tides as an orbit
#     perturbation, Earth-fixed frames and the reference ellipsoid: the orbit
#     table (COV-ORBIT-049 to 093); the surface geodesy and gravity rows here
#     refine them
#   - generic elastodynamics by FE (Newmark, explicit central difference,
#     consistent / lumped mass): the FEM table (COV-FEM-072 to 082); the wave
#     rows here are the seismological capabilities on top of it. Acoustic
#     (pressure) waves: the acoustics table
#   - the field of a magnetic dipole in closed form: the EM table (COV-EM-065);
#     the magnetosphere: the plasma table (COV-PLASMA-110); the magnetometer as
#     a sensor: the sensing table (COV-SENSE-044)
#   - Darcy-Forchheimer momentum sources inside the Navier-Stokes solver: the
#     CFD table (COV-CFD-068); groundwater here is the head-based porous-media
#     flow of hydrogeology
#   - generic linear solvers, preconditioners and multigrid: the numerics table
#     (COV-NUM-025, 026, 028)
#
# Rule used for "composed from existing parts": a scenario counts as
# implemented-no-oracle only when the parts solve the same physics (the FE
# elastodynamics for elastic waves, a kinematic world body for a shaking
# ground). A solver of another field that happens to share the equation (the
# heat-conduction solver for consolidation or groundwater diffusion, the
# acoustic leapfrog for SH waves) is not counted; it is named in
# oracle_candidate as a cheap reference path.
#
# Search notes (words that hit something else): "river" (driver, in solver and
# vehicle code), "porous" (a comment on acoustic speed presets), "cohesion" (SPH
# surface tension), "snow" (ski friction and road weather grip), "sand" (a
# reference title in the Eulerian grid, which has no granular yield), "Rayleigh"
# (Rayleigh damping and Rayleigh scattering), "dipole" (the EM closed form),
# "tide" / "tidal" (0 hits). Rows below that say "grep 0 件" were checked word by
# word.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented (or composed from existing parts of the
#                          same physics), no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-GEO-NNN) / axis / item / source (book, chapter, paper, standard or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Book chapter numbers
# have not been checked against the editions.
#
# Ids of other tables are the ones in those tables when this table was written
# (COV-ATMOS-NNN are the rows of docs/coverage/atmos.toml).
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

