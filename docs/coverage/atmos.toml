# Atmospheric dynamics, cloud physics and tropical cyclones (ATMOS) coverage of
# ALICE-Physics, against an external reference frame.
#
# What this table is: every capability that the standard references for the
# physics side of numerical weather prediction expect, together with the
# verification of deliberate interventions (cloud seeding, sea-surface cooling),
# one [[item]] per capability, with what the crate has today. The reference
# frame: Rogers-Yau, A Short Course in Cloud Physics; Pruppacher-Klett,
# Microphysics of Clouds and Precipitation; Holton, An Introduction to Dynamic
# Meteorology; Emanuel, Atmospheric Convection, and the papers on the potential
# intensity of tropical cyclones (Emanuel 1986, Bister-Emanuel 1998);
# Wallace-Hobbs, Atmospheric Science; the physics feature lists of WRF, CM1 and
# ICON; and standard benchmarks (the 1-D kinematic Kessler warm-rain column, the
# Weisman-Klemp supercell, the Rotunno-Emanuel axisymmetric tropical cyclone,
# Held-Suarez, the resting atmosphere over steep terrain, the closed-form
# potential intensity). The axes and items come from that frame, not from the
# modules that exist. The rows are written by hand.
#
# The crate has no atmospheric model: no prognostic water species, no
# microphysics, no rotating frame, no radiation scheme and no tropical-cyclone
# code. The only implemented row is a scene composed from the incompressible
# Boussinesq flow solver. The table is a statement of the scope, so that the
# laws can be placed when they are written.
#
# Here: the atmospheric equation sets and their balances, moist thermodynamics
# beyond the closed forms of the environment table, aerosol activation, warm and
# ice microphysics, convection and its parameterisation, the surface fluxes and
# radiation as they drive weather, tropical cyclones and their coupling to the
# ocean mixed layer, the verification of interventions, the seeded ensembles,
# the numerics that are specific to atmospheric models, and the benchmarks.
#
# Boundary with the environment table (ENV): ENV keeps the closed forms and
# fields of the environment. Rows of ENV that fall inside this scope are not
# repeated at the same granularity; this table cites them and adds only finer
# rows (each such row names its ENV parent in `evidence`) and capabilities ENV
# does not list:
#   - moist air: COV-ENV-014 to 018 (saturation vapour pressure, humidity
#     measures, virtual temperature, potential temperature and the dry lapse
#     rate, the moist lapse rate and the lifting condensation level); parcel
#     theory COV-ENV-019 (equivalent potential temperature, CAPE / CIN); static
#     stability COV-ENV-020 (N^2)
#   - dynamics: COV-ENV-021 (pressure gradient and Coriolis in a rotating Earth
#     frame; the rotating frame of the flow solver is COV-CFD-067, of an orbit
#     COV-ORBIT-082), COV-ENV-022 (geostrophic and gradient wind), COV-ENV-023
#     (thermal wind), COV-ENV-024 (Ekman spiral), COV-ENV-025 (primitive
#     equations and a nonhydrostatic core, one row there; split here)
#   - weather: COV-ENV-063 (raindrop terminal velocity), COV-ENV-064 (drop-size
#     spectrum and rain rate), COV-ENV-065 (snowfall), COV-ENV-066 (cloud
#     microphysics in one row; the microphysics axes here are its children),
#     COV-ENV-067 (cloud formation and cover), COV-ENV-068 (fog and visibility),
#     COV-ENV-070 (precipitation particles in the wind), COV-ENV-071 (solar
#     position and clear-sky irradiance)
#   - boundary layer: COV-ENV-026 to 031 (wind profiles, Monin-Obukhov,
#     stability classes, boundary-layer height); vortex wind fields
#     COV-ENV-049; wind stress on the sea COV-ENV-092
# Boundary with the other tables:
#   - the numerical solution of the flow (pressure projection, advection
#     schemes, LES closures, Boussinesq buoyancy of the incompressible solver):
#     the CFD table (COV-CFD-017, 043, 059, 060, 065, 106); compressible flow and
#     shocks: the SHOCK table; general operator splitting: COV-NUM-056
#   - heat of phase change in a solid / liquid / gas cell, conduction and
#     engineering radiation (blackbody, view factors, participating media as a
#     heat-transfer solver): the THERM table (COV-THERM-059, 066, 067, 068, 069)
#   - evaporation and condensation at a resolved liquid-gas interface: the
#     MULTIPHASE table (COV-MULTIPHASE-054, 061); here only the sub-grid
#     condensate of a cloud (no interface is resolved)
#   - aerosol chemistry and soot: the CHEM table (COV-CHEM-050); here the
#     aerosol enters only as cloud condensation and ice nuclei
#   - radiance transport in a scattering medium as optics: the OPTICS table
#     (COV-OPTICS-062, 065, 066)
#   - seeded generators, snapshots, bit-identical replay: the ENGINE and NUM
#     tables (COV-ENGINE-001, 012, 016, COV-NUM-073); here the use of them for an
#     atmospheric state; state estimation filters: COV-SENSE-050
# Ensembles are sets of initial states (and of physics perturbations) built
# deterministically from a seed and a member index; the rows here do not use the
# language of estimation.
#
# Search notes: "cloud" (src/cfd_solver.rs particle cloud), "vorticity"
# (vorticity confinement of the particle fluid), "seeding" (particle reseeding,
# rank seeding in the grid tests), "collection" (streamline buffers and other
# containers), "activation" (Arrhenius activation energy, network activation),
# "freezing" / "hail" (frozen bodies, other words), "ensemble" (the NVE ensemble
# of molecular dynamics), "angular momentum" (orbits), "Rayleigh damping"
# (structural damping, src/damping_rayleigh.rs) and "latent" / "condensation"
# (the phase-change effect layer, COV-THERM-069) match other meanings only. Rows
# below that say "src 0 件" were checked word by word.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented (or composed from existing parts), no such
#                          test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`).
#
# keys: id (COV-ATMOS-NNN) / axis / item / source (book, chapter, standard or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Chapter and section
# numbers of the sources have not been checked against the originals. Ids of
# other tables were checked against those tables when this table was written.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

