# Material models and material data (MAT) coverage of ALICE-Physics, against an
# external reference frame.
#
# What this table is: every capability that the standard texts (Ashby, Materials
# Selection in Mechanical Design; Holzapfel, Nonlinear Solid Mechanics;
# Lemaitre-Chaboche, Mechanics of Solid Materials; Ferry, Viscoelastic
# Properties of Polymers; Bird-Armstrong-Hassager, Dynamics of Polymeric
# Liquids), the property databases (MatWeb, NIST, ASM handbooks), reference
# implementations (Abaqus and LS-DYNA material model lists, PhysX and Box2D
# material combine modes) and the standard material tests (uniaxial tension,
# Treloar uniaxial / equibiaxial / pure shear, Maxwell stress relaxation, WLF
# shift, Johnson-Cook flow stress) expect of a code that describes what a
# material is, one [[item]] per capability, with what the crate has today. The
# rows are written by hand: the axes and the items come from the reference
# frame, not from the modules that exist, so a missing capability is visible
# instead of absent.
#
# Two kinds of rows live here: closed-form constitutive laws (a stress, a
# viscosity or a yield function evaluated at one material point) and material
# data (the numbers a law is fed with, their units, sources and lookup).
#
# Boundary with the other tables (one capability goes in one table only):
#   - solving a constitutive law inside finite elements (stress update,
#     consistent tangent, FE paths of hyperelasticity / J2 plasticity /
#     thermal softening): the FEM table (COV-FEM-024 to COV-FEM-046). Here the
#     closed form of the same law; the FE row is cited in `evidence`.
#   - closed-form structural results that consume material data (creep laws
#     Norton / Findley / WLF / Arrhenius rate COV-STRUCT-063 to 071, S-N
#     fatigue curves and their presets COV-STRUCT-046 to 062, lamina Q / ABD /
#     ply failure criteria / micromechanics bounds COV-STRUCT-072 to 089 and
#     COV-STRUCT-082 for the maximum-stress check of src/anisotropic.rs,
#     constrained thermal stress COV-STRUCT-128): the structural table.
#   - how a print process uses the data (build-direction derating of the
#     orthotropic constants COV-AM-053, bridging limits, warp, unknown names in
#     the print pipeline COV-AM-083): the AM table. The filament data itself
#     and its lookup are here.
#   - contact solving with the combined coefficients (combine rules as used by
#     the world COV-RIGID-086, static and kinetic coefficients COV-RIGID-080,
#     the anisotropic friction law COV-RIGID-082, rolling friction
#     COV-RIGID-084): the rigid table. Here the finer rules of the material
#     table itself (rule priority, pair overrides, per-body coefficients) and
#     the coefficient data.
#   - generalised-Newtonian and viscoelastic flow inside a solver: the fluid
#     (COV-CFD-063 / 064) and multiphase tables. The rheological laws are here.
#   - heat conduction with temperature-dependent properties (COV-THERM-009) and
#     the property model forms constant / polynomial / linear-in-T
#     (COV-THERM-018), emissivity (COV-THERM-060), anisotropic conductivity
#     (COV-THERM-012): the heat-transfer table. The thermal property data is
#     here.
#   - dispersive and nonlinear electromagnetic media (COV-EM-044 to 051): the
#     EM table; piezoelectric element equations (COV-COUPLE-040 / 041): the
#     coupling table. Static property data is here.
#   - gas viscosity of air (Sutherland, COV-ENV-012), caloric and species
#     thermodynamic data of gases (COV-CHEM-004 / 005): those tables.
#   - biological tissue laws (COV-BIO-047 and following, Casson blood
#     COV-BIO-080): the biomechanics table. Failure strain of Johnson-Cook
#     (COV-FRACT-043): the fracture table.
#
# Data rows: a test that pins a preset to the literal it was written with, or
# checks only physical invariants (yield below tensile, positive density), is a
# regression check, not an oracle; such a row is `implemented-no-oracle` until a
# test compares the value with the cited source.
#
# Search notes (words that hit something else): `cross` (vector cross product),
# `johnson` (Johnson contact mechanics and buckling), `toughness`
# (src/fracture.rs uses it for a stress threshold of the effect layer),
# `roughness` (collision sound), `relaxation` (solver relaxation), `kelvin`
# (the unit), `Voigt` (Voigt notation, and the Voigt bound in
# src/bimaterial.rs).
#
# Ids of other tables are the ones in those tables when this table was written.
#
# Lubrication axis (second wave): fluid-film, elastohydrodynamic, mixed and
# boundary lubrication and their effect on vehicle brakes, wet roads and
# bearings. The friction laws they feed stay in the contact-material rows
# (Stribeck curve COV-MAT-112, roughness COV-MAT-114, pair data COV-MAT-108);
# Hertz contact and rolling-bearing life are the structural table
# (COV-STRUCT-061, 062); frictional heating is the heat-transfer table
# (COV-THERM-044); the vehicle side of braking and weather grip is the multibody
# table (COV-MBD-037, 043, 046, 138).
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented (a source statement that a
#                          capability is absent is quoted in `evidence`)
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-MAT-NNN) / axis / item / source (book, chapter, paper, database
# or reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

