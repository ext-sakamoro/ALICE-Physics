# Acoustics and waves (ACOUS) coverage of ALICE-Physics, against an external
# reference frame.
#
# What this table is: every capability that the standard textbooks
# (Kinsler-Frey-Coppens-Sanders, Fundamentals of Acoustics; Pierce, Acoustics;
# Kuttruff, Room Acoustics; Fahy, Sound and Structural Vibration;
# Hamilton-Blackstock, Nonlinear Acoustics), reference implementations (k-Wave,
# OpenPSTD, COMSOL Acoustics, Steam Audio, Wwise / FMOD spatial audio) and
# standard benchmarks (rectangular-room eigenfrequencies, open / closed pipe
# resonances, 1/r spreading of a spherical wave, baffled-piston directivity,
# Sabine reverberation time, mass-law transmission loss, Helmholtz resonator)
# expect of an acoustics code, one [[item]] per capability, with what the crate
# has today. The rows are written by hand: the axes and the items come from the
# reference frame, not from the modules that exist, so a missing capability is
# visible instead of absent. Axes: governing equations / medium /
# discretisation (wave-based) / geometric acoustics / boundary / propagation /
# room / structural / source / game-audio / output / benchmark.
#
# Boundary with the other tables (one capability goes in one table only):
#   - natural frequencies and damping of structures in closed form (beams,
#     plates, the thin-wall resonance check of vibration_wall): the structural
#     table; here only the sound they radiate or transmit
#   - elastic waves inside solids discretised by finite elements: the FEM table
#   - electromagnetic waves: the EM table, even where an FDTD grid could share
#     parts with an acoustic one
#   - nonlinear fluid dynamics and shocks (Rankine-Hugoniot, Riemann problems,
#     sonic booms as gas dynamics): the shock table; nonlinear acoustics
#     (Westervelt, Burgers, KZK) stays here
#   - generic numerical parts for waves (linear solvers, time integrators,
#     FFT-free algebra): the numerics table
#   - water-surface gravity waves (wave_ship): not acoustics
#   - spatialisation for playback (HRTF, panning, mixing) belongs to the audio
#     engine and is not counted
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-ACOUS-NNN) / axis / item / source (book, chapter, paper,
# standard or reference-implementation feature; no quoted text) / status /
# evidence (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate /
# limitation (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

