# Compressible flow and shocks (SHOCK) coverage of ALICE-Physics, against an
# external reference frame.
#
# What this table is: every capability that the standard textbooks (Toro,
# Riemann Solvers and Numerical Methods for Fluid Dynamics 3rd ed.; LeVeque,
# Finite Volume Methods for Hyperbolic Problems; Anderson, Modern Compressible
# Flow 3rd ed.; Benson's review of Lagrangian and Eulerian hydrocodes),
# reference implementations (Athena++, Clawpack, LS-DYNA ALE, CTH) and standard
# benchmarks (Sod, Lax, 123 and Toro Tests 1-5, Shu-Osher, the Woodward-Colella
# blast waves, Sedov-Taylor, 2-D Riemann problems of Lax-Liu, double Mach
# reflection, Noh) expect of a compressible-flow and shock code, one [[item]]
# per capability, with what the crate has today. The rows are written by hand:
# the axes and the items come from the reference frame, not from the modules
# that exist, so a missing capability is visible instead of absent.
#
# The two modules at the centre: src/euler_fv.rs (the 1-D finite-volume solver:
# exact and HLLC Riemann solvers, MUSCL, SSP-RK2, three boundary kinds) and
# src/compressible.rs (closed forms: ideal-gas relations, the normal-shock jump,
# stagnation ratios, Riemann invariants). Closed forms and the discrete solver
# are kept on separate rows (axis `closed-form` versus the solver axes).
#
# Boundary with the other tables (one capability goes in one table only):
#   - incompressible flow, its upwind / TVD advection, AMR and unstructured
#     meshes: the CFD table (cfd.toml); rows here are for the compressible
#     solver and cite the CFD ids where the two meet
#   - compressible MHD and its Riemann solvers (HLLD, Brio-Wu, Ryu-Jones): the
#     plasma table (COV-PLASMA-082, -133, -134)
#   - reaction kinetics and the thermochemistry of a detonation (CJ velocity
#     and state, ZND structure in closed form, TNT equivalence): the chemistry
#     table (COV-CHEM-063, -064, -066); the flow solution of detonation and blast
#     waves is here
#   - the speed of sound (COV-ACOUS-011) and linear and weakly nonlinear
#     acoustics (Burgers, Westervelt: COV-ACOUS-008, -009) are in the acoustics
#     table; shocks in the full Euler equations are here
#   - the ideal-gas law p = rho R T as a closed form: the chemistry table
#     (COV-CHEM-001); here only its use as the closure of the solver
#   - generic time integrators and operator splitting: the numerics table
#     (COV-NUM-056); the scheme-specific SSP-RK and CFL rows are here
#   - elastic-plastic impact in solids (Johnson-Cook strength and failure, spall,
#     explicit central-difference FE): the FEM, materials and fracture tables;
#     here the fluid hydrocode and the equations of state of gases, liquids and
#     detonation products (Mie-Grüneisen, JWL)
#   - SPH artificial viscosity and the Tait equation of state for SPH: the CFD
#     table (COV-CFD-081, -083)
#   - the game explosion force field (src/force.rs) is a radial impulse, not a
#     blast wave, and is not counted
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test (benchmark rows: the scene
#                          can be built from existing features, but no test does)
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-SHOCK-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs:line`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Chapter numbers are from the reference editions named above and have not been
# checked against the originals. Reference values marked "参照値要確認" are to be
# checked against the original publication before any test uses them. Lines
# marked "(推測)" were judged from a search that found nothing and are to be
# confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

