# Incompressible flow and turbulence (CFD) coverage of ALICE-Physics, against an
# external reference frame.
#
# What this table is: every capability that the standard textbooks
# (Ferziger-Peric, Computational Methods for Fluid Dynamics; Pope, Turbulent
# Flows; Versteeg-Malalasekera), reference implementations (OpenFOAM, Fluent
# solvers and models) and standard benchmarks (Ghia lid-driven cavity, Armaly
# backward-facing step, Taylor-Green vortex, Poiseuille / Couette, cylinder wake
# Strouhal number, de Vahl Davis natural convection) expect of an incompressible
# CFD code, one [[item]] per capability, with what the crate has today. The rows
# are written by hand: the axes and the items come from the reference frame, not
# from the modules that exist, so a missing capability is visible instead of
# absent. Closed-form modules (non_newtonian, lift_drag, smoke_fire,
# aeroelasticity, compressible) are not counted as solver capabilities; they are
# cited in `evidence` where they are the nearest thing.
#
# Boundary with the other tables (one capability goes in one table only):
#   - compressible flow and shocks: the shock table
#   - multiphase, free surface, level set / VOF, surface tension: the multiphase
#     table (FLIP here is the single-phase transfer; its free surface is there)
#   - fluid-structure interaction and aeroelasticity: the coupling table
#   - atmosphere and wind fields: the environment table
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-CFD-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

