# Structural closed-form and strength-of-materials coverage of ALICE-Physics,
# against an external reference frame.
#
# What this table is: every capability that the standard texts (Roark's
# Formulas for Stress and Strain; Timoshenko-Gere, Theory of Elastic
# Stability; Shigley, Mechanical Engineering Design; Peterson's Stress
# Concentration Factors; Jones, Mechanics of Composite Materials; Blevins,
# Formulas for Natural Frequency and Mode Shape) and their standard check
# values (cantilever tip deflection, Euler load, Kirsch hole K_t = 3, the ABD
# matrix of a [0/90]s laminate) expect of a closed-form structural toolkit, one
# [[item]] per capability, with what the crate has today. The rows are written
# by hand: the axes and the items come from the reference frame, not from the
# modules that exist, so a missing capability is visible instead of absent.
#
# Boundary with the other tables (one capability lives in one table only):
#   - discretised (finite-element) beams, plates, shells, modal and buckling
#     analysis belong to the FEM table; here only closed forms and theory
#     solutions
#   - constitutive models and material data (orthotropic elasticity, J2
#     plasticity, viscoelastic laws, presets) belong to the MAT table; the
#     creep and fatigue laws used as closed-form life models are here
#   - numerical crack growth (stress intensity by FE, J-integral, propagation
#     solvers) belongs to the FRACT table; handbook stress intensity factors
#     and the closed-form Paris integration are here
#   - additive-manufacturing process effects (warping, layer adhesion,
#     wall-thickness detection, print orientation) belong to the AM table
#   - Hertz contact stress is here; the rigid-body and FE tables cite it as an
#     out-of-scope reference
#   - vortex-induced vibration (aeroelasticity) is fluid-structure coupling and
#     not counted here
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test
#                          checks it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented (a source statement that a
#                          capability is absent is quoted in `evidence`)
#   out-of-scope           not a structural closed-form capability (reason in
#                          `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-STRUCT-NNN) / axis / item / source (book, chapter, standard or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Chapter numbers are those the sources
# in src/ cite; the others name the book only.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

