# Engine foundation coverage of ALICE-Physics (determinism, state, network
# synchronisation, world management, bindings, diagnostics, game-engine
# interfaces and the non-physics helpers), against an external reference frame.
#
# What this table is: every capability that the references on deterministic
# simulation and networked physics (Gaffer on Games: Fix Your Timestep,
# Floating Point Determinism, Deterministic Lockstep, Snapshot Interpolation,
# Snapshot Compression, State Synchronization; GGPO rollback; Photon Quantum),
# the engine feature lists of Box2D, Rapier, PhysX, Havok and Jolt
# (serialization, debug renderer, profiler, events, bindings, multi-threading),
# Bullet serialization, the literature behind the non-physics helpers
# (HyperLogLog, DDSketch, Count-Min, differential privacy, robust anomaly
# detection, metric pipelines) and standard engine benchmarks expect, one
# [[item]] per capability, with what the crate has today. The rows are written
# by hand: the axes and the items come from the reference frame, not from the
# modules that exist, so a missing capability is visible instead of absent.
#
# Boundary with the other tables (one capability goes in one table only):
#   - the physical laws and their solvers: the table of each field
#   - collision detection, queries, collision filtering, contact events,
#     triggers, contact hooks, sleeping, substeps and kinematic bodies: the
#     rigid table (COV-RIGID-002, 012, 052, 088 to 090, 093 to 102)
#   - cross-platform bit-exact stepping and the fixed-point number itself:
#     COV-RIGID-014 and COV-NUM-072 to 074, 082, 083 (the golden-hash benchmark
#     on several platforms lives there); here only the float subsystems,
#     iteration order, threads, SIMD and the WebAssembly target
#   - co-simulation (FMI, a coupled participant rolled back and stepped through
#     the C ABI): the coupling table (COV-COUPLE-085, 086); the whole-world
#     snapshot it uses is counted here as an engine capability
#   - distributed parallel numerics (rank transport, all-reduce): the
#     numerical-foundation table (COV-NUM-066 to 071)
#   - sensor models: the sensor table
#   - character controllers, vehicle scenario replay and robot descriptions:
#     the multibody table (COV-MBD-056, 073, 103 to 114)
#   - temperature heat maps and grid streamlines: COV-THERM-089, COV-CFD-096
#   - route choice and navigation of crowds: decided here as not a capability of
#     a physics engine (reference engines ship navigation as a separate AI
#     product), so no row; the local avoidance law stays in the particle table
#     (COV-PART-098)
#   - network transport (sockets, reliability, NAT traversal) is not a physics
#     engine capability and has no row
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-ENGINE-NNN) / axis / item / source (book, paper, article or
# reference-engine feature; no quoted text) / status / evidence
# (`src/...rs:line`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`). "(推測)" marks a row
# whose status rests on a search that may have missed a synonym.
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

