# Chemistry and combustion coverage of ALICE-Physics, against an external
# reference frame.
#
# What this table is: a declaration of the field's extent for a field the crate
# implements only a little of (実装が少ない分野の範囲宣言). Apart
# from one closed-form module (src/smoke_fire.rs: a single-step Arrhenius rate,
# its heat release and soot source, and a Boussinesq buoyancy source) and the
# single-gas ideal-gas law, the crate has no chemistry. The table fixes the
# scope before chemical laws are moved into this crate from elsewhere, so that
# each one has a row to land on. It lists every capability that the standard
# texts (Turns, An Introduction to Combustion; Law, Combustion Physics;
# Kee-Coltrin-Glarborg, Chemically Reacting Flow; Poinsot-Veynante, Theoretical
# and Numerical Combustion; Bard-Faulkner, Electrochemical Methods), reference
# implementations (Cantera, CHEMKIN, OpenFOAM reactingFoam, FDS) and standard
# benchmarks (adiabatic flame temperature of methane-air, laminar burning
# velocity, the Arrhenius plot of ignition delay, the Chapman-Jouguet detonation
# velocity, first-order exponential decay, GRI-Mech 3.0 targets) expect of a
# chemistry and combustion code, one [[item]] per capability. The rows are
# written by hand: the axes and the items come from the reference frame, not
# from the modules that exist.
#
# Boundary with the other tables (one capability goes in one table only):
#   - the flow driven by combustion (heat release as an energy source in the
#     flow solver, a premixed flame front as a level set, the buoyant fire
#     plume): the multiphase table, rows COV-MULTIPHASE-070 to 072. Here the
#     chemistry that produces the source, not the flow that carries it.
#   - Boussinesq buoyancy inside the flow solver and transport of a passive
#     scalar or species by the flow: the CFD table (COV-CFD-060, COV-CFD-066).
#     Here the closed-form source terms and the multicomponent diffusion laws.
#   - heat conduction and thermal radiation, including a reaction heat source
#     in the conduction solver (COV-THERM-043) and gas radiation bands: the
#     thermal table.
#   - compressible flow with shocks (Rankine-Hugoniot, Riemann problems) and
#     the numerical solution of detonation and blast waves: the shock table,
#     which does not exist yet. Here the thermochemistry of a detonation (the
#     Chapman-Jouguet state from an equilibrium calculation) and the closed-form
#     energy of an explosive charge.
#   - general stiff ODE integrators (implicit Euler / BDF, Rosenbrock) and the
#     Robertson kinetics benchmark: the numerics table (COV-NUM-045, 051, 054,
#     087). Here the chemistry that would use them (a reactor model, the
#     splitting of chemistry from transport, positivity of mass fractions).
#   - material property data of solids and fluids: the materials table. Here
#     the thermochemical data of gas-phase species.
#   - electrochemical corrosion as a wear mechanism: the fracture table
#     (COV-FRACT-094). The chemical erosion type of the effect layer
#     (src/erosion.rs) is a wear rate, not chemistry, and is counted there.
#   - flames as light sources (emission of hot gas): the optics table
#     (COV-OPTICS-069).
#   - the game explosion force field (src/force.rs, a radial impulse with a
#     distance falloff) and the explosion crater of the destruction layer
#     (COV-FRACT-074) are not chemistry and are not counted.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-CHEM-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Ids of other tables cited
# in `evidence` (COV-MULTIPHASE-*, COV-THERM-*, COV-NUM-*, COV-FRACT-*,
# COV-OPTICS-*, COV-STRUCT-*) are those of the tables as written at the time of
# this table.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

