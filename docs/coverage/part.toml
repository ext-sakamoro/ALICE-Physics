# Particle-method coverage of ALICE-Physics (molecular dynamics, SPH beyond
# single-phase flow, MPM, DEM, effect particles and crowds), against an external
# reference frame.
#
# What this table is: every capability that the standard textbooks
# (Allen-Tildesley, Computer Simulation of Liquids; Frenkel-Smit, Understanding
# Molecular Simulation; Monaghan 2005 SPH review; Jiang et al. MPM course notes;
# Cundall-Strack 1979 DEM; Helbing-Molnar 1995 social force), reference
# implementations (LAMMPS pair / bond / fix / compute styles, LIGGGHTS granular
# models) and standard benchmarks (LJ equation of state, LJ coexistence, angle of
# repose, silo discharge, pedestrian bottleneck) expect of a particle code, one
# [[item]] per capability, with what the crate has today. The rows are written by
# hand: the axes and the items come from the reference frame, not from the modules
# that exist, so a missing capability is visible instead of absent.
#
# Boundary with the other tables (one capability goes in one table only):
#   - SPH / PBF / FLIP used as a single-phase fluid (kernels Poly6 / Spiky,
#     density summation, equation of state, viscosity, wall repulsion, SPH
#     neighbour hash, incompressible SPH, particle shifting, adaptive time step,
#     FLIP / PIC / APIC transfer): the CFD table (COV-CFD-078 to 092, 117). Here
#     are only the SPH capabilities that are not single-phase flow (kernel
#     families, gradient correction, variable h, SPH solids, SPH heat). A
#     hydrostatic SPH column has no row in either table yet.
#   - free surface, surface tension of particles, multiphase SPH, dam break: the
#     multiphase table (COV-MULTIPHASE-038 to 052, 079)
#   - wiring particles to rigid bodies or to a grid flow (two-way coupling,
#     Euler-Lagrange tracking): the coupling table / COV-MULTIPHASE-067, 068
#   - generic time integrators and the gravitational N-body law (nbody / kepler):
#     the numerical-foundation table (COV-NUM-045 to 047) and the orbit field;
#     nbody is cited here only as evidence for long-range methods
#   - rigid-body contact (impulse / XPBD, sphere pairs in the world step) is the
#     rigid table; a granular DEM contact law is a different system and is
#     counted here. Hertz contact stress in closed form is the structure table.
#   - route choice and navigation of pedestrians: not decided here (left to the
#     engine side); this table has only the force laws and their integration
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-PART-NNN) / axis / item / source (book, paper, standard or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. "(推測)" marks a status that rests on
# a search returning nothing, where a synonym may have been missed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

