# Nuclear and radiation coverage of ALICE-Physics, against an external
# reference frame.
# 実装が無い分野の範囲宣言
#
# What this table is: a declaration of the field's extent for a field the crate
# does not implement yet (radioactive decay, interaction of ionising radiation
# with matter, radiation transport, shielding, neutron transport and reactor
# physics, fusion reaction rates, dosimetry, detector response). It lists every
# capability that the standard texts (Lamarsh-Baratta, Introduction to Nuclear
# Engineering; Duderstadt-Hamilton, Nuclear Reactor Analysis; Knoll, Radiation
# Detection and Measurement; Attix, Introduction to Radiological Physics and
# Radiation Dosimetry; Chilton-Shultis-Faw, Principles of Radiation
# Shielding; Lewis-Miller, Computational Methods of Neutron Transport),
# reference data and implementations (NIST XCOM / ESTAR / PSTAR, ENDF, MCNP,
# OpenMC, Geant4, Serpent, ORIGEN), dose standards (ICRP Publications 72, 74,
# 103, 116; ICRU Reports 57, 85) and standard benchmarks (exponential decay
# over half-lives, the two-member Bateman chain, narrow-beam attenuation in
# lead, the critical radius of a bare homogeneous sphere, the Godiva
# criticality benchmark, the prompt jump of point kinetics) expect of a
# nuclear and radiation code, one [[item]] per capability. Nearly every row is
# missing: the table fixes the scope before any nuclear or radiation law is
# written in this crate, so that each law has a place decided in advance. The
# rows are written by hand: the axes and the items come from the reference
# frame, not from the modules that exist.
#
# The only row that is not missing is the exponential decay law, which the
# generic field operation `ScalarField3D::decay` (src/sim_field.rs) computes
# when the decay constant is passed as its rate; it is implemented-no-oracle
# because no test drives it with a half-life.
#
# Boundary with the other tables (one capability goes in one table only):
#   - transport of visible light and other non-ionising optical radiation
#     (Beer-Lambert of a light beam, radiance transport, Monte Carlo photon
#     transport for light, discrete ordinates for light, diffusion
#     approximation of light): the optics table (COV-OPTICS-062, 064, 067,
#     070, 114). Here ionising radiation (X-rays, gamma rays, charged
#     particles, neutrons); the transport methods appear here as rows for
#     ionising radiation and cite the optics ids.
#   - heat transfer by thermal radiation, and heat conduction solvers: the
#     thermal table (COV-THERM-066 participating media, 039 volumetric heat
#     generation as the receiver of deposited energy). Here the deposition of
#     radiation energy itself.
#   - plasma physics of fusion devices (confinement, magnetohydrodynamics,
#     heating, transport in a plasma): the plasma table. Here the nuclear
#     reaction rates, reaction energetics and the Lawson energy balance.
#   - generic Monte Carlo estimators, eigenvalue solvers (power iteration),
#     ODE integrators and the matrix exponential: the numerical-methods table
#     (COV-NUM-040 power iteration, 045 general ODE interface, 051 implicit
#     integration, 087 stiff ODE benchmark). At the time of writing that table
#     has no row for generic Monte Carlo estimators or the matrix exponential;
#     the nuclear uses of both are rows here.
#   - the deterministic random number generator and its state: the engine
#     table (COV-ENGINE-001, 003). Here the sampling laws of decay and
#     transport built on it.
#   - first-order decay of a chemical reactant: the chemistry table
#     (COV-CHEM-102). Here radioactive decay.
#   - material data in general (densities, compositions): the materials table.
#     Shielding-material compositions are a row here only as the input the
#     radiation laws consume.
#   - the sensor framework (noise, seeds, update rates): the sensing table
#     (COV-SENSE-001, 002). Here the radiation detector response model.
#   - ray intersection with geometry: the rigid-body table (COV-RIGID-096).
#
# Search notes: "decay" (damping, wind shelter ramp, pressure recovery, the
# generic field decay), "gamma" (ratio of specific heats, the JONSWAP
# peak-enhancement factor), "alpha" and "beta" (coefficient names),
# "cross-section" (beam and shape sections), "fusion" (latent heat of fusion,
# a powder-bed process name), "attenuat" (wind sheltering, absorbing layer of
# the field solver), "critical" (critical damping and critical loads),
# "buckling" (column buckling), "k_eff" (an equivalent spring stiffness),
# "reactor" (a well-mixed combustion reactor), "secular" (orbital secular
# drift), "resonance" (structural vibration), "Poisson" (Poisson's ratio and
# the Poisson equation), "detector" (anomaly and stagnation detectors),
# "spectrum" (ocean waves and fatigue loading), "diffusion" (heat and field
# diffusion) and "inverse-square" (gravity and electromagnetic forces) match
# other meanings only. The words nuclear, neutron, half-life, radioactive,
# dose, shield, fission, isotope, Bateman, becquerel, sievert, Compton,
# photoelectric, photon, Bethe, stopping power, Bragg, Breit-Wigner, lethargy,
# kinetics, delayed, reactivity, criticality, xenon, burnup, Lawson, Gamow,
# barn, Avogadro, electron, proton, buildup, albedo, free path, Monte Carlo
# and dead time have no match in src/.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`).
#
# keys: id (COV-NUCLEAR-NNN) / axis / item / source (book, chapter, paper,
# standard or reference-implementation feature; no quoted text) / status /
# evidence (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate /
# limitation (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Sources name books by
# topic, not by chapter number. Ids of other tables cited in `evidence` and
# above (COV-OPTICS-*, COV-THERM-*, COV-NUM-*, COV-ENGINE-*, COV-CHEM-*,
# COV-SENSE-*, COV-RIGID-*) are those of the tables as written at the time of
# this table.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

