# Relativity (REL) coverage of ALICE-Physics, against an external reference frame.
#
# 実装が無い分野の範囲宣言
#
# What this table is: a declaration of the field's extent for a field the crate
# does not implement. The source contains no relativistic kinematics, dynamics,
# metric or geodesic code; every row is missing. It lists every capability that
# the standard texts (Taylor-Wheeler, Spacetime Physics; Rindler, Relativity:
# Special, General, and Cosmological; Misner-Thorne-Wheeler, Gravitation; Will,
# Theory and Experiment in Gravitational Physics; Jackson, Classical
# Electrodynamics ch.11-12 and 14; Rezzolla-Zanotti, Relativistic
# Hydrodynamics; Alcubierre, Introduction to 3+1 Numerical Relativity),
# reference implementations (Einstein Toolkit thorns, GRChombo, REBOUNDx gr /
# gr_full / gr_potential, the Valencia relativistic hydrodynamics codes) and
# standard benchmarks (Mercury perihelion advance, deflection of light at the
# solar limb, Shapiro delay, GPS clock correction, muon lifetime extension,
# Pound-Rebka redshift, invariant mass of a two-body collision, Hulse-Taylor
# period decay, Marti-Muller relativistic shock tube, the apples-with-apples
# numerical relativity tests) expect of a relativity code, one [[item]] per
# capability. The table fixes the scope before any relativity module is
# written. The rows are written by hand: the axes and the items come from the
# reference frame, not from the modules that exist.
#
# Relativity here means: special-relativistic kinematics and dynamics, the
# covariant form of electromagnetism, general relativity in closed form and as
# geodesic motion in a given metric, the post-Newtonian expansion beyond the
# orbit perturbation term, relativistic fluids, the entry of 3+1 numerical
# relativity (declared, not planned), relativistic wave equations of a single
# particle, and the units and time scales these need.
#
# Boundary with the other tables (one capability goes in one table only):
#   - orbits under Newtonian gravity and their perturbations: the orbit table.
#     The 1PN / Einstein-Infeld-Hoffmann N-body law (COV-ORBIT-033), the
#     Schwarzschild 1PN acceleration as an orbit perturbation (COV-ORBIT-055)
#     and the integrated Mercury perihelion benchmark (COV-ORBIT-104) are rows
#     there. Here the closed-form relativistic results, geodesic motion in an
#     exact metric, and post-Newtonian items beyond the perturbation term
#     (PPN parameters, radiation reaction, gravitational waves).
#   - Maxwell's equations solved on a grid and the particle pushers, including
#     the relativistic pushers (COV-EM-079): the electromagnetics table. Here
#     the covariant formalism (field tensor, field transformation, four-current)
#     and the closed-form relativistic motion and radiation of a charge.
#   - non-relativistic charged-particle motion, drifts and plasma models, and
#     relativistic magnetohydrodynamics in flat space: the plasma table. Here
#     relativistic hydrodynamics without magnetic fields and the general
#     relativistic MHD entry on a curved background.
#   - Compton scattering kinematics, nuclear mass defect and binding energy,
#     pair production thresholds: the nuclear table. Here the general two-body
#     collision and decay kinematics they are instances of.
#   - non-relativistic quantum mechanics, including the perturbative fine
#     structure of hydrogen: the quantum table. Relativistic wave equations of a
#     single particle (Klein-Gordon, Dirac) are rows here because that table
#     leaves them to this one. Quantum field theory is not a capability of a
#     physics engine and has no row.
#   - the fixed-point number and its range (Q64.64, overflow, elementary
#     functions): the numerical-foundation table (COV-NUM-072, 076, 083); here
#     only what relativity needs from it (units, the size of c and GM).
#
# Search notes: "Lorentz" matches the Lorentz force (src/electromagnetic.rs),
# the Lorentz-Berthelot mixing rule (src/pair_potential.rs) and Lorentz
# dispersive media (src/maxwell_fdtd.rs); "metric" matches the distance metric
# of src/metric.rs (weighted norms, not a spacetime metric); "Minkowski"
# matches the Minkowski difference of collision geometry; "secular" matches the
# J2 drift of src/kepler.rs ("precession" itself has no match); "periapsis" matches Newtonian
# Kepler orbits; "dilation" matches volumetric dilation in
# src/hyperelastic.rs; "Shapiro" matches a compressible-flow textbook in
# src/compressible.rs; "tensor" matches stress tensors; "gamma" matches the
# ratio of specific heats, a wave spectrum shape and an RNG constant; "clock"
# matches wall-clock time; "speed of light" matches only the normalised unit of
# src/maxwell_fdtd.rs; "hyperbolic" matches the rejected hyperbolic Kepler
# orbits; "horizon" matches the convex-hull horizon edges and "horizontal";
# "deflection" matches beam deflection; "Riemann" matches the Riemann
# invariants of src/compressible.rs; "lapse" matches the lapse rate of
# src/atmosphere.rs; "Dirac" matches the smoothed Dirac delta of the surface
# tension; "Thomas" matches the Thomas tridiagonal algorithm; "connection"
# matches joint and rope connections; "Peters" matches Peterson in the stress
# concentration code; "ISCO", "ADM", "TAI" and "TDB" match only inside other
# words (viscosity, admissible, contain, filament db). "relativis", "geodesic", "Schwarzschild", "Einstein",
# "redshift", "Doppler", "rapidity", "boost", "four-vector", "proper time",
# "post-Newtonian", "Lense-Thirring", "Kerr" and "Christoffel" have no match
# in src/. Rows below that say "src 0 件" were checked word by word.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`).
#
# keys: id (COV-REL-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs:line`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Ids of other tables cited
# in `evidence` (COV-ORBIT-*, COV-EM-*, COV-NUM-*) are those of the tables as
# written at the time of this table.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

