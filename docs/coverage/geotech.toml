# Geotechnics (GEOTECH) coverage of ALICE-Physics, against an external
# reference frame.
#
# What this table is: every capability that the standard textbooks of soil and
# rock mechanics (Terzaghi-Peck-Mesri, Soil Mechanics in Engineering Practice;
# Das, Principles of Geotechnical Engineering / Principles of Foundation
# Engineering; Wood, Soil Behaviour and Critical State Soil Mechanics; Potts-
# Zdravkovic, Finite Element Analysis in Geotechnical Engineering; Kramer,
# Geotechnical Earthquake Engineering; Hoek, Practical Rock Engineering),
# reference implementations (PLAXIS, OpenSees, FLAC, GeoStudio SLOPE/W and
# SIGMA/W, Abaqus soils) and standard benchmarks (Terzaghi 1-D consolidation,
# Mandel's problem, Prandtl's strip footing, critical-state triaxial paths,
# infinite slope, Rankine wall, cavity expansion, LEAP liquefaction tests)
# expect of a geotechnical code, one [[item]] per capability, with what the
# crate has today. The rows are written by hand: the axes and the items come
# from the reference frame, not from the modules that exist, so a missing
# capability is visible instead of absent. Axes: soil-state / constitutive /
# consolidation / bearing-earth-pressure / slope / liquefaction /
# excavation-construction / piles-ssi / frost / resident-earthworks /
# benchmark. The resident-earthworks axis follows what a resident of a
# simulated world does with the ground (dig a hole, heap soil, see it slump,
# stand a load on it) and names the rows it needs.
#
# The crate has almost none of this field today: the rows mostly declare the
# range.
#
# Boundary with the other tables (one capability goes in one table only; a row
# here that refines a row of another table says "COV-X-NNN の子" in evidence):
#   - seismic waves, ground-motion records and site response: the geophysics
#     table (docs/coverage/geo.toml); its equivalent-linear row uses the
#     modulus-reduction curves of this table
#   - groundwater flow, Richards equation, retention curves and seepage: the
#     geophysics table (groundwater axis); here only their geotechnical use
#     (effective stress, consolidation, piping and heave, slope suction)
#   - Drucker-Prager, Mohr-Coulomb and Cam-clay as FE materials: the FEM table
#     (COV-FEM-038 to 040); their yield functions as material laws: the
#     material table (COV-MAT-064, 065); soil data (strength, Mohr-Coulomb
#     parameters): COV-MAT-020; rows here are the geotechnical refinements
#     (dilatancy, critical state, undrained response, soil-specific models)
#   - granular DEM and MPM methods themselves: the particle table
#     (Drucker-Prager MPM COV-PART-069, angle of repose COV-PART-112, column
#     collapse COV-PART-119); FE body force, initial stress and frictional
#     contact: COV-FEM-094, 098, 102
#   - vehicle-soil interaction (Bekker-Wong): the multibody table (COV-MBD-049)
#   - the height field, its editing and terrain processes: the environment
#     table (COV-ENV-094 to 102); erosion and talus relaxation: the fracture
#     table (COV-FRACT-084 to 092)
#   - phase change and the Stefan problem in general: the thermal table
#     (COV-THERM-069 to 074, 098, 099); frozen soil rows here refine them
#   - beams on elastic foundations and base excitation in closed form: the
#     structural table (COV-STRUCT-015, 111); poroelasticity of tissue: the
#     biomechanics table (COV-BIO-055)
#
# Rule used for "composed from existing parts": a scenario counts as
# implemented-no-oracle only when the parts solve the same physics (3-D linear
# elastic FE for an immediate settlement, rigid bodies bouncing on a height
# field for rockfall). The heat-conduction solver solves the same diffusion
# equation as 1-D consolidation, but it is a solver of another field and is not
# counted; it is named in oracle_candidate as a cheap reference path.
#
# Search notes (words that hit something else): "soil" (0 hits in src),
# "consolidat" (0 hits), "cohesion" (SPH surface tension), "Mohr" / "Drucker"
# (0 hits; the von Mises plasticity of src/plastic.rs is J2 only), "pile"
# (0 hits in the geotechnical sense), "slope" (walkable slope of characters,
# terrain slopes in vehicle code, the slope of a curve), "dig" / "excavat"
# (0 hits), "frost" (0 hits), "snow" (ski friction and road weather grip).
# Rows below that say "grep 0 件" were checked word by word.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented (or composed from existing parts of the
#                          same physics), no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-GEOTECH-NNN) / axis / item / source (book, chapter, paper, standard or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs::symbol`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed. Book chapter numbers
# have not been checked against the editions.
#
# Ids of other tables are the ones in those tables when this table was written
# (COV-ATMOS-NNN are the rows of docs/coverage/atmos.toml).
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

