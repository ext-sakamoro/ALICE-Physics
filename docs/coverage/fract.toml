# Fracture, damage and wear (FRACT) coverage of ALICE-Physics, against an
# external reference frame.
#
# What this table is: every capability that the standard texts (Anderson,
# Fracture Mechanics; Tada-Paris-Irwin, The Stress Analysis of Cracks Handbook;
# Lemaitre, A Course on Damage Mechanics; Belytschko et al. on XFEM;
# Bourdin-Francfort-Marigo on the variational / phase-field approach; Archard
# 1953 on wear), reference implementations (Abaqus XFEM, cohesive elements and
# VCCT; LS-DYNA material failure and element erosion; Houdini RBD fracture and
# NVIDIA Blast for real-time destruction) and standard benchmarks (centre-cracked
# plate, double cantilever beam, Kalthoff-Winkler impact, three-point bending,
# pin-on-disc wear) expect, one [[item]] per capability, with what the crate has
# today. The axes and the items come from that reference frame, not from the
# modules that exist.
#
# Boundary with the other tables (one capability goes in one table only):
#   - handbook stress intensity factors and the closed-form integration of the
#     Paris law are in the struct table (COV-STRUCT-059 / 060); here are the
#     numerical evaluation of K / J / G and crack growth driven by it
#   - the fem table has one coarse row per family (COV-FEM-105 LEFM K / J,
#     106 XFEM, 107 cohesive elements, 108 phase-field fracture, 044 continuum
#     damage Lemaitre / Mazars, 109 heuristic SDF fracture out of scope for FE).
#     This table does not repeat those rows: it splits each family into its
#     parts and names the parent fem id in `evidence`. FE elements, meshing and
#     the nonlinear solver themselves are in the fem table
#   - cutting cloth and soft bodies as a geometric operation (plane cut, applying
#     the cut, blade paths, tearing by edge strain) is in the soft table
#     (COV-SOFT-074 to 077); here are the failure criteria that decide where and
#     when material separates
#   - breakable joints are in the rigid table (COV-RIGID-031), breakable rope
#     attachments in the soft table (COV-SOFT-031)
#   - surface recession driven by a heat flux (thermal ablation) is in the therm
#     table (COV-THERM-076); fatigue life by S-N / Miner and creep rupture are in
#     the struct table
#   - erosion as a terrain-generation tool (procedural heightfield shaping) is in
#     the environment / engine tables; here is erosion as material removal by a
#     physical agent, including on SDF terrain
#   - the SDF effect layer (src/fracture.rs, src/erosion.rs,
#     src/sdf_destruction.rs) is counted here, with "効果層" in `evidence`; it is
#     not a continuum model and its rows are separate from the mechanics rows
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-FRACT-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/...rs:line`, `tests/...rs::test_fn`) / oracle_candidate / limitation
# (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

