# Electromagnetics (EM) coverage of ALICE-Physics, against an external
# reference frame.
#
# What this table is: every capability that the standard texts (Taflove-Hagness,
# Computational Electrodynamics; Jackson, Classical Electrodynamics; Jin, The
# Finite Element Method in Electromagnetics), reference implementations (Meep,
# openEMS, COMSOL RF / AC-DC, CST, FEKO, NEC-2) and standard benchmarks (PEC
# cavity resonances, dielectric half-space and slab reflection, waveguide
# cutoff, PML reflection, Mie scattering, dipole antenna, TEAM eddy-current
# problems) expect of an electromagnetic field code, one [[item]] per
# capability, with what the crate has today. The rows are written by hand: the
# axes and the items come from the reference frame, not from the modules that
# exist, so a missing capability is visible instead of absent. Closed-form field
# formulas (src/electromagnetic.rs) are kept on their own rows, separate from
# the field solvers (src/maxwell_fdtd.rs).
#
# Boundary with the other tables (one capability goes in one table only):
#   - forces that fields exert on bodies (the Lorentz force on charged rigid
#     bodies, forces on bodies from a solved field, motional EMF and induction
#     between moving conductors and fields, the Maxwell stress tensor, magnetic
#     levitation), piezoelectricity, Joule heating and other electro-thermal or
#     electro-mechanical couplings: the coupling table. MHD: the coupling and
#     plasma tables.
#   - plasma, particle-in-cell loops and kinetic plasma models: the plasma
#     table. Here only the single-particle pusher, field interpolation and the
#     charge-conserving deposition that a PIC code would call.
#   - geometric and wave optics other than solving Maxwell's equations on a
#     grid or mesh: the optics table.
#   - acoustic FDTD and absorbing layers for sound: the acoustics table, even
#     where the lattice code is similar.
#   - generic linear solvers, eigensolvers and time integrators: the numerics
#     table.
#   - pair potentials between charges in particle simulations (Coulomb, Yukawa,
#     Ewald): the particle table. The gameplay force field `Magnetic` in
#     src/force.rs is a force approximation, not a field model, and is not
#     counted.
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-EM-NNN) / axis / item / source (book, chapter, paper or
# reference-implementation feature; no quoted text) / status / evidence
# (`src/x.rs::symbol`, `tests/x.rs::test_fn`) / oracle_candidate / limitation
# (`<file>::<symbol> '<verbatim quote>'` or `<file> '<quote>'` for module docs, required for partial). Benchmark
# reference values marked "参照値要確認" are to be checked against the original
# source before they become an oracle.

