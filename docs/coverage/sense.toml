evidence = "src/sensors.rs::GaussianNoise src/rng.rs::next_gaussian_pair (Box-Muller in Fix128、9.4 σ を超える裾は出ない: 確率 4e-21) tests/analytic_sensors.rs::gaussian_moments_match_the_standard_normal tests/analytic_sensors.rs::gaussian_matches_f64_box_muller tests/analytic_sensors.rs::gaussian_is_bit_reproducible"
oracle_candidate = ""
limitation = ""

