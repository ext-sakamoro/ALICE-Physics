# Sensing, state estimation and control (SENSE) coverage of ALICE-Physics,
# against an external reference frame.
#
# What this table is: every capability that the standard texts (Thrun-Burgard-Fox,
# Probabilistic Robotics; Groves, Principles of GNSS, Inertial, and Multisensor
# Integrated Navigation; Astrom-Murray, Feedback Systems; IEEE Std 952 for gyro
# noise and the Allan variance), reference implementations (the sensor and
# control features of Gazebo, Isaac Sim, CARLA and MuJoCo) and standard
# benchmarks (lidar range accuracy and angular resolution, IMU Allan variance,
# the steady-state gain of a 1-D Kalman filter, LQR of an inverted pendulum, the
# step response of a PID loop) expect of the physics side of sensing and control,
# one [[item]] per capability, with what the crate has today. The rows are
# written by hand: the axes and the items come from the reference frame, not from
# the modules that exist, so a missing capability is visible instead of absent.
#
# Boundary with the other tables (one capability goes in one table only):
#   - intersection of rays and shapes with collision geometry (raycast, shape
#     cast, query filters) and trigger / sensor volumes: the rigid-body table
#     (COV-RIGID-089, 096-100); here the sensors built on it
#   - equations of motion of vehicles and robots, actuators, joint motors and
#     the control laws tied to them (single-axis PD drive COV-RIGID-030;
#     joint-space PD, computed-torque, operational-space / impedance control,
#     PID with anti-windup and trajectory generation COV-MBD-084 to 088; driver
#     model, traction and stability control, multirotor allocation): the
#     rigid-body and multibody tables; here the control laws and estimators
#     that do not depend on a particular mechanism
#   - radiometry of light at the sensor (camera exposure, lens distortion and
#     depth of field, lidar return intensity): the optics table; here the
#     geometry of the measurement
#   - the standard atmosphere and magnetic / electric fields themselves: the
#     environment and electromagnetics tables; here the sensors reading them
#   - determinism and network synchronisation of the simulation: the engine
#     table; training of neural controllers belongs to the machine-learning
#     crate, only inference is counted here
#
# status (exactly one of):
#   implemented+oracle     implemented, and at least one non-ignored test checks
#                          it against an independent reference
#   implemented-no-oracle  implemented, no such test
#   partial                implemented with a restriction that the source states;
#                          `limitation` quotes it, and the source carries a
#                          `LIMITATION(<id>)` comment at that place
#   missing                not implemented
#   out-of-scope           not a capability of this field (reason in `evidence`)
#
# This axis is separate from the test ignore reasons (`known defect: ...`,
# `src gap: ...`, `diagnostic`, `runtime`). A capability that exists with a
# recorded defect keeps its status and cites the known-defect test in
# `evidence`; it is not `missing`.
#
# keys: id (COV-SENSE-NNN) / axis / item / source (book, chapter, paper,
# standard or reference-implementation feature; no quoted text) / status /
# evidence (`src/...rs:line`, `tests/...rs::test_fn`) / oracle_candidate /
# limitation (verbatim quote of the source, required for `partial`).
#
# Reference values marked "参照値要確認" are to be checked against the original
# publication before any test uses them. Lines marked "(推測)" were judged from
# a search that found nothing and are to be confirmed.
#
# Checked by scripts/coverage_check.py (tests: scripts/test_coverage_check.py).

[[item]]
id = "COV-SENSE-001"
axis = "noise"
item = "additive zero-mean white Gaussian noise on a reading, seeded and bit-reproducible"
source = "Groves, Principles of GNSS, Inertial, and Multisensor Integrated Navigation ch.4 (sensor error models); Gazebo / Isaac Sim / CARLA / MuJoCo sensor plugins (gaussian noise)"
