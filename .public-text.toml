# Settings for the public text check (scripts/public_text.sh).
#
# scripts/docs_lint.py holds this repository's own list of words a public document
# must not use, and scripts/test_docs_lint.py feeds that list the words it must
# catch: both files name those words on purpose. scripts/test_land.py tests the
# landing tool's own commit message check. Each entry allows one kind of finding
# in one file, with the exact number of lines; a different number fails the
# check, so a new line of that kind in these files is a finding again.

[public-text]

[[public-text.allow]]
path = "scripts/docs_lint.py"
class = "agent process"
count = 5
why = "the documentation linter's word list"

[[public-text.allow]]
path = "scripts/docs_lint.py"
class = "device"
count = 1
why = "the documentation linter's word list"

[[public-text.allow]]
path = "scripts/docs_lint.py"
class = "internal tracker"
count = 1
why = "the documentation linter's word list"

[[public-text.allow]]
path = "scripts/docs_lint.py"
class = "note link"
count = 1
why = "the documentation linter's word list"

[[public-text.allow]]
path = "scripts/test_docs_lint.py"
class = "agent process"
count = 21
why = "test inputs for the documentation linter"

[[public-text.allow]]
path = "scripts/test_docs_lint.py"
