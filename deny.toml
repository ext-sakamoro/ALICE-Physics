# cargo-deny 設定 (v0.14+ schema)
# https://embarkstudios.github.io/cargo-deny/
#
# ALICE-SDF v1.7.7 (commit 52d26f9) の deny.toml を base に ALICE-Physics 用に調整
#
# ALICE-Physics 自体は LicenseRef-Proprietary (publish = false なので [licenses.private] で除外)
# sibling stubs (alice-ml/alice-analytics) は alice-stubs action で
# "MIT OR Apache-2.0" で生成される

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec CVE + yanked)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
ignore = [
    # ALICE-Physics 側 pyo3 0.27.2 の CVE 群 全て 0.29 移行で解消可
    # (ALICE-SDF で同 pattern の 0.23→0.29 migration 済)
    # 移行完了時に全 ignore 削除
    "RUSTSEC-2026-0176",  # nth/nth_back out-of-bounds read (0.24+ 導入、0.29 で fix)
    "RUSTSEC-2026-0177",  # PyCFunction::new_closure Sync 欠落 (0.29 で fix)
    "RUSTSEC-2025-0020",  # PyString::from_object buffer overflow (0.24.1+ で fix、参考用に残置)
]

# ---------------------------------------------------------------------------
# Licenses (allow-list 方式)
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
]

# this crate is publish = false and LicenseRef-Proprietary: unpublished
# workspace crates are not checked against the allow list
[licenses.private]
ignore = true

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
version = "*"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# ALICE ecosystem dependency crates: each exception allows the licence that
# dependency declares at the version this workspace resolves
[[licenses.exceptions]]
name = "alice-crypto"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-ml"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "alice-analytics"
allow = ["AGPL-3.0-or-later"]

# ---------------------------------------------------------------------------
# Bans (banned crate / duplicate / wildcard)
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"   # path dep が wildcard version になるため必須
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
