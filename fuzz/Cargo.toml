[package]
name = "alice-physics-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.alice-physics]
path = ".."
features = ["std", "parallel"]

[features]
# the parity target compares `step` with `step_parallel`; the feature is on by
# default so the plain `cargo fuzz build` covers both paths
default = ["parallel"]
parallel = ["alice-physics/parallel"]

# cargo-machete false-positive 予防 (canonical [[reference_alice_ci_canonical_template]] 罠 #3)
[package.metadata.cargo-machete]
ignored = ["libfuzzer-sys"]

[[bin]]
name = "fuzz_step"
path = "fuzz_targets/fuzz_step.rs"
doc = false

[[bin]]
name = "fuzz_collision"
path = "fuzz_targets/fuzz_collision.rs"
doc = false

# 128-bit fixed-point scene serialize roundtrip の bit-exact 保証
# (決定論 lockstep が physics engine core value のため必須 fuzz)
[[bin]]
name = "fuzz_deterministic_roundtrip"
path = "fuzz_targets/fuzz_deterministic_roundtrip.rs"
doc = false

# Distance-constraint joint chain — XPBD の
# 退化 configuration (zero-length target / coincident anchors) 耐性
[[bin]]
name = "fuzz_joint"
path = "fuzz_targets/fuzz_joint.rs"
doc = false

# 統合 CFD solver — MAC grid + temperature scalar + 3 advection scheme の
# seeded discontinuity 耐性 (数値安定性 gate)
[[bin]]
name = "fuzz_cfd"
path = "fuzz_targets/fuzz_cfd.rs"
doc = false

# Continuous collision detection — sphere_sphere_toi / sphere_plane_toi の
# swept-input 耐性 (zero velocity / coincident start / degenerate normal 等)
[[bin]]
name = "fuzz_ccd"
path = "fuzz_targets/fuzz_ccd.rs"
doc = false

# Triangle mesh — from_indexed + raycast + closest_point の
# degenerate 入力耐性 (out-of-bounds index / zero ray / coincident vertex 等)
[[bin]]
name = "fuzz_trimesh"
path = "fuzz_targets/fuzz_trimesh.rs"
doc = false

# Structural solver — CantileverEndPoint 荷重 + Rectangular section + PLA 材料の
# 極端 aspect ratio / heavy load 耐性 (Roark/Euler formula 数値安定性 gate)
[[bin]]
name = "fuzz_structural"
path = "fuzz_targets/fuzz_structural.rs"
doc = false

[workspace]
members = ["."]

# 1.2.0: step / step_parallel bit-exact parity on arbitrary scenes (contacts +
# rods + sleeping + kinematic), the SDF `fuzz_eval_parity` pattern
[[bin]]
name = "fuzz_step_parity"
path = "fuzz_targets/fuzz_step_parity.rs"
doc = false
