[package]
name = "alice-physics-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.alice-physics]
path = ".."
features = ["std"]

# cargo-machete false-positive 予防 (canonical [[reference_alice_ci_canonical_template]] 罠 #3)
[package.metadata.cargo-machete]
ignored = ["libfuzzer-sys"]

[[bin]]
name = "fuzz_step"
path = "fuzz_targets/fuzz_step.rs"
doc = false

[[bin]]
name = "fuzz_collision"
path = "fuzz_targets/fuzz_collision.rs"
doc = false

# 128-bit fixed-point scene serialize roundtrip の bit-exact 保証
# (決定論 lockstep が physics engine core value のため必須 fuzz)
[[bin]]
name = "fuzz_deterministic_roundtrip"
path = "fuzz_targets/fuzz_deterministic_roundtrip.rs"
doc = false

[workspace]
members = ["."]
